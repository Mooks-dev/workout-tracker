/* ── self-hosted fonts (Appendix B) — the app is offline-first everywhere
   except its typography if these come off a CDN; a cold first launch with
   no signal would silently fall back to Georgia. Latin-only subset (this
   app is English-only), ~126KB total, precached by the service worker. */
@font-face{font-family:'Cinzel';font-style:normal;font-weight:400;font-display:swap;
  src:url('assets/fonts/cinzel-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Cinzel';font-style:normal;font-weight:600;font-display:swap;
  src:url('assets/fonts/cinzel-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Cinzel';font-style:normal;font-weight:700;font-display:swap;
  src:url('assets/fonts/cinzel-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:400;font-display:swap;
  src:url('assets/fonts/eb-garamond-400-italic.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:400;font-display:swap;
  src:url('assets/fonts/eb-garamond-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:500;font-display:swap;
  src:url('assets/fonts/eb-garamond-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:600;font-display:swap;
  src:url('assets/fonts/eb-garamond-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;
  src:url('assets/fonts/ibm-plex-mono-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;
  src:url('assets/fonts/ibm-plex-mono-500-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;
  src:url('assets/fonts/ibm-plex-mono-600-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* ── surfaces ── */
  --bg:#e7dcc4; --bg2:#efe6d2; --card:#f4eddc; --card2:#eadfc4;
  --border:#cdb994;                 /* was #d6c6a2 — too low-contrast to read as an edge */
  /* ── brand ── */
  --acc:#8f1a1a;                    /* oxblood, primary action — 8.4:1 on card */
  --acc-h:#a52323;
  --ink:#f9f3e4;                    /* text on oxblood */
  --gold:#a67f22;                   /* rings, brackets, borders */
  --gold-d:#7f6018;                 /* gold, text-safe on card — 5.4:1 */
  /* ── text: every value below passes AA on --card ── */
  --text:#2c2318;                   /* 12.1:1 */
  --muted:#6b5a3c;                  /* 5.9:1 — was #8a7856 @ 3.9:1, under AA */
  --faint:#8a7856;                  /* 3.9:1 — decorative and placeholders ONLY, never body copy */
  /* ── semantic ── */
  --bad:#8f1a1a;
  --good:#55602c;                   /* 5.2:1 — was #6f7a3f @ 3.2:1 */
  --warn:#8a5a10;
  /* ── category ── */
  --cat-weights:#8f1a1a; --cat-hiit:#8a5a10; --cat-crossfit:#33514f;
  /* ── type: three roles, three fonts, names that are true ── */
  --display:'Cinzel','EB Garamond',Georgia,serif;                    /* headings, small caps labels */
  --body:'EB Garamond',Georgia,'Times New Roman',serif;              /* prose */
  --num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace; /* numbers that change or align */
  /* ── deprecated aliases, kept so the rest of the sheet needs no other edits ── */
  --sans:var(--body); --mono:var(--num);
  --blue:var(--gold); --teal:var(--gold);
  --weights:var(--cat-weights); --hiit:var(--cat-hiit); --crossfit:var(--cat-crossfit);
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% -10%,var(--bg2),var(--bg)) fixed;color:var(--text);font-family:var(--sans);line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-size:16.5px}
/* ── Roman display type for headings & labels ── */
.h1,.item-title,.stat-val,.hero-h1,.tm-big,.ov-title .t,.seg button,.btn-acc,.btn-lg{font-family:var(--display);letter-spacing:.01em}
.eyebrow,.sec-label,.stat-lbl,.item-eyebrow,.grp,.tab span,.tag,.badge,.tm-label,.lbl,.log-date{font-family:var(--display)!important;letter-spacing:.14em}
.app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column}

/* ── views ── */
.view{flex:1;padding:24px 22px calc(96px + env(safe-area-inset-bottom));display:none}
.view.active{display:block}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.h1{font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1.05;margin-bottom:6px}
.lede{color:var(--muted);font-size:14px;margin-bottom:22px;max-width:44ch}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.card+.card{margin-top:12px}
.soft{color:var(--muted);font-size:14px;line-height:1.55}

/* ── buttons ── */
.btn{font-family:var(--sans);font-size:15px;font-weight:600;padding:13px 18px;border-radius:12px;
  border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;
  transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn-acc{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.btn-acc:hover{background:var(--acc-h)}
.btn-block{width:100%}
.btn-sm{font-size:13px;padding:8px 12px;border-radius:10px}
.btn-ghost{background:transparent}
.btn-danger{color:var(--bad);border-color:rgba(143,26,26,.35);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row-t{display:flex;gap:10px;align-items:center}

/* ── inputs ── */
.inp{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-family:var(--sans);font-size:16px;padding:13px 15px;outline:none;transition:.15s}
.inp:focus{border-color:var(--blue)}
.inp::placeholder{color:var(--faint)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ── tags ── */
.tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 9px;border-radius:6px}
.tag-weights{background:rgba(143,26,26,.14);color:var(--cat-weights)}
.tag-hiit{background:rgba(156,107,31,.16);color:var(--cat-hiit)}
.tag-crossfit{background:rgba(74,107,107,.18);color:var(--cat-crossfit)}
.tag-hard{background:rgba(143,26,26,.16);color:var(--bad)}
.tag-mod{background:rgba(143,26,26,.12);color:var(--acc)}
.tag-run{background:rgba(184,145,47,.16);color:var(--blue)}

/* ── stat grid ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.stat-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:7px;margin-bottom:12px}
.stat-lbl svg{width:15px;height:15px;stroke:var(--muted)}
.stat-val{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat-val small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}

/* ── list item card ── */
.item{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;
  cursor:pointer;transition:.15s;margin-bottom:12px}
.item:active{transform:scale(.99)}
.item.hl{border-color:rgba(184,145,47,.55)}
.item-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.item-title{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.item-sub{color:var(--muted);font-size:13px;line-height:1.5}
.sec-label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
.sec-label:first-child{margin-top:0}

/* ── banner ── */
.banner{border:1px solid rgba(143,26,26,.4);background:rgba(143,26,26,.06);border-radius:14px;
  padding:16px 18px;color:var(--acc);font-size:14px;font-weight:500;margin-bottom:16px}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:14px}

/* ── account chip ── */
.acct{display:none;align-items:center;justify-content:flex-end;gap:8px;padding:16px 22px 0;min-height:46px}
.acct .dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.acct .dot.ok{background:var(--good)} .acct .dot.err{background:var(--bad)}
.acct .dot.sync{background:var(--acc);animation:blink .9s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ── bottom nav ── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(238,228,204,.92);backdrop-filter:blur(12px) saturate(1.1);border-top:1px solid var(--border);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav-inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:12px;
  border:1.5px solid transparent;background:none;color:var(--muted);cursor:pointer;transition:.15s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tab span{font-size:10px;font-weight:600;letter-spacing:.01em}
.tab.active{color:var(--acc);border-color:transparent}

/* ── session overlay ── */
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
.overlay.active{display:flex}
.ov-head{position:sticky;top:0;background:rgba(238,228,204,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  display:flex;align-items:center;gap:12px;z-index:2}
.ov-back{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card2);
  color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ov-back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.ov-title{flex:1;min-width:0}
.ov-title .t{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-title .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ov-body{flex:1;overflow-y:auto;padding:18px 18px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

/* ── session rows ── */
.warmbox{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:12px;padding:13px 16px;font-size:13px;color:var(--muted);margin-bottom:14px}
.warmbox.done{opacity:.55}
.grp{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.lift{position:relative;background:
    repeating-linear-gradient(115deg,rgba(184,145,47,.055) 0 2px,transparent 2px 26px),
    var(--card);
  border:1px solid var(--border);border-radius:8px;padding:15px 17px;margin-bottom:12px;transition:.15s}
.lift::before,.lift::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--gold);opacity:.75;pointer-events:none}
.lift::before{left:-1px;top:-1px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.lift::after{right:-1px;bottom:-1px;border-left:none;border-top:none;border-radius:0 0 8px 0}
.lift.done{border-color:rgba(111,122,63,.55)}
.lift.done::before,.lift.done::after{border-color:var(--good)}
.lift-top{display:flex;align-items:flex-start;gap:12px}
.lift-info{flex:1;min-width:0}
.lift-name{font-size:15px;font-weight:600}
.lift-scheme{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d);background:rgba(184,145,47,.14);
  border:1px solid rgba(184,145,47,.4);padding:2px 8px;border-radius:3px}
.chk{width:48px;height:48px;flex-shrink:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  border:2px solid var(--gold);background:var(--card2);
  color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:.15s}
.chk.on{background:var(--good);border-color:var(--good);color:var(--ink);
  filter:drop-shadow(0 0 6px rgba(85,96,44,.55))}
.lift-ctl{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:11px;border-top:1px dashed var(--border);flex-wrap:wrap}
.wt{position:relative}
.wt input{width:100px;background:none;border:none;border-bottom:2px solid var(--gold);border-radius:0;color:var(--acc);
  font-family:var(--mono);font-weight:700;font-size:19px;padding:2px 26px 5px 2px;text-align:right;outline:none}
.wt input:focus{border-color:var(--acc)}
.wt .u{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.prev{font-family:var(--mono);font-size:11px;color:var(--muted)}
.prev .up{color:var(--good)} .prev .dn{color:var(--bad)}
.mini{font-family:var(--mono);font-size:12px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);color:var(--muted);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.mini:hover{border-color:var(--muted);color:var(--text)}
.mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.mini.on{border-color:var(--acc);color:var(--acc)}
/* HUD-styled controls, scoped to the session screen only.
   Brackets are drawn (border-left/right), not typed via ::before/::after
   content, so a screen reader doesn't announce "left bracket … right bracket". */
#session .mini{font-size:11.5px;letter-spacing:.02em;padding:8px 12px;border-radius:3px;
  border-top:1px solid rgba(184,145,47,.4);border-bottom:1px solid rgba(184,145,47,.4);
  border-left:2px solid rgba(166,127,34,.6);border-right:2px solid rgba(166,127,34,.6);
  background:rgba(184,145,47,.08);color:var(--gold-d)}
#session .mini:hover{border-color:var(--gold);color:var(--text);background:rgba(184,145,47,.16)}
#session .mini.on{border-color:var(--acc);color:var(--acc);background:rgba(143,26,26,.08)}
.desc{color:var(--muted);font-size:13px;line-height:1.6;margin-top:8px}
/* per-set logging */
.sets-panel{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;flex-direction:column;gap:8px}
.sets-panel.open{display:flex}
.set-line{display:flex;align-items:center;gap:8px}
.set-lbl{font-family:var(--mono);font-size:11px;color:var(--muted);width:22px;flex-shrink:0}
.set-line .x{font-family:var(--mono);font-size:11px;color:var(--faint)}
.reps-inp{width:64px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);
  font-family:var(--mono);font-size:14px;padding:8px 10px;text-align:center;outline:none}
.reps-inp:focus{border-color:var(--acc)}
.rpe-inp{width:58px;background:var(--card2);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14px;
  padding:8px 6px;text-align:center;outline:none}
.rpe-inp:focus{border-color:var(--gold)}
.rpe-inp::placeholder{color:var(--faint);font-size:10px;letter-spacing:.06em}
.set-line{gap:7px}
.set-line .wt input{width:78px;font-size:17px}
#session .mini.sug{border-color:var(--good);color:var(--good);background:rgba(85,96,44,.09)}

.runpip{display:block;width:fit-content;margin:14px auto 0;
  font-family:var(--display);letter-spacing:.1em;font-size:9.5px;padding:6px 13px;border-radius:11px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  cursor:pointer;white-space:nowrap}
.runpip.on{border-color:var(--good);color:var(--good);background:rgba(85,96,44,.09)}
.ex-note{font-size:12px;color:var(--teal);margin-top:3px;font-style:italic}
.ex-cue{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px;max-width:340px}
/* pre-start preview: lifts + WOD/block breakdown, each item legible on its own line */
.prev-sec{margin-bottom:14px}
.prev-sec:last-child{margin-bottom:0}
.prev-h{font-weight:700;color:var(--text);margin-bottom:6px}
.prev-lift{margin-bottom:10px}
.prev-lift:last-child{margin-bottom:0}
.prev-lift-top{display:flex;justify-content:space-between;gap:10px;color:var(--text);font-weight:600}
.prev-lift-top .s{font-family:var(--mono);font-weight:400;color:var(--faint);white-space:nowrap}
.prev-line{color:var(--muted)}
.wod-format{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-d);margin-bottom:8px}
.wod-items{display:flex;flex-direction:column;gap:6px}
.wod-item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  border-bottom:1px dashed var(--border);padding-bottom:6px;color:var(--text)}
.wod-item:last-child{border-bottom:none;padding-bottom:0}
.wod-item .s{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.wod-rest{font-size:12px;color:var(--muted);margin-top:8px;font-style:italic}
.note-inp{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);
  font-size:13px;padding:8px 12px;outline:none;margin-top:8px;display:none}
.note-inp.open{display:block}
.note-inp:focus{border-color:var(--teal)}
/* mini progress chart */
.mbar-row{display:flex;align-items:flex-end;gap:5px;height:64px;margin-top:14px}
.mbar{flex:1;background:var(--card2);border:1px solid var(--border);border-bottom:none;border-radius:5px 5px 0 0;
  position:relative;min-height:5px}
.mbar.last{background:rgba(184,145,47,.24);border-color:var(--acc)}
.mbar span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--muted);white-space:nowrap}
.ticks{display:flex;gap:6px;margin-top:12px}
.tick{flex:1;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--muted);
  font-family:var(--mono);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px}
.tick.on{background:rgba(111,122,63,.2);border-color:var(--good);color:var(--good)}
.opt{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--faint);border:1px solid var(--border);
  border-radius:5px;padding:2px 6px;text-transform:uppercase}

/* ── fullscreen timer ── */
.timer{position:fixed;inset:0;z-index:90;background:radial-gradient(120% 80% at 50% 0%,#efe6d2,#e0d3b6);display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;text-align:center}
.timer.active{display:flex}
.timer.rest{background:radial-gradient(circle at 50% 30%,#dfe6d0,#d7cbb0 74%)}
.timer.work{background:radial-gradient(circle at 50% 30%,#f0e2c6,#e2d0a8 74%)}
.timer.go{background:radial-gradient(circle at 50% 30%,#e6ecd2,#d3c9a2 74%)}
.tm-label{font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin-bottom:8px;max-width:90%}
.tm-ring{position:relative;width:min(74vw,340px);height:min(74vw,340px);margin:6px 0 18px}
.tm-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tm-ring .bg{stroke:rgba(184,145,47,.28);fill:none}
.tm-ring .fg{fill:none;stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .3s}
.timer.rest .tm-ring .fg{stroke:var(--blue)} .timer.go .tm-ring .fg{stroke:var(--good)}
.tm-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tm-big{font-family:var(--mono);font-size:64px;font-weight:500;letter-spacing:-.02em;line-height:1}
.tm-sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.tm-next{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:20px;min-height:16px}
.tm-ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:420px}
.tm-presets{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.tm-preset{font-family:var(--mono);font-size:13px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);color:var(--muted);cursor:pointer}
.tm-preset.on{border-color:var(--acc);color:var(--acc)}

/* ── toast ── */
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:14px;
  z-index:120;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s;white-space:nowrap;pointer-events:none;font-weight:500;
  opacity:0;visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.toast.ok{border-color:var(--good);color:var(--good)}

/* ── picker chips ── */
.seg{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;font-family:var(--sans);font-size:14px;font-weight:600;padding:12px;border-radius:12px;
  border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}

.log-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.log-row:last-child{border-bottom:none}
.log-date{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:56px}
.log-main{font-family:var(--mono);font-size:16px;font-weight:600;flex:1}
.log-sub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.bar{flex:1;background:var(--card2);border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;
  position:relative;min-height:6px;display:flex;align-items:flex-start;justify-content:center}
.bar.last{background:rgba(184,145,47,.22);border-color:var(--acc)}
.bar span{position:absolute;top:-18px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.bar em{position:absolute;bottom:-18px;font-family:var(--mono);font-size:9px;color:var(--faint);font-style:normal}

.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer}
.pick:last-child{border-bottom:none}
.pill{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--card2);color:var(--muted);cursor:pointer}
.pill.on{border-color:var(--acc);color:var(--acc)}
hr.d{border:none;border-top:1px solid var(--border);margin:22px 0}

/* ── ember additions ── */
.btn-lg{font-size:16px;padding:16px 18px}
.hero{position:relative;border-radius:20px;overflow:hidden;height:210px;margin-bottom:14px;background:var(--card)}
.hero-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-media svg{position:absolute;right:-30px;bottom:-30px;width:200px;height:200px;opacity:.13;stroke:#fff;fill:none;stroke-width:1}
.hero-media.weights{background:radial-gradient(120% 120% at 15% 0%,#8f1a1a 0%,#7a3a17 45%,#241712 100%)}
.hero-media.hiit{background:radial-gradient(120% 120% at 15% 0%,#9c6b1f 0%,#7d2f1c 45%,#241512 100%)}
.hero-media.crossfit{background:radial-gradient(120% 120% at 15% 0%,#4a6b6b 0%,#1d5a58 45%,#10201f 100%)}
.hero-ph{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(transparent 32%,rgba(17,18,20,.92))}
.hero-txt{position:absolute;left:18px;right:18px;bottom:18px}
.hero-ey{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.hero-h1{font-size:30px;font-weight:800;letter-spacing:.01em;margin-top:6px;text-transform:uppercase;line-height:1.02}
.hero-sub{font-size:13px;color:#c9cdd2;margin-top:5px}
.empty-hero{height:auto;padding:24px}
.empty-hero .hero-txt{position:static}
.empty-hero .hero-h1{text-transform:none}
.week{display:flex;gap:8px;flex-wrap:wrap}
.wk{flex:1 1 44px;min-width:44px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 4px;text-align:center;cursor:pointer}
.wk-d{font-size:11px;color:var(--muted);font-weight:600}
.wk-i{margin-top:6px;font-size:14px;height:18px;line-height:1}
.wk.done{opacity:1} .wk.done .wk-i{color:var(--good)}
.wk.rest{opacity:.75;border-style:dashed}
.wk.rest .wk-i{color:var(--faint)}
.wk.now{background:rgba(184,145,47,.16);border-color:var(--acc)} .wk.now .wk-d,.wk.now .wk-i{color:var(--acc)}
.wk.run .wk-i{color:var(--teal)}
.tm-round{display:flex;align-items:center;justify-content:center;gap:22px}
.tm-circ{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:var(--mono);font-size:14px;font-weight:600;cursor:pointer}
.tm-circ:active{transform:scale(.95)}
.tm-big-btn{width:96px;height:96px;border-radius:50%;border:none;background:linear-gradient(180deg,var(--acc),var(--acc-h));color:var(--ink);font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(143,26,26,.35)}
.tm-big-btn:active{transform:scale(.97)}

/* ══ HELIOS (home) — Roman orbit ══ */
.helios{text-align:center;padding-top:4px}
.h-eyebrow{font-family:var(--display);color:var(--acc);letter-spacing:.24em;font-size:12px;font-weight:600;margin-bottom:2px}
.h-hail{font-family:var(--display);font-weight:700;font-size:clamp(30px,9vw,42px);letter-spacing:.02em;line-height:1;color:var(--text);margin-bottom:10px}
.orbit{position:relative;width:min(84vw,350px);max-width:calc(100vw - 76px);aspect-ratio:1;margin:2px auto 0}
.orbit .rings{position:absolute;inset:-7%;border-radius:50%;background:
  radial-gradient(circle,transparent 60.5%,rgba(184,145,47,.18) 61%,transparent 62%),
  radial-gradient(circle,transparent 71.5%,rgba(184,145,47,.12) 72%,transparent 73%),
  radial-gradient(circle,transparent 83.5%,rgba(184,145,47,.08) 84%,transparent 85%)}
.orbit .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.orbit .ring .bg{fill:none;stroke:rgba(184,145,47,.22);stroke-width:4}
.orbit .ring .fg{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .7s ease;filter:drop-shadow(0 1px 2px rgba(154,120,40,.4))}
.disc{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle at 50% 32%,#fcf7ea,#efe5cf);
  border:1px solid rgba(184,145,47,.35);box-shadow:0 10px 26px rgba(120,90,30,.2),inset 0 2px 3px rgba(255,255,255,.8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.disc .spark{color:var(--gold);font-size:20px;line-height:1}
.disc .day{color:var(--acc);font-family:var(--display);letter-spacing:.2em;font-size:11px;font-weight:600;margin-top:8px}
.disc .wname{font-family:var(--display);font-weight:700;font-size:clamp(22px,6.4vw,32px);line-height:1;margin:4px 0 12px;text-transform:uppercase;color:var(--text)}
.rise{background:linear-gradient(180deg,var(--acc),#761212);color:var(--ink);border:none;border-radius:26px;
  font-family:var(--display);font-weight:600;letter-spacing:.2em;font-size:17px;padding:10px 32px;cursor:pointer;
  box-shadow:0 6px 15px rgba(120,20,20,.42),inset 0 1px 0 rgba(255,255,255,.22)}
.rise:active{transform:translateY(1px)}
.node{position:absolute;width:23%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fcf7ea,#eee2c8);
  border:1px solid rgba(184,145,47,.32);box-shadow:0 5px 13px rgba(120,90,30,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center;line-height:1}
.node:active{transform:scale(.96)}
.node .nlbl{font-family:var(--display);letter-spacing:.1em;font-size:9px;color:var(--muted);margin-top:3px}
.node .nval{font-family:var(--display);font-weight:700;font-size:17px;color:var(--text)}
.node .nval small{font-size:9px;color:var(--muted);margin-left:1px}
.node svg{width:19px;height:19px;stroke:var(--gold-d);fill:none;stroke-width:1.6}
.node.tl{top:3%;left:1%}.node.tr{top:3%;right:1%}.node.bl{bottom:3%;left:2%}.node.br{bottom:3%;right:2%}
.sigil{position:relative;width:min(74%,270px);margin:16px auto 0}
.sigil img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sigil .fill{clip-path:inset(var(--t,100%) 0 0 0);transition:clip-path .9s ease}
.tally{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border:1px solid var(--border);border-radius:16px;margin-top:20px;overflow:hidden;box-shadow:0 4px 14px rgba(120,90,30,.08)}
.tally>div{padding:15px 6px;text-align:center}
.tally>div+div{border-left:1px solid var(--border)}
.tally .tv{font-family:var(--display);font-weight:700;font-size:26px;color:var(--text);line-height:1}
.tally .tl{font-family:var(--display);letter-spacing:.13em;font-size:10px;color:var(--muted);margin-top:5px}

/* ══ Tier 1 fix-playbook additions ══ */
/* 1.2 follow-up — --faint is decorative; these are data */
.bar em,.mbar span,.opt,.hero-ph{color:var(--muted)}

/* 1.3 — numbers that change in place or stack in a column must not re-flow */
.tm-big,.tm-sub,.tm-next,.tm-preset,.tm-circ,
.wt input,.reps-inp,.set-lbl,.prev,
.log-main,.log-sub,.log-date,
.stat-val,.tally .tv,.node .nval,
.bar span,.bar em,.mbar span{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}

/* 1.4 — tracking scales inversely with size (Cinzel is already wide) */
.eyebrow,.sec-label,.stat-lbl,.item-eyebrow,.grp,.tag,.badge,.tm-label,.lbl,.log-date{
  letter-spacing:.08em!important}
.tab span,.node .nlbl,.disc .day,.tally .tl,.hero-ey{letter-spacing:.06em!important}
.h-eyebrow{letter-spacing:.12em}
.rise{letter-spacing:.12em}
.lift-scheme{letter-spacing:.05em}

/* 1.5 — 44px floor on everything pressed mid-set, chalky hands included */
.mini{min-height:40px;padding:9px 13px}
#session .mini{min-height:40px;padding:9px 12px}
.tick{height:44px}
.pill{min-height:38px;padding:9px 13px}
.tm-preset{min-height:44px}
.ov-back{width:44px;height:44px}
.btn-sm{min-height:40px}

/* 1.6 — texture and brackets on the ACTIVE lift only; restraint scales, ten cards of ornament don't */
.lift{background:var(--card)}
.lift::before,.lift::after{opacity:0;transition:opacity .18s}
.lift:focus-within{
  background:repeating-linear-gradient(115deg,rgba(166,127,34,.05) 0 2px,transparent 2px 26px),var(--card);
  border-color:rgba(166,127,34,.5)}
.lift:focus-within::before,.lift:focus-within::after{opacity:.85}
.lift.done{border-color:rgba(85,96,44,.55);background:var(--card)}
.lift.done::before,.lift.done::after{opacity:.7;border-color:var(--good)}

/* 1.7 — active tab must survive greyscale, not just hue */
.tab{position:relative}
.tab.active span{font-weight:700}
.tab.active svg{stroke-width:2.3}
.tab.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:18px;height:2px;border-radius:2px;background:currentColor}

/* ── in-app confirm (2.2) — replaces the browser's native confirm() ── */
.ask{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(44,35,24,.45);backdrop-filter:blur(3px)}
.ask.open{display:flex}
.ask-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;
  max-width:360px;width:100%;box-shadow:0 18px 50px rgba(60,45,20,.35)}
.ask-msg{font-family:var(--body);font-size:16.5px;line-height:1.5;color:var(--text)}
.ask .btn{min-height:48px}
.daynudge{display:inline-block;padding:2px 10px;margin:-2px 0;color:var(--gold-d);
  cursor:pointer;font-size:16px;line-height:1}
.daynudge:active{color:var(--acc)}
.tally>div{padding:15px 4px}
.tally .tv{font-size:22px}
.tally .tl{font-size:9px}
</style>
</head>
<body>
<div class="app">
  <div class="acct" id="acct"></div>
  <div class="view" id="v-home"></div>
  <div class="view" id="v-programs"></div>
  <div class="view" id="v-workouts"></div>
  <div class="view" id="v-history"></div>
  <div class="view" id="v-body"></div>
  <div class="view" id="v-runs"></div>
</div>

<nav class="nav"><div class="nav-inner" id="nav"></div></nav>

<!-- session runner -->
<div class="overlay" id="session">
  <div class="ov-head">
    <button class="ov-back" onclick="closeSession()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="ov-title"><div class="t" id="ss-title"></div><div class="s" id="ss-sub"></div></div>
    <button class="btn btn-acc btn-sm" onclick="saveSession()">Save</button>
  </div>
  <div class="ov-body" id="ss-body"></div>
</div>

<!-- generic sheet (program detail / builder) -->
<div class="overlay" id="sheet">
  <div class="ov-head">
    <button class="ov-back" onclick="closeSheet()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="ov-title"><div class="t" id="sh-title"></div><div class="s" id="sh-sub"></div></div>
    <div id="sh-action"></div>
  </div>
  <div class="ov-body" id="sh-body"></div>
</div>

<!-- fullscreen timer -->
<div class="timer" id="timer">
  <div class="tm-label" id="tm-label"></div>
  <div class="tm-ring">
    <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45" stroke-width="6"></circle>
    <circle class="fg" id="tm-fg" cx="50" cy="50" r="45" stroke-width="6"></circle></svg>
    <div class="tm-time"><div class="tm-big" id="tm-big">0:00</div><div class="tm-sub" id="tm-sub"></div></div>
  </div>
  <div class="tm-next" id="tm-next"></div>
  <div class="tm-presets" id="tm-presets"></div>
  <div class="tm-ctl" id="tm-ctl"></div>
</div>

<div class="toast" id="toast"></div>
<div class="ask" id="ask"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   FIREBASE — paste your project config below (see notes at end).
   Until filled, the app runs fully offline (localStorage + export).
═══════════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "PASTE_API_KEY",
  authDomain:        "PASTE_PROJECT.firebaseapp.com",
  projectId:         "PASTE_PROJECT",
  storageBucket:     "PASTE_PROJECT.appspot.com",
  messagingSenderId: "PASTE_SENDER_ID",
  appId:             "PASTE_APP_ID"
};
const FB_READY = !String(FIREBASE_CONFIG.apiKey).startsWith("PASTE");

/* ═══════════════════════════════════════════════════════════════
   BANKS  (from MG Training Plans doc)
═══════════════════════════════════════════════════════════════ */
const AB_BANK = {
  A:{title:'Anti-extension', items:[
    {n:'Ab wheel rollout',s:'3×8–10'},
    {n:'Hollow body hold',s:'3×30–40 sec',timed:40}]},
  B:{title:'Hanging dynamic', items:[
    {n:'Hanging leg raise',s:'3×10–12'},
    {n:'Hanging knee raise',s:'3×12'}]},
  C:{title:'Flexion / oblique', items:[
    {n:'Bicycle crunch',s:'3×20 each side'},
    {n:'Reverse crunch',s:'3×15'}]},
  D:{title:'Anti-rotation', items:[
    {n:'Cable Pallof press',s:'3×12 each side'},
    {n:'Suitcase carry',s:'30 m × 3'}]},
  E:{title:'Plank complex', items:[
    {n:'RKC plank',s:'3×20 sec',timed:20},
    {n:'Side plank',s:'3×20 sec each side',timed:20},
    {n:'Plank shoulder taps',s:'3×12 each side'}]},
  F:{title:'Loaded / cable', items:[
    {n:'Cable crunch',s:'3×15'},
    {n:'Russian twist',s:'3×20'},
    {n:'Weighted decline sit-up',s:'3×12'}]},
  G:{title:'V-sit / tuck', items:[
    {n:'V-ups',s:'3×12'},
    {n:'Tuck hold',s:'3×30 sec',timed:30},
    {n:'Flutter kicks',s:'3×30 sec',timed:30}]},
  H:{title:'Carry core + grip', items:[
    {n:'Heavy farmer carry',s:'3×40 m'},
    {n:'Dead bug',s:'3×8 each side'}]}
};
const BLOCK_BANK = {
  block1:{name:'Block 1 · Classic intervals', format:'4 rounds · 40s on / 20s off',
    items:[{n:'KB swings',s:'40s'},{n:'Burpees',s:'40s'},{n:'DB thrusters',s:'40s'},{n:'Jump squats',s:'40s'},{n:'Mountain climbers',s:'40s'}],
    rest:'2 min rest between rounds'},
  block2:{name:'Block 2 · Density', format:'4 × 5-min blocks · 90s rest between',

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* for interpolating a name into a single-quoted JS string inside an HTML onclick attribute —
   esc() alone leaves apostrophes live, which would break out of the quoted string. */
const jsq=s=>String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;');
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const localISO=d=>{ const t=new Date(d); t.setMinutes(t.getMinutes()-t.getTimezoneOffset()); return t.toISOString().slice(0,10); };
const todayISO=()=>localISO(new Date());
function fmtDate(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function parseSets(sch){ const m=String(sch).match(/^(\d+)/); return m?+m[1]:3; }
function pace(km,min){ if(!km||!min) return '—'; const s=(min*60)/km, m=Math.floor(s/60); return `${m}:${String(Math.round(s%60)).padStart(2,'0')}`; }
function progById(id){ return PROGRAMS.find(p=>p.id===id); }
/* ── units (weights stored canonically in kg) ── */
const KG_LB=2.2046226;
function fromKg(kg){ if(kg==null||kg==='')return kg; const v=S.unit==='lb'?kg*KG_LB:kg; return Math.round(v*10)/10; }
function toKg(v){ if(v==null||v===''||isNaN(+v))return null; return S.unit==='lb'? Math.round((+v/KG_LB)*100)/100 : +v; }
function uLbl(){ return S.unit; }
/* ── ISO week key for the Monday reminder ── */
function weekKey(d=new Date()){ const t=new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate()+3-((t.getDay()+6)%7)); const wk1=new Date(t.getFullYear(),0,4); return t.getFullYear()+'-W'+String(1+Math.round(((t-wk1)/864e5-3+((wk1.getDay()+6)%7))/7)).padStart(2,'0'); }
function programWeek(){ if(!S.active?.startedISO)return 0; const d=(Date.now()-new Date(S.active.startedISO+'T00:00:00'))/864e5; return Math.floor(d/7)+1; }
/* which program day is next — derived from this week's session count, but
   user-correctable, since doing an extra session or logging one twice would
   otherwise desync the pointer with no way to fix it. */
function nextDayIdx(p){
  if(S.active?.nextDay!=null) return ((S.active.nextDay%p.D.length)+p.D.length)%p.D.length;
  const progWk=sessionsSince(weekStart())
    .filter(s=>s.source?.type==='program'&&s.source.programId===p.id).length;
  return progWk%p.D.length;
}
function bumpDay(pid,dir){
  const p=progById(pid); if(!p||!S.active) return;
  S.active.nextDay=(nextDayIdx(p)+dir+p.D.length)%p.D.length;
  persist(); renderHome();
}
function bodyLoggedThisWeek(){ const ws=weekStart(); return S.bodyLog.some(e=> new Date(e.date+'T00:00:00').getTime()>=ws); }

function isRest(iso){ return (S.restDays||[]).includes(iso); }
function toggleRest(iso){
  S.restDays=S.restDays||[];
  S.restDays=isRest(iso)?S.restDays.filter(d=>d!==iso):[...S.restDays,iso];
  persist();
  renderHome();
}
function weekDays(){
  const out=[], ws=weekStart();
  for(let i=0;i<7;i++){
    const d=new Date(ws+i*864e5);
    const iso=localISO(d);
    out.push({
      iso,
      label:['M','T','W','T','F','S','S'][i],
      today:iso===todayISO(),
      trained:S.sessions.some(s=>s.date===iso),
      ran:S.runs.some(r=>r.date===iso),
      rest:isRest(iso)
    });
  }
  return out;
}

/* ── progress analytics (weights canonical in kg) ──────────────────
   One pass over history, cached until something writes. Reads per-set
   data first and falls back to the single weight field, so sessions
   logged before 3.1's sets-first model keep working unchanged.       */
let _exIdx=null;
function invalidateIndex(){ _exIdx=null; }
function setsTop(l){
  if(!l) return null;
  const ws=(l.sets||[]).map(s=>s&&s.w).filter(w=>w!=null&&w!=='');
  if(ws.length) return Math.max(...ws.map(Number));
  return (l.weight!=null&&l.weight!=='')?+l.weight:null;
}
function bestSet(l){
  const ss=(l.sets||[]).filter(s=>s&&s.w!=null&&s.w!=='');
  return ss.length?ss.reduce((a,s)=>(+s.w>+a.w?s:a)):null;
}
function setsTopReps(l){ return bestSet(l)?.reps ?? l?.reps ?? null; }
function exIndex(){
  if(_exIdx) return _exIdx;
  _exIdx={};
  const ordered=[...S.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  for(const s of ordered){
    for(const [id,l] of Object.entries(s.log||{})){
      const w=setsTop(l);
      if(w==null) continue;
      const e=_exIdx[id]||(_exIdx[id]={last:null,best:null,hist:[]});
      e.last={w,date:s.date,reps:setsTopReps(l),rpe:bestSet(l)?.rpe??null};
      if(e.best==null||w>e.best) e.best=w;
      e.hist.push({date:s.date,w});
    }
  }
  return _exIdx;
}
function allTimeBest(exId){ return exIndex()[exId]?.best??null; }
function exHistory(exId){ return exIndex()[exId]?.hist||[]; }
function weekStreak(){
  const has=t0=>S.sessions.some(s=>{const t=new Date(s.date+'T00:00:00').getTime(); return t>=t0&&t<t0+7*864e5;});
  const cur=weekStart(); let n=0, t=has(cur)?cur:cur-7*864e5;   // current week counts if started; otherwise streak isn't broken yet
  while(has(t)){ n++; t-=7*864e5; }
  return n;
}
/* sessions per week, averaged over the last n weeks — the number that says
   whether the month was actually good, since a streak of any length can
   hide anywhere from one session a week to ten. */
function avgPerWeek(n=4){
  const ws=weekStart(); let tot=0;
  for(let i=0;i<n;i++){
    const t0=ws-i*7*864e5;
    tot+=S.sessions.filter(s=>{
      const t=new Date(s.date+'T00:00:00').getTime(); return t>=t0&&t<t0+7*864e5;
    }).length;
  }
  return Math.round(tot/n*10)/10;
}
/* a "5k" is inferred from the numbers: ~5 km with a time; "hard" = 5:30/km or quicker.
   (r.type==='5k' honours runs logged before the type selector was removed) */
function is5k(r){ return r.min>0 && ((r.km>=4.8&&r.km<=5.2) || (r.type==='5k'&&!r.km)); }
function paceSec(r){ return (r.min*60)/(+r.km||5); }        // seconds per km
function isHard5k(r){ return is5k(r) && paceSec(r)<=330; }  // 5:30/km
function bestFiveK(){
  const fives=S.runs.filter(is5k);
  if(!fives.length) return null;
  return fives.reduce((a,r)=>paceSec(r)<paceSec(a)?r:a);
}
function weeklyKm(n=8){
  const out=[]; const ws=weekStart();
  for(let i=n-1;i>=0;i--){ const t0=ws-i*7*864e5;
    const km=S.runs.filter(r=>{const t=new Date(r.date+'T00:00:00').getTime(); return t>=t0&&t<t0+7*864e5;})
      .reduce((a,r)=>a+(+r.km||0),0);
    out.push({t0,km:Math.round(km*10)/10}); }
  return out;
}

function toast(msg,ok){ const el=$('toast'); el.textContent=msg; el.className='toast show'+(ok?' ok':''); clearTimeout(_toastT); _toastT=setTimeout(()=>el.className='toast',2400); }

let _askResolve=null;
function ask(msg,{ok='Confirm',cancel='Cancel',danger=false}={}){
  return new Promise(res=>{
    _askResolve=res;
    const el=$('ask');
    el.innerHTML=`<div class="ask-box" role="alertdialog" aria-modal="true">

      </div></div>`;
    el.classList.add('open');
  });
}
function askDone(v){
  $('ask').classList.remove('open');
  const r=_askResolve; _askResolve=null; r&&r(v);
}

function lastBody(){ return S.bodyLog.length? S.bodyLog[S.bodyLog.length-1].kg : null; }
function run7d(){ const cut=Date.now()-7*864e5; return S.runs.filter(r=>new Date(r.date+'T00:00:00').getTime()>=cut).reduce((a,r)=>a+(+r.km||0),0); }
function prevWeight(exId){ return exIndex()[exId]?.last||null; }
function sessionsFor(pid){ return S.sessions.filter(s=>s.source?.programId===pid).length; }
function weekStart(){ const d=new Date(); d.setHours(0,0,0,0); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.getTime(); } // Monday
function monthStart(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),1).getTime(); }
function sessionsSince(ts){ return S.sessions.filter(s=> new Date(s.date+'T00:00:00').getTime()>=ts); }
function runsSince(ts){ return S.runs.filter(r=> new Date(r.date+'T00:00:00').getTime()>=ts); }

function bankBreakdownHTML(b){
  return `${b.format?`<div class="wod-format">${esc(b.format)}</div>`:''}
    <div class="wod-items">${(b.items||[]).map(it=>
      `<div class="wod-item"><span>${esc(it.n)}</span>${it.s?`<span class="s">${esc(it.s)}</span>`:''}</div>`).join('')}</div>
    ${b.rest?`<div class="wod-rest">${esc(b.rest)}</div>`:''}`;
}
function dayContentPreview(d){
  let out=[];
  if(d.lifts?.length) out.push(`<div class="prev-sec">${d.lifts.map(l=>{
    const cue=exDesc(l.n);
    return `<div class="prev-lift"><div class="prev-lift-top"><span>${esc(l.n)}</span><span class="s">${esc(l.s)}</span></div>${cue?`<div class="ex-cue">${esc(cue)}</div>`:''}</div>`;
  }).join('')}</div>`);
  if(d.cond){ const b=BLOCK_BANK[d.cond]; out.push(`<div class="prev-sec"><div class="prev-h">${esc(b.name)}</div>${bankBreakdownHTML(b)}</div>`); }
  if(d.wod){ const w=WOD_BANK[d.wod]; out.push(`<div class="prev-sec"><div class="prev-h">${esc(w.name)}</div>${bankBreakdownHTML(w)}</div>`); }
  if(d.ab){ const a=AB_BANK[d.ab];
    out.push(`<div class="prev-sec"><span class="opt">optional</span> Ab burner ${d.ab} — ${esc(a.title)}<div style="margin-top:8px">${a.items.map(it=>
      `<div class="prev-line">${esc(it.n)} <span style="color:var(--faint)">${esc(it.s)}</span></div>`).join('')}</div></div>`); }
  return out.join('');
}

function setUnit(u){ S.unit=u; persist(); drawSettings(); if(S.view)render(S.view); }
function toggleRemind(){
  if(!S.remindWeekly){ S.remindWeekly=true; if('Notification' in window && Notification.permission==='default') Notification.requestPermission().then(()=>drawSettings()); }
  else S.remindWeekly=false;
  persist(); drawSettings();
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mg-training-'+todayISO()+'.json';
  a.click(); URL.revokeObjectURL(a.href); toast('Backup exported',true);
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      S.sessions=unionById(S.sessions,d.sessions); S.bodyLog=unionById(S.bodyLog,d.bodyLog);
      S.runs=unionById(S.runs,d.runs); S.customWorkouts=unionById(S.customWorkouts,d.customWorkouts);
      if(d.active!==undefined)S.active=d.active; if(d.unit)S.unit=d.unit;
      invalidateIndex();
      persist(); closeSheet(); nav('home'); toast('Backup imported',true);
    }catch(err){ toast('Could not read that file'); } };
    r.readAsText(f); };
  inp.click();
}

let _arenaQ='',_arenaCat='all';
function renderWorkouts(){
  const q=_arenaQ.trim().toLowerCase();
  let html=`<div class="eyebrow">Armoury</div><div class="spread"><div class="h1">Arena</div>
    <button class="btn btn-acc btn-sm" onclick="openBuilder()">+ New</button></div>
    <div class="lede">Swap in any program day, or build your own from the exercise bank.</div>
    <input class="inp" id="arena-q" placeholder="Search a day or an exercise…" value="${esc(_arenaQ)}"
      oninput="_arenaQ=this.value;renderWorkouts()" style="margin-bottom:10px">
    <div class="seg">${[['all','All'],['weights','Weights'],['hiit','HIIT'],['crossfit','WODs']]
      .map(([k,l])=>`<button class="${_arenaCat===k?'on':''}" onclick="_arenaCat='${k}';renderWorkouts()">${l}</button>`).join('')}</div>`;
  const hit=hay=>!q||hay.toLowerCase().includes(q);
  const mine=S.customWorkouts.filter(w=>hit(w.name+' '+(w.lifts||[]).map(l=>l.n).join(' ')));
  if(mine.length){
    html+=`<div class="sec-label">Your workouts</div>`;
    mine.forEach(w=>{
      html+=`<div class="item" onclick="startCustom('${w.id}')">
        <div class="item-eyebrow">Custom${w.ab?' · ab '+w.ab:''}</div>
        <div class="item-title">${esc(w.name)}</div>
        <div class="item-sub">${(w.lifts||[]).map(l=>esc(l.n)).join(' · ')||'—'}</div>
        <button class="pill" style="margin-top:10px" onclick="event.stopPropagation();deleteCustom('${w.id}')">Delete</button></div>`;
    });
  }
  /* dedupe days that are byte-identical across the 3/4/5-day variants of a category */
  const seen=new Set(), days=[];
  PROGRAMS.filter(p=>_arenaCat==='all'||p.cat===_arenaCat).forEach(p=>{
    p.D.forEach((d,i)=>{
      const key=p.cat+'|'+d.name+'|'+(d.lifts||[]).map(l=>l.n).join(',')+'|'+(d.cond||'')+'|'+(d.wod||'');
      if(seen.has(key)) return;
      seen.add(key);
      if(!hit(d.name+' '+(d.sub||'')+' '+liftsPreview(d))) return;
      days.push({p,d,i});
    });
  });
  html+=`<div class="sec-label">Program days (freestyle)${q?` · ${days.length} match${days.length===1?'':'es'}`:''}</div>`;
  if(!days.length&&!mine.length){
    html+=`<div class="empty">Nothing matches "${esc(_arenaQ)}".</div>`;
  }
  days.forEach(({p,d,i})=>{
    html+=`<div class="item" onclick="startFreestyle('${p.id}',${i})">
      <div class="item-eyebrow"><span class="tag tag-${p.cat}" style="margin-right:6px">${CAT_NAME[p.cat].split(' ')[0]} · ${p.days}D</span></div>
      <div class="item-title" style="font-size:17px">${esc(d.name)} <span style="color:var(--faint);font-weight:500;font-size:13px">${esc(p.subtitle)}</span></div>
      <div class="item-sub">${esc(liftsPreview(d))}</div></div>`;
  });
  $('v-workouts').innerHTML=html;
  /* innerHTML wipes focus — put the caret back so typing doesn't drop characters */
  if(_arenaQ){
    const s=$('arena-q');
    if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); }
  }
}

function buildRows(day){
  const rows=[];
  if(day.warmup) rows.push({kind:'warmup',id:'warmup',text:day.warmup});
  (day.lifts||[]).forEach(l=>rows.push({kind:'lift',id:l.id||slug(l.n),name:l.n,scheme:l.s}));
  if(day.cond){ const b=BLOCK_BANK[day.cond]; rows.push({kind:'block',id:day.cond,name:b.name,format:b.format,items:b.items,rest:b.rest,rounds:b.rounds}); }
  if(day.wod){ const w=WOD_BANK[day.wod]; rows.push({kind:'wod',id:day.wod,name:w.name,format:w.format,items:w.items,rest:w.rest,rounds:w.rounds}); }
  if(day.ab){ const a=AB_BANK[day.ab];
    rows.push({kind:'abhead',ref:day.ab,title:a.title});
    a.items.forEach(it=>rows.push({kind:'ab',id:slug(it.n),name:it.n,scheme:it.s,timed:it.timed})); }
  return rows;
}

let _pending=null;
function openWorkoutDetail(day,source,title,tag,sub){
  _pending={day,source,title,tag};
  $('sh-title').textContent=title;
  $('sh-sub').textContent=sub||'';
  $('sh-action').innerHTML='';
  openSheet();
  $('sh-body').innerHTML=`<div class="card">
    ${tag?`<span class="tag tag-${tag==='Hard'?'hard':'mod'}">${tag}</span>`:''}
    <div class="desc" style="margin-top:${tag?'12px':'0'}">${dayContentPreview(day)}</div>
  </div>
  <button class="btn btn-acc btn-block btn-lg" style="margin-top:16px" onclick="beginPending()">Start session</button>`;
}
function beginPending(){ if(!_pending)return; const p=_pending; _pending=null; closeSheet(); _start(p.day,p.source,p.title,p.tag); }
async function _start(day,source,title,tag){
  if(S.draft){
    const n=Object.values(S.draft.log).filter(l=>l.done).length;
    const keep=!await ask(`"${S.draft.title}" is still in progress${n?` — ${n} item${n>1?'s':''} logged`:''}. Discard it?`,
                          {ok:'Discard & start new',cancel:'Resume instead',danger:true});
    if(keep){ openSession(); return; }
  }
  S.draft={id:uid(),date:todayISO(),title,tag:tag||null,source,rows:buildRows(day),log:{},notes:''};
  persist(); openSession();
}
function openSession(){ if(!S.draft){ nav('home'); return; } closeSheet(); renderSessionBody(); $('session').classList.add('active'); $('ss-body').scrollTo?.(0,0); }
function closeSession(){ $('session').classList.remove('active'); if(S.view) render(S.view); }
function renderSessionBody(){
  const d=S.draft;
  $('ss-title').textContent=d.title;
  $('ss-sub').textContent=(d.tag?d.tag+' · ':'')+fmtDate(d.date);

    <div style="height:6px"></div>`;
  d.rows.forEach(r=>html+=rowHTML(r));

  html+=`<div class="grp">Add / swap exercise</div>
    <div class="lift">
      <div class="row-t">
        <input class="inp" id="ss-add-n" list="ss-dl" placeholder="Exercise…" style="flex:2">
        <input class="inp" id="ss-add-s" placeholder="3×10" style="flex:1;min-width:74px">
      </div>
      <datalist id="ss-dl">${bankOpts}</datalist>

    <button class="btn btn-danger" onclick="discardDraft()">Discard</button></div>`;
  $('ss-body').innerHTML=html;

function rowHTML(r){
  const lg=S.draft.log[r.id]||{};
  if(r.kind==='warmup'){ const done=!!lg.done;
    return `<div class="warmbox ${done?'done':''}" id="row-${r.id}" style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1"><b style="color:var(--text)">Warmup</b> — ${esc(r.text)}</div>
      <button class="chk ${done?'on':''}" onclick="toggleDone('${r.id}')">${done?'✓':''}</button></div>`; }
  if(r.kind==='abhead') return `<div class="grp">Ab burner ${r.ref} · ${esc(r.title)} <span class="opt">optional</span></div>`;
  if(r.kind==='lift'||r.kind==='ab'){
    const done=!!lg.done, wt=lg.weight!=null?fromKg(lg.weight):'';
    const isAb=r.kind==='ab';
    const prev=(!isAb)?prevWeight(r.id):null;
    let prevHTML='';
    if(!isAb){
      if(prev){
        const c=setsTop(lg); let cls='',sym='→';
        if(c!=null&&c>prev.w){cls='up';sym='↑';} if(c!=null&&c<prev.w){cls='dn';sym='↓';}
        const detail=[prev.reps?`×${prev.reps}`:'',prev.rpe?`@${prev.rpe}`:''].filter(Boolean).join(' ');
        prevHTML=`<span class="prev"><span class="${cls}">${sym} ${fromKg(prev.w)}${uLbl()}${detail?' '+detail:''}</span></span>`;
      } else prevHTML=`<span class="prev">first time</span>`;
    }
    const timer=r.timed?`<button class="mini" onclick="openHold('${jsq(r.name)}',${r.timed})"><svg viewBox="0 0 24 24">${CLOCK_ICON}</svg>${r.timed}s</button>`:'';
    const note=S.exNotes[r.id];
    const setCount=parseSets(r.scheme);
    const setsOpen=!isAb;   // sets are the point, not a disclosure — always shown for a real lift
    const sug=!isAb?suggestNext(r.id,r.scheme):null;
    const setsPanel=!isAb?`<div class="sets-panel${setsOpen?' open':''}" id="sets-${r.id}">${setRowsHTML(r.id,setCount)}</div>`:'';
    const wtInput=!isAb?`<div class="wt"><input id="wt-${r.id}" type="number" step="0.5" inputmode="decimal" placeholder="${sug?fromKg(sug.kg):'—'}" value="${wt}" oninput="setW('${r.id}',this.value,false)" onchange="setW('${r.id}',this.value,true)" onblur="setW('${r.id}',this.value,true)"><span class="u">${uLbl()}</span></div>
       <button class="mini" onclick="openRest(S.autoRestSec,nextRowName('${r.id}'))"><svg viewBox="0 0 24 24">${CLOCK_ICON}</svg>rest</button>
       ${sug&&sug.changed?`<button class="mini sug" onclick="acceptSuggest('${r.id}',${sug.kg})" aria-label="${esc(sug.why)}">→ ${fromKg(sug.kg)}${uLbl()}</button>`:''}`:'';
    return `<div class="lift ${done?'done':''}" id="row-${r.id}">
      <div class="lift-top">
        <div class="lift-info"><div class="lift-name">${esc(r.name)}</div><div class="lift-scheme">${esc(r.scheme)}</div>
        ${exDesc(r.name)?`<div class="ex-cue">${esc(exDesc(r.name))}</div>`:''}
        <div class="ex-note" id="note-txt-${r.id}" ${note?'':'style="display:none"'}>${esc(note||'')}</div></div>
        <button class="chk ${done?'on':''}" onclick="toggleDone('${r.id}')">${done?'✓':''}</button>
      </div>
      <div class="lift-ctl">${wtInput}${timer}${prevHTML}
        <button class="mini" onclick="toggleNote('${r.id}')" title="Exercise note">✎</button>
        <button class="mini" onclick="ssRemoveRow('${r.id}')" title="Remove" style="margin-left:auto">✕</button></div>
      ${setsPanel}
      <input class="note-inp" id="note-${r.id}" placeholder="Note (e.g. seat pin 5, wide grip) — saved for every session" value="${esc(note||'')}" oninput="setExNote('${r.id}',this.value)">
    </div>`;
  }
  if(r.kind==='block'||r.kind==='wod'){
    const done=!!lg.done;
    const hasSeq=TIMERS[r.id];
    const rd=r.rounds?lg.rounds||Array(r.rounds).fill(false):null;
    let ticks='';
    if(rd) ticks=`<div class="ticks">${rd.map((v,i)=>`<div class="tick ${v?'on':''}" onclick="toggleRound('${r.id}',${i},${r.rounds})">R${i+1} ${v?'✓':''}</div>`).join('')}</div>`;
    return `<div class="lift ${done?'done':''}" id="row-${r.id}">
      <div class="lift-top">
        <div class="lift-info"><div class="lift-name">${esc(r.name)}</div></div>
        <button class="chk ${done?'on':''}" onclick="toggleDone('${r.id}')">${done?'✓':''}</button>
      </div>
      <div class="desc">${bankBreakdownHTML(r)}</div>
      ${ticks}
      <div class="lift-ctl">
        ${hasSeq?`<button class="mini" onclick="openTimer(TIMERS['${r.id}']())"><svg viewBox="0 0 24 24">${CLOCK_ICON}</svg>Start timer</button>`:''}
        <button class="mini" onclick="openRest(90,nextRowName('${r.id}'))"><svg viewBox="0 0 24 24">${CLOCK_ICON}</svg>90s rest</button>
        <button class="mini" onclick="ssRemoveRow('${r.id}')" title="Remove" style="margin-left:auto">✕</button>
      </div></div>`;
  }
  return '';
}
function refreshPrev(id,kg){
  const row=$('row-'+id); const prev=prevWeight(id); const pEl=row?.querySelector('.prev');
  if(pEl&&prev){ let cls='',sym='→'; if(kg!=null&&kg>prev.w){cls='up';sym='↑';} if(kg!=null&&kg<prev.w){cls='dn';sym='↓';}
    const detail=[prev.reps?`×${prev.reps}`:'',prev.rpe?`@${prev.rpe}`:''].filter(Boolean).join(' ');
    pEl.innerHTML=`<span class="${cls}">${sym} ${fromKg(prev.w)}${uLbl()}${detail?' '+detail:''}</span>`; }
}
function checkPR(id,l,kg,name){
  if(kg==null) return;
  const best=allTimeBest(id);
  if(best!=null && kg>best && kg>(l.prMax||0)){
    l.prMax=kg;
    toast(`🎉 New PR — ${fromKg(kg)}${uLbl()}${name?' '+name:''}`,true);
    try{ vibrate([80,40,80]); }catch(e){}
  }
}
function rowName(id){ return (S.draft?.rows||[]).find(r=>r.id===id)?.name||''; }
function setCountFor(id){
  const r=(S.draft?.rows||[]).find(x=>x.id===id);
  return r?parseSets(r.scheme):3;
}
/* ── set rows, renderable on their own so the working-weight field can
      fill them without re-rendering (and losing focus on) the whole session ── */
function setRowsHTML(id,n){
  const l=S.draft.log[id]||{};
  return Array.from({length:n},(_,i)=>{
    const st=(l.sets||[])[i]||{};
    return `<div class="set-line"><span class="set-lbl">S${i+1}</span>
      <div class="wt"><input type="number" step="0.5" inputmode="decimal" placeholder="—"
        value="${st.w!=null?fromKg(st.w):''}"
        oninput="setSetW('${id}',${i},this.value,false)"
        onchange="setSetW('${id}',${i},this.value,true)"
        onblur="setSetW('${id}',${i},this.value,true)"><span class="u">${uLbl()}</span></div>
      <span class="x">×</span>
      <input class="reps-inp" type="number" inputmode="numeric" placeholder="reps"
        value="${st.reps??''}" oninput="setSetR('${id}',${i},this.value)">
      <input class="rpe-inp" type="number" min="1" max="10" step="0.5" inputmode="decimal" placeholder="RPE"
        value="${st.rpe??''}" oninput="setSetRPE('${id}',${i},this.value)">
    </div>`;
  }).join('');
}
function renderSetRows(id){ const p=$('sets-'+id); if(p) p.innerHTML=setRowsHTML(id,setCountFor(id)); }
/* commit=false on every keystroke (persists silently); commit=true only on
   change/blur, which is the sole trigger for the "last time" refresh, the
   PR check, and filling the set rows — typing 100 no longer fires a PR
   toast in passing at 1 and 10, and doesn't fight per-set typing either. */
function setW(id,v,commit){
  const kg=v!==''?toKg(v):null; const l=S.draft.log[id]=S.draft.log[id]||{};
  l.weight=kg;                                   // kept for backwards compatibility with old sessions
  l.sets=l.sets||[];
  const n=setCountFor(id);
  for(let i=0;i<n;i++){                          // fill blanks only — never overwrite an actual
    l.sets[i]=l.sets[i]||{};
    if(l.sets[i].w==null||l.sets[i].w==='') l.sets[i].w=kg;
  }
  persist(false);
  if(commit){
    const top=setsTop(l);
    refreshPrev(id,top); checkPR(id,l,top,rowName(id));
    renderSetRows(id);                            // safe here: commit fires on blur, focus is already leaving
  }
}
function setSetW(id,i,v,commit){
  const l=S.draft.log[id]=S.draft.log[id]||{}; if(!l.sets)l.sets=[];
  l.sets[i]=l.sets[i]||{}; l.sets[i].w=v!==''?toKg(v):null;
  const top=setsTop(l);
  l.weight=top;                                   // top set drives progress + PR
  persist(false);
  const main=$('wt-'+id); if(main) main.value=top!=null?fromKg(top):'';
  if(commit){ refreshPrev(id,top); checkPR(id,l,top,rowName(id)); }
}
function setSetR(id,i,v){
  const l=S.draft.log[id]=S.draft.log[id]||{}; if(!l.sets)l.sets=[];
  l.sets[i]=l.sets[i]||{}; l.sets[i].reps=v!==''?parseInt(v):null; persist(false);
}
function setSetRPE(id,i,v){
  const l=S.draft.log[id]=S.draft.log[id]||{}; if(!l.sets)l.sets=[];
  l.sets[i]=l.sets[i]||{};
  l.sets[i].rpe=v===''?null:Math.min(10,Math.max(1,+v));
  persist(false);
}
/* ── suggested next load (3.3) — fills the placeholder, never writes silently;
      the user still has to tap Accept or type their own number. ── */
function loadStep(kg){ return kg>=60?2.5 : kg>=20?2 : 1; }
function suggestNext(exId,scheme){
  const e=exIndex()[exId];
  if(!e?.last) return null;
  const {w,reps,rpe}=e.last;
  const range=String(scheme||'').match(/(\d+)\s*[–-]\s*(\d+)/);
  const flat=String(scheme||'').match(/×\s*(\d+)/);
  const top=range?+range[2]:(flat?+flat[1]:null);
  const inc=loadStep(w);
  let next=w, why='repeat last session';
  if(rpe!=null){
    if(rpe<=7)        { next=w+inc*2; why=`last set was RPE ${rpe} — room to jump`; }
    else if(rpe<=8.5) { next=w+inc;   why=`RPE ${rpe} — add a step`; }
    else if(rpe>=9.5) { next=w;       why=`RPE ${rpe} — hold and clean it up`; }
    else              { next=w+inc;   why=`RPE ${rpe} — small step`; }
  } else if(top!=null&&reps!=null){
    if(reps>=top)        { next=w+inc; why=`you hit ${reps} at the top of the range`; }
    else if(reps<top-2)  { next=w;     why=`${reps} reps last time — repeat this load`; }
    else                 { next=w;     why=`${reps} of ${top} reps — earn the top of the range first`; }
  }
  return {kg:Math.round(next*2)/2, why, changed:Math.abs(next-w)>0.01};
}
function acceptSuggest(id,kg){
  const el=$('wt-'+id); const shown=fromKg(kg);
  if(el) el.value=shown;
  setW(id,shown,true);
  toast(`Set to ${shown}${uLbl()}`,true);
}
function toggleNote(id){ const n=$('note-'+id); if(!n)return; n.classList.toggle('open'); if(n.classList.contains('open')) n.focus(); }
function setExNote(id,v){
  if(v.trim()) S.exNotes[id]=v.trim(); else delete S.exNotes[id];
  persist(false);
  const t=$('note-txt-'+id); if(t){ t.textContent=v.trim(); t.style.display=v.trim()?'':'none'; }
}
function toggleDone(id){ const l=S.draft.log[id]=S.draft.log[id]||{}; l.done=!l.done; persist(false);
  const row=$('row-'+id); row.classList.toggle('done',l.done); row.querySelector('.chk').classList.toggle('on',l.done);

function toggleRound(id,i,total){ const l=S.draft.log[id]=S.draft.log[id]||{}; if(!l.rounds)l.rounds=Array(total).fill(false);
  l.rounds[i]=!l.rounds[i]; const all=l.rounds.every(Boolean); l.done=all; persist(false); renderSessionBody(); }
function ssAddExercise(){
  if(!S.draft)return;

  const s=$('ss-add-s').value.trim()||'3×10';

async function ssRemoveRow(id){

  const lg=S.draft.log[id];
  if(lg && (lg.weight!=null||lg.done||lg.rounds) && !await ask('Remove this exercise? Its logged data will be cleared.',{ok:'Remove',danger:true})) return;
  S.draft.rows=S.draft.rows.filter(r=>r.id!==id); delete S.draft.log[id];

}
async function discardDraft(){
  if(!S.draft) return;
  const n=Object.values(S.draft.log||{}).filter(l=>l.done).length;
  if(!await ask(`Discard this session?${n?` ${n} logged item${n>1?'s':''} will be lost.`:''}`,{ok:'Discard',danger:true})) return;
  S.draft=null; persist(); closeSession(); nav('home'); toast('Session discarded');
}
function saveSession(){
  if(!S.draft) return;
  const done=Object.values(S.draft.log).filter(l=>l.done).length;
  const editingId=S.draft.editingId;
  const sess={...S.draft, doneCount:done, savedAt:Date.now()};
  delete sess.editingId;
  if(editingId){ const i=S.sessions.findIndex(x=>x.id===editingId); if(i>=0){ sess.id=editingId; sess.date=S.sessions[i].date; S.sessions[i]=sess; } else S.sessions.push(sess); }
  else S.sessions.push(sess);
  invalidateIndex();
  // a completed program day resets the manual day-pointer override (2.6)
  if(S.active && sess.source?.type==='program' && sess.source.programId===S.active.programId) S.active.nextDay=null;
  S.draft=null; persist();
  $('session').classList.remove('active');
  toast(editingId?'Session updated':'Session saved',true); nav(editingId?'history':'home');
}
function editSession(id){

  S.draft=JSON.parse(JSON.stringify({...s, editingId:id})); persist(); openSession();
}

async function delSession(id){

/* ── lift progression (Ascent) ── */
function progressInner(){
  const map=new Map();
  [...S.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
    (s.rows||[]).forEach(r=>{
      if(r.kind!=='lift') return;
      const w=s.log?.[r.id]?.weight; if(w==null) return;
      if(!map.has(r.id)) map.set(r.id,{name:r.name,points:[]});
      map.get(r.id).points.push({date:s.date,w});
    });
  });
  let html=`<div class="lede" style="margin:14px 0">Top-set weight per session. Beat the last bar.</div>`;
  if(!map.size){ return html+`<div class="empty">No logged weights yet — enter weights during sessions and trends appear here.</div>`; }
  const cards=[...map.entries()].sort((a,b)=>b[1].points[b[1].points.length-1].date.localeCompare(a[1].points[a[1].points.length-1].date));
  cards.forEach(([id,ex])=>{
    const pts=ex.points.slice(-8);
    const ws=pts.map(p=>p.w), max=Math.max(...ws), min=Math.min(...ws), rng=Math.max(0.5,max-min);
    const best=allTimeBest(id);
    const last=ws[ws.length-1], prev=ws.length>1?ws[ws.length-2]:null;
    let trend='';
    if(prev!=null){ const d=last-prev;
      trend=d>0?`<span style="color:var(--good)">↑ +${fromKg(d)}${uLbl()}</span>`:d<0?`<span style="color:var(--bad)">↓ ${fromKg(d)}${uLbl()}</span>`:`<span style="color:var(--muted)">→ same</span>`; }
    const bars=pts.map((p,i)=>{ const h=14+((p.w-min)/rng)*44;
      return `<div class="mbar ${i===pts.length-1?'last':''}" style="height:${h}px" title="${fmtDate(p.date)}"><span>${fromKg(p.w)}</span></div>`; }).join('');
    html+=`<div class="card" style="margin-bottom:12px">
      <div class="spread"><div><div class="item-title" style="font-size:16px">${esc(ex.name)}</div>
        <div class="item-sub">Best ${fromKg(best)}${uLbl()} · ${ex.points.length} session${ex.points.length!==1?'s':''}</div></div>
        <span style="font-family:var(--mono);font-size:12px">${trend}</span></div>
      <div class="mbar-row">${bars}</div>
    </div>`;
  });
  return html;
}

/* ═══════════════════════════════════════════════════════════════
   BODY  (lives inside Laurels)
═══════════════════════════════════════════════════════════════ */
function bodyInner(){
  const log=[...S.bodyLog].sort((a,b)=>a.date.localeCompare(b.date));
  let avgHTML='';
  if(log.length>=2){
    const now=Date.now(), wAgo=now-7*864e5, w2Ago=now-14*864e5;
    const inRange=(a,b)=>log.filter(e=>{const t=new Date(e.date+'T00:00:00').getTime(); return t>=a&&t<b;});
    const cur=inRange(wAgo,now+864e5), prev=inRange(w2Ago,wAgo);
    if(cur.length){
      const avg=cur.reduce((a,e)=>a+e.kg,0)/cur.length;
      let delta='';
      if(prev.length){ const pAvg=prev.reduce((a,e)=>a+e.kg,0)/prev.length; const d=avg-pAvg;
        delta=` · ${d<=0?'<span style="color:var(--good)">':'<span style="color:var(--bad)">'}${d>0?'+':''}${fromKg(Math.round(d*10)/10)}${uLbl()} vs last week</span>`; }
      avgHTML=`<div class="soft" style="margin-bottom:12px">7-day average: <b style="color:var(--text)">${fromKg(Math.round(avg*10)/10)} ${uLbl()}</b>${delta} <span style="color:var(--faint)">(daily weight is noisy — trust this line)</span></div>`;
    }
  }
  let chart='';
  if(log.length){
    const last12=log.slice(-12), max=Math.max(...last12.map(e=>e.kg)), min=Math.min(...last12.map(e=>e.kg));
    const rng=Math.max(1,max-min);
    chart=`<div class="bars">${last12.map((e,i)=>{ const h=20+((e.kg-min)/rng)*70;
      return `<div class="bar ${i===last12.length-1?'last':''}" style="height:${h}px"><span>${fromKg(e.kg)}</span><em>${e.date.slice(5)}</em></div>`;}).join('')}</div><div style="height:26px"></div>`;
  }
  const list=[...S.bodyLog].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>
    `<div class="log-row"><span class="log-date">${fmtDate(e.date)}</span><span class="log-main">${fromKg(e.kg)} ${uLbl()}</span>
     <span class="pill" onclick="delBody('${e.id}')">✕</span></div>`).join('');
  return `<div class="sec-label" style="margin-top:18px">Mass</div>
    <div class="row-t" style="margin:0 0 14px"><input class="inp" id="bw-in" type="number" step="0.1" inputmode="decimal" placeholder="Weight (${uLbl()})" style="flex:1">
      <button class="btn btn-acc" onclick="logBody()">Log</button></div>
    ${avgHTML}
    <div class="card">${chart}${list||'<div class="empty">Log your first weight.</div>'}</div>
    <div class="sec-label">Progress photos</div>
    <button class="btn btn-block" onclick="addPhoto()">📷 Add progress photo</button>
    <div id="photo-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px"></div>
    <div class="soft" style="margin-top:10px;font-size:12px">Photos are stored privately on this device only.</div>`;
}
function logBody(){ const raw=parseFloat($('bw-in').value); if(isNaN(raw)){ toast('Enter a weight'); return; }
  const kg=toKg(raw); const d=todayISO(); const ex=S.bodyLog.find(e=>e.date===d); if(ex) ex.kg=kg; else S.bodyLog.push({id:uid(),date:d,kg});
  persist(); renderHistory(); toast('Logged',true); }
