<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LiftTrack</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E0E0E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftTrack">
<link rel="apple-touch-icon" href="icon.svg">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --push:     #C8F04E;
  --pull:     #4EE8C8;
  --ab:       #F0714E;
  --run:      #4EB8F0;
  --mt:       #F04E78;
  --complete: #4EE87A;
  --half:     #F0C44E;
  --bg:       #0E0E0E;
  --bg2:      #161616;
  --bg3:      #1E1E1E;
  --border:   #2A2A2A;
  --text:     #F0EDE6;
  --muted:    #6B6762;
  --mono: 'DM Mono', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── NAV ── */
.nav {
  position: sticky; top: 0;
  background: rgba(14,14,14,0.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  z-index: 100; padding: 0 24px;
}
.nav-inner {
  max-width: 860px; margin: 0 auto;
  display: flex; align-items: center;
}
.nav-brand {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; letter-spacing: 0.04em;
  color: var(--text); margin-right: 20px;
  padding: 14px 0; white-space: nowrap; flex-shrink: 0;
}
.nav-brand span { color: var(--push); }
.nav-tabs {
  display: flex; overflow-x: auto; scrollbar-width: none; flex: 1;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); padding: 16px 14px;
  cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap; flex-shrink: 0;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--text); border-bottom-color: var(--push); }
.nav-tab.has-draft { color: var(--push); }
.nav-bw {
  display: flex; align-items: center; gap: 8px;
  margin-left: 12px; padding: 8px 0; flex-shrink: 0;
}
.nav-bw-label {
  font-family: var(--mono); font-size: 10px;
  color: var(--muted); letter-spacing: 0.08em;
  text-transform: uppercase; white-space: nowrap;
}
.nav-bw-input {
  width: 54px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: var(--mono);
  font-size: 13px; padding: 4px 6px;
  text-align: center; outline: none;
}
.nav-bw-input:focus { border-color: var(--push); }

/* ── PAGE ── */
.page { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }

/* ── BUTTONS ── */
.btn {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 8px 16px; border-radius: 4px;
  border: 1px solid var(--border); cursor: pointer;
  transition: all 0.15s; background: var(--bg3);
  color: var(--text); white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn-primary  { background: var(--push);  color: #0E0E0E; border-color: var(--push);  font-weight:500; }
.btn-primary:hover  { background: #d4f560; }
.btn-pull     { background: var(--pull);  color: #0E0E0E; border-color: var(--pull);  font-weight:500; }
.btn-pull:hover     { background: #60edd4; }
.btn-run      { background: var(--run);   color: #0E0E0E; border-color: var(--run);   font-weight:500; }
.btn-run:hover      { background: #6ccaf5; }
.btn-mt       { background: var(--mt);    color: #fff;    border-color: var(--mt);    font-weight:500; }
.btn-mt:hover       { background: #f36690; }
.btn-danger { color: var(--ab); border-color: rgba(240,113,78,0.25); background: var(--bg); }
.btn-danger:hover { border-color: var(--ab); background: rgba(240,113,78,0.08); }
.btn-sm { padding: 5px 10px; font-size: 9px; }

/* ── TAGS ── */
.tag {
  display: inline-block; font-family: var(--mono);
  font-size: 10px; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; padding: 3px 10px; border-radius: 2px;
}
.tag-push { background: var(--push); color: #0E0E0E; }
.tag-pull { background: var(--pull); color: #0E0E0E; }
.tag-ab   { background: var(--ab);   color: #0E0E0E; }
.tag-run  { background: var(--run);  color: #0E0E0E; }
.tag-mt   { background: var(--mt);   color: #fff; }

/* ── HOME ── */
.home-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(48px, 8vw, 80px);
  line-height: 0.9; letter-spacing: 0.02em; margin-bottom: 12px;
}
.home-title span { color: var(--push); }
.home-subtitle {
  font-family: var(--mono); font-size: 11px;
  color: var(--muted); letter-spacing: 0.08em;
  text-transform: uppercase; margin-bottom: 24px;
}
.home-stats {
  display: flex; gap: 12px; margin-bottom: 36px; flex-wrap: wrap;
}
.stat-pill {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--bg2);
  color: var(--muted);
}
.stat-pill strong { color: var(--text); font-weight: 500; }

.start-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 12px; margin-bottom: 12px;
}
.start-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 40px; }
.start-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 6px; padding: 20px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.start-card:hover { background: var(--bg3); }
.start-card.push:hover { border-color: var(--push); }
.start-card.pull:hover { border-color: var(--pull); }
.start-card.run:hover  { border-color: var(--run); }
.start-card.mt:hover   { border-color: var(--mt); }
.start-card-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; letter-spacing: 0.04em; margin: 8px 0 3px;
}
.start-card-desc { font-size: 11px; color: var(--muted); }
.start-card-last {
  margin-top: 10px; font-family: var(--mono);
  font-size: 10px; color: var(--muted); letter-spacing: 0.04em;
  border-top: 1px solid var(--border); padding-top: 8px;
}
.start-card-last strong { color: var(--text); }

.section-label {
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); padding-bottom: 8px;
  border-bottom: 1px solid var(--border); margin-bottom: 12px;
}

/* ── DRAFT BANNER ── */
.draft-banner {
  background: rgba(200,240,78,0.07); border: 1px solid rgba(200,240,78,0.2);
  border-radius: 6px; padding: 14px 18px; margin-bottom: 20px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.draft-banner-info { flex: 1; min-width: 140px; }
.draft-banner-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.draft-banner-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.06em; }

/* ── SESSION HEADER ── */
.session-header {
  display: flex; align-items: flex-start;
  justify-content: space-between; margin-bottom: 28px;
  gap: 16px; flex-wrap: wrap;
}
.session-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 30px; letter-spacing: 0.04em;
  line-height: 1; margin: 8px 0 4px;
}
.session-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.session-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px; }

/* ── BW ROW ── */
.bw-row {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px 18px; margin-bottom: 28px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.bw-row-label {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  letter-spacing: 0.07em; text-transform: uppercase; flex: 1;
}
.bw-input {
  width: 76px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: var(--mono);
  font-size: 15px; padding: 6px 10px;
  text-align: center; outline: none; transition: border-color 0.15s;
}
.bw-input:focus { border-color: var(--push); }
.bw-unit { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* ── EXERCISE SECTIONS ── */
.ex-section { margin-bottom: 24px; }
.ex-section-label {
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); padding-bottom: 8px;
  border-bottom: 1px solid var(--border); margin-bottom: 2px;
}

/* ── EXERCISE ROW ── */
.ex-row {
  display: flex; flex-direction: column;
  padding: 11px 0; border-bottom: 1px solid var(--border);
  transition: background 0.15s; border-radius: 3px;
}
.ex-row:last-child { border-bottom: none; }
.ex-row.s-complete { background: rgba(78,232,122,0.04); }
.ex-row.s-half     { background: rgba(240,196,78,0.04); }
.ex-row.s-skip     { opacity: 0.45; }
.ex-row-main {
  display: flex; align-items: center;
  gap: 10px; flex-wrap: wrap;
}
.ex-info { flex: 1; min-width: 150px; }
.ex-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.ex-note { font-size: 12px; color: var(--muted); font-weight: 300; }
.ex-sets { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.ex-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* Status buttons */
.status-group {
  display: flex; border: 1px solid var(--border);
  border-radius: 4px; overflow: hidden;
}
.sbtn {
  width: 30px; height: 30px; border: none;
  background: var(--bg3); color: var(--muted);
  cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  transition: background 0.12s, color 0.12s; user-select: none;
}
.sbtn:not(:last-child) { border-right: 1px solid var(--border); }
.sbtn:hover { background: var(--bg2); color: var(--text); }
.sbtn.active-complete { background: rgba(78,232,122,0.2);  color: var(--complete); }
.sbtn.active-half     { background: rgba(240,196,78,0.2);  color: var(--half); }
.sbtn.active-skip     { background: rgba(107,103,98,0.15); color: var(--muted); }

/* Weight input */
.wt-wrap { position: relative; display: flex; align-items: center; }
.wt-input {
  width: 68px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: var(--mono);
  font-size: 13px; padding: 6px 22px 6px 7px;
  text-align: right; outline: none;
  transition: border-color 0.15s;
  -moz-appearance: textfield;
}
.wt-input::-webkit-inner-spin-button,
.wt-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.wt-input:focus { border-color: var(--push); }
.wt-unit {
  position: absolute; right: 6px;
  font-family: var(--mono); font-size: 9px;
  color: var(--muted); pointer-events: none;
}

/* Previous weight */
.prev-wt {
  font-family: var(--mono); font-size: 10px;
  color: var(--muted); min-width: 64px; line-height: 1.4;
}
.prev-wt .up   { color: var(--complete); }
.prev-wt .down { color: var(--ab); }
.prev-wt .same { color: var(--muted); }
.prev-wt .nodata { color: rgba(107,103,98,0.35); font-size: 9px; }

/* ── PER-SET INPUTS ── */
.sets-toggle-btn {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.05em; color: var(--muted);
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 10px; cursor: pointer;
  white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
}
.sets-toggle-btn:hover { border-color: var(--muted); color: var(--text); }
.sets-toggle-btn.open { border-color: var(--muted); color: var(--text); }
.sets-panel {
  display: none; padding: 10px 0 4px 0;
  border-top: 1px solid var(--border); margin-top: 8px;
}
.sets-panel.open { display: flex; flex-wrap: wrap; gap: 8px; }
.set-item { display: flex; align-items: center; gap: 5px; }
.set-label {
  font-family: var(--mono); font-size: 10px;
  color: var(--muted); letter-spacing: 0.05em; min-width: 22px;
}
.set-wt-input {
  width: 60px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: var(--mono);
  font-size: 12px; padding: 5px 18px 5px 5px;
  text-align: right; outline: none;
  transition: border-color 0.15s;
  -moz-appearance: textfield;
}
.set-wt-input::-webkit-inner-spin-button,
.set-wt-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.set-wt-input:focus { border-color: var(--push); }

/* ── AB / TIP BLOCKS ── */
.ab-block {
  background: var(--bg2); border: 1px solid var(--border);
  border-left: 3px solid var(--ab); border-radius: 4px;
  padding: 16px 18px; margin-top: 20px;
}
.ab-block-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px; flex-wrap: wrap;
}
.ab-rounds { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.tip-box {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 4px; padding: 11px 14px; margin-top: 12px;
  font-size: 12px; color: var(--muted); line-height: 1.7;
}
.tip-box strong { color: var(--text); font-weight: 500; }

/* Updated badge */
.badge-updated {
  display: inline-block; font-family: var(--mono);
  font-size: 9px; letter-spacing: 0.07em; text-transform: uppercase;
  background: rgba(78,232,200,0.1); color: var(--pull);
  border: 1px solid rgba(78,232,200,0.22);
  padding: 1px 5px; border-radius: 2px;
  margin-left: 6px; vertical-align: middle;
}

/* ── RUN SESSION ── */
.run-metrics {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px; margin-bottom: 28px;
}
.metric-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 6px; padding: 16px 18px;
}
.metric-label {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
}
.metric-input-row { display: flex; align-items: center; gap: 6px; }
.metric-input {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text);
  font-family: var(--mono); font-size: 18px;
  padding: 6px 10px; outline: none; width: 100%;
  text-align: center; transition: border-color 0.15s;
  -moz-appearance: textfield;
}
.metric-input::-webkit-inner-spin-button,
.metric-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.metric-input:focus { border-color: var(--run); }
.metric-unit { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.metric-pace-val {
  font-family: var(--mono); font-size: 24px;
  color: var(--run); letter-spacing: -0.01em;
}
.metric-pace-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 4px; }

/* Time inputs */
.time-inputs { display: flex; align-items: center; gap: 6px; }
.time-sep {
  font-family: var(--mono); font-size: 18px;
  color: var(--muted); line-height: 1;
}
.time-input {
  width: 52px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: var(--mono);
  font-size: 18px; padding: 6px 4px;
  text-align: center; outline: none;
  transition: border-color 0.15s; -moz-appearance: textfield;
}
.time-input::-webkit-inner-spin-button,
.time-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.time-input:focus { border-color: var(--run); }

/* ── MT SESSION ── */
.mt-duration-row {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 6px; padding: 14px 18px; margin-bottom: 24px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.mt-activities {
  margin-bottom: 28px;
}
.mt-activities-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px; margin-top: 2px;
}
.activity-check {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--bg2);
  border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; transition: all 0.15s; user-select: none;
}
.activity-check:hover { border-color: var(--muted); background: var(--bg3); }
.activity-check.checked { border-color: var(--mt); background: rgba(240,78,120,0.08); }
.activity-check input { display: none; }
.activity-check-icon {
  width: 18px; height: 18px;
  border: 1px solid var(--border); border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; flex-shrink: 0;
  transition: all 0.15s; color: transparent;
}
.activity-check.checked .activity-check-icon {
  background: var(--mt); border-color: var(--mt); color: #fff;
}
.activity-check-label { font-size: 13px; font-weight: 400; }

/* ── NOTES ── */
.notes-wrap { margin-top: 28px; }
.notes-textarea {
  width: 100%; background: var(--bg2);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 13px; padding: 12px 14px; resize: vertical;
  outline: none; min-height: 80px; margin-top: 8px;
  transition: border-color 0.15s; line-height: 1.6;
}
.notes-textarea:focus { border-color: var(--push); }
.notes-textarea::placeholder { color: var(--muted); }

/* ── HISTORY ── */
.hist-filters {
  display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.filter-btn {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border); cursor: pointer;
  background: var(--bg2); color: var(--muted);
  transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--muted); color: var(--text); }
.filter-btn.active { background: var(--bg3); border-color: var(--text); color: var(--text); }
.hist-count {
  font-family: var(--mono); font-size: 11px;
  color: var(--muted); margin-bottom: 16px; letter-spacing: 0.04em;
}
.session-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 6px; margin-bottom: 10px; overflow: hidden;
}
.sc-head {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; cursor: pointer;
  transition: background 0.12s; flex-wrap: wrap;
}
.sc-head:hover { background: var(--bg3); }
.sc-date { font-family: var(--mono); font-size: 12px; color: var(--text); min-width: 90px; flex-shrink: 0; }
.sc-type { flex-shrink: 0; }
.sc-stats {
  display: flex; gap: 10px; font-family: var(--mono);
  font-size: 10px; color: var(--muted); flex: 1; flex-wrap: wrap;
}
.sc-stats .s-done { color: var(--complete); }
.sc-stats .s-half { color: var(--half); }
.sc-chevron { font-size: 11px; color: var(--muted); transition: transform 0.2s; margin-left: auto; flex-shrink: 0; }
.session-card.open .sc-chevron { transform: rotate(180deg); }
.sc-body { display: none; padding: 0 18px 16px; border-top: 1px solid var(--border); }
.session-card.open .sc-body { display: block; }
.sc-bw { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 10px 0 4px; }
.hist-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 7px 0; border-bottom: 1px solid rgba(42,42,42,0.4);
  flex-wrap: wrap;
}
.hist-row:last-child { border-bottom: none; }
.hist-icon { font-family: var(--mono); font-size: 12px; width: 18px; flex-shrink: 0; text-align: center; padding-top: 1px; }
.hist-name { flex: 1; font-size: 13px; color: var(--text); min-width: 120px; }
.hist-wt { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; }
.hist-sets-detail { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; width: 100%; padding-left: 28px; }
.sc-notes { font-size: 12px; color: var(--muted); font-style: italic; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 8px; line-height: 1.6; }

/* ── PROGRESS ── */
.progress-bw-section {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 6px; padding: 20px 22px; margin-bottom: 36px;
}
.progress-sec-label {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 16px;
}
.bw-chart { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.bw-entry { text-align: center; }
.bw-entry-date { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-bottom: 4px; }
.bw-entry-val {
  font-family: var(--mono); font-size: 13px; color: var(--text);
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 8px;
}
.bw-entry.latest .bw-entry-val { border-color: var(--push); color: var(--push); }
.progress-day { margin-bottom: 40px; }
.progress-day-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.progress-day-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px; letter-spacing: 0.04em;
}
.prog-table { width: 100%; border-collapse: collapse; }
.prog-table th {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); padding: 7px 10px 7px 0;
  text-align: left; border-bottom: 1px solid var(--border); font-weight: 500;
}
.prog-table td { padding: 10px 10px 10px 0; border-bottom: 1px solid rgba(42,42,42,0.4); vertical-align: middle; }
.prog-table tr:last-child td { border-bottom: none; }
.prog-ex-name { font-size: 13px; font-weight: 500; color: var(--text); }
.prog-ex-sets { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }
.wt-dots { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.wt-dot {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  padding: 2px 6px; background: var(--bg3);
  border-radius: 3px; border: 1px solid var(--border);
}
.wt-dot.latest { color: var(--text); border-color: var(--muted); }
.wt-dot.empty  { color: rgba(107,103,98,0.3); border-color: rgba(42,42,42,0.3); }
.trend {
  font-family: var(--mono); font-size: 11px;
  padding: 2px 8px; border-radius: 3px; white-space: nowrap;
}
.trend.up   { background: rgba(78,232,122,0.12); color: var(--complete); }
.trend.down { background: rgba(240,113,78,0.12);  color: var(--ab); }
.trend.same { background: var(--bg3); color: var(--muted); }
.trend.none { color: rgba(107,103,98,0.4); font-size: 10px; }

/* Run progress */
.run-hist-row {
  display: flex; gap: 10px; flex-wrap: wrap;
  padding: 10px 0; border-bottom: 1px solid rgba(42,42,42,0.4);
  align-items: center;
}
.run-hist-row:last-child { border-bottom: none; }
.run-hist-date { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 90px; }
.run-hist-dist { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--run); min-width: 60px; }
.run-hist-time { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 60px; }
.run-hist-pace { font-family: var(--mono); font-size: 12px; color: var(--text); }

/* ── EMPTY / MISC ── */
.empty { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 28px 0; letter-spacing: 0.04em; }
.divider { height: 1px; background: var(--border); margin: 36px 0; position: relative; }
.divider::after { content: ''; position: absolute; left: 0; top: 0; height: 1px; width: 80px; background: var(--push); }

/* ── SYNC PANEL ── */
.sync-panel {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 6px; padding: 18px 20px; margin-top: 4px;
}
.sync-desc { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
.sync-desc strong { color: var(--text); }
.sync-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sync-token-input {
  flex: 1; min-width: 180px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: var(--mono);
  font-size: 12px; padding: 7px 12px; outline: none;
  transition: border-color 0.15s; letter-spacing: 0.02em;
}
.sync-token-input:focus { border-color: var(--push); }
.sync-status-row {
  display: flex; align-items: center; gap: 10px;
  margin-top: 12px; flex-wrap: wrap;
}
.sync-indicator {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  flex: 1;
}
.sync-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--border); flex-shrink: 0;
  transition: background 0.3s;
}
.sync-dot.ok      { background: var(--complete); }
.sync-dot.err     { background: var(--ab); }
.sync-dot.syncing { background: var(--push); animation: blink 0.9s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.sync-gist-id {
  font-family: var(--mono); font-size: 9px;
  color: rgba(107,103,98,0.35); margin-top: 8px;
  word-break: break-all;
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; padding: 11px 20px;
  font-family: var(--mono); font-size: 11px;
  color: var(--text); letter-spacing: 0.06em;
  transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 1000; white-space: nowrap; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok { border-color: var(--complete); color: var(--complete); }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .start-grid, .start-row { grid-template-columns: 1fr; }
  .nav-bw-label { display: none; }
  .ex-controls { width: 100%; }
  .run-metrics { grid-template-columns: 1fr 1fr; }
  .prog-table th:nth-child(2), .prog-table td:nth-child(2) { display: none; }
}

/* ── PWA SAFE AREAS (Android notch / gesture bar) ── */
.nav { padding-top: env(safe-area-inset-top); }
.page { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
</style>
</head>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════
   EXERCISE DATA
════════════════════════════════════════════════════════════ */
const PLAN = {

      ]},
      { label:'Accessories', isAbs:false, items:[
        { id:'l_curl',   name:'Dumbbell or barbell curl',  note:'Supinate at the top for full bicep contraction', sets:'3 × 10–12 reps', weighted:true },
        { id:'l_farmer', name:'Farmer carries (kettlebell)',note:'Grip, core, upper trap; walk 30 m per set',     sets:'3 × 30 m',       weighted:true }
      ]},
      { label:'Definition Abs', isAbs:true, abRounds:'3 rounds · 45 sec rest between rounds',
        tip:'<strong>Why two circuits:</strong> Strength circuit builds thickness. Definition circuit adds volume and metabolic stress at higher reps.',
        items:[
          { id:'l_bicycle',   name:'Bicycle crunches',       note:"Don't yank your neck, lead with the elbow",          sets:'20 reps each side', weighted:false },
          { id:'l_reverse',   name:'Reverse crunches',       note:'Curl hips toward the ceiling; hits lower abs',       sets:'15 reps',           weighted:false },
          { id:'l_plank_tap', name:'Plank with shoulder tap',note:'Hips stay square; anti-rotation challenge',           sets:'12 taps each side', weighted:false },
          { id:'l_vsit',      name:'V-sit hold or tuck hold',note:'Tuck hold is the regression; progress to full V-sit', sets:'30 sec',            weighted:false }
        ]}
    ]
  }
};

const RUN_PLAN = {
  tag:'Run', tagClass:'tag-run', btnCls:'btn-run',
  name:'Cardio Run',
  duration:'Track distance, time & pace',
  sections:[
    { label:'Warmup — 5 min', isTips:true, items:[
      { name:'Brisk walk',              note:'2–3 min easy; raise heart rate before running',        sets:'2–3 min' },
      { name:'Leg swings',              note:'Forward/back and lateral; loosen hips and hamstrings', sets:'10 each × 2 dir' },

      { name:'High knees (march)',      note:'Activates glutes and hip flexors',                      sets:'20 steps' },

    ]},
    { label:'Cool Down — 5–10 min', isTips:true, items:[
      { name:'Easy walk',               note:"Let heart rate drop naturally — don't stop dead",       sets:'5 min' },
      { name:'Standing quad stretch',   note:'Hold 30 sec each leg; critical after running',          sets:'30 sec × 2' },
      { name:'Toe-touch hamstring',     note:"Don't bounce; breathe and hold",                        sets:'30 sec × 2' },
      { name:'Hip flexor lunge stretch',note:'Reduces lower back tightness; hold each side',          sets:'30 sec each' },
      { name:'Wall calf stretch',       note:'Both gastrocnemius and soleus',                          sets:'30 sec each' }
    ]}
  ]
};

const MT_ACTIVITIES = [
  { id:'mt_drilling',     name:'Technique drilling' },
  { id:'mt_pads',         name:'Pad work' },
  { id:'mt_bag',          name:'Bag work' },
  { id:'mt_sparring',     name:'Sparring' },
  { id:'mt_clinch',       name:'Clinch work' },
  { id:'mt_conditioning', name:'Conditioning / circuits' }
];

/* ════════════════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════════════════ */
let S = { view:'home', draft:null, sessions:[], bodyWeight:null, syncToken:null, syncGistId:null, syncStatus:'idle', syncLastAt:null };

/* ════════════════════════════════════════════════════════════
   PERSISTENCE
════════════════════════════════════════════════════════════ */
function persist() {
  try {
    localStorage.setItem('lt_sessions', JSON.stringify(S.sessions));
    localStorage.setItem('lt_bw', S.bodyWeight ?? '');
    if (S.draft) localStorage.setItem('lt_draft', JSON.stringify(S.draft));
    else         localStorage.removeItem('lt_draft');
    if (S.syncToken)  localStorage.setItem('lt_sync_token', S.syncToken);
    if (S.syncGistId) localStorage.setItem('lt_sync_gist',  S.syncGistId);
    if (S.syncLastAt) localStorage.setItem('lt_sync_last',  S.syncLastAt);
  } catch(e) {}
}

function hydrate() {
  try {
    const s = localStorage.getItem('lt_sessions');
    if (s) S.sessions = JSON.parse(s);
    const bw = localStorage.getItem('lt_bw');
    if (bw) S.bodyWeight = parseFloat(bw);
    const d = localStorage.getItem('lt_draft');
    if (d) S.draft = JSON.parse(d);
    const tok = localStorage.getItem('lt_sync_token');
    if (tok) S.syncToken = tok;
    const gist = localStorage.getItem('lt_sync_gist');
    if (gist) S.syncGistId = gist;
    const last = localStorage.getItem('lt_sync_last');
    if (last) S.syncLastAt = last;
  } catch(e) {}
}

/* ════════════════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════════════════ */
function todayISO() { return new Date().toISOString().slice(0, 10); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso + 'T00:00:00')
    .toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

function fmtPace(distKm, totalSec) {
  if (!distKm || !totalSec || distKm <= 0) return '—';
  const secPerKm = totalSec / distKm;
  const m = Math.floor(secPerKm / 60);
  const s = Math.round(secPerKm % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

function fmtTime(totalSec) {
  if (!totalSec) return '—';
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function runTotalSec(draft) {
  const r = draft.run ?? {};
  return ((r.durationH ?? 0) * 3600) + ((r.durationM ?? 0) * 60) + (r.durationS ?? 0);
}

function allExercises(dayType) {
  const plan = dayType === 'run' ? RUN_PLAN : PLAN[dayType];
  if (!plan) return [];
  return plan.sections.flatMap(s => s.items);
}

function lastSession(dayType) {
  return [...S.sessions]
    .filter(s => s.dayType === dayType)
    .sort((a,b) => b.date.localeCompare(a.date))[0] ?? null;
}

function prevWeight(exId, dayType, skipDate) {
  const past = [...S.sessions]
    .filter(s => s.dayType === dayType && s.date !== skipDate)
    .sort((a,b) => b.date.localeCompare(a.date));
  for (const s of past) {
    const w = s.exercises?.[exId]?.weight;
    if (w != null && w !== '') return { weight: parseFloat(w), date: s.date };
  }
  return null;
}

function weightHistory(exId, dayType, n=5) {
  return [...S.sessions]
    .filter(s => s.dayType === dayType && s.exercises?.[exId]?.weight != null)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(-n)
    .map(s => ({ date:s.date, w:parseFloat(s.exercises[exId].weight) }));
}

function bwHistory(n=12) {
  return [...S.sessions]
    .filter(s => s.bodyWeight != null)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(-n)
    .map(s => ({ date:s.date, w:s.bodyWeight }));
}

function sessionStats(session) {
  const ex = Object.values(session.exercises ?? {});
  return {
    done: ex.filter(e => e.status === 'complete').length,
    half: ex.filter(e => e.status === 'half').length,
    skip: ex.filter(e => e.status === 'skip').length
  };
}

function statusIcon(status) {
  if (status === 'complete') return `<span style="color:var(--complete)">✓</span>`;
  if (status === 'half')     return `<span style="color:var(--half)">~</span>`;
  if (status === 'skip')     return `<span style="color:var(--muted)">✗</span>`;
  return `<span style="color:var(--border)">·</span>`;
}

function weekBounds() {
  const now = new Date(); now.setHours(0,0,0,0);
  const start = new Date(now);
  start.setDate(now.getDate() - now.getDay()); // Sunday
  return start;
}

function monthBounds() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), 1);
}

function filterSessions(filter, sessions) {
  if (filter === 'week') {
    const start = weekBounds();
    return sessions.filter(s => new Date(s.date + 'T00:00:00') >= start);
  }
  if (filter === 'month') {
    const start = monthBounds();
    return sessions.filter(s => new Date(s.date + 'T00:00:00') >= start);
  }
  return sessions;
}

let _histFilter = 'all';

let _toastTid;
function toast(msg, cls='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (cls ? ' '+cls : '');
  clearTimeout(_toastTid);
  _toastTid = setTimeout(() => { el.className = 'toast'; }, 2600);
}

/* ════════════════════════════════════════════════════════════
   NAVIGATION
════════════════════════════════════════════════════════════ */
function nav(view) {
  S.view = view;
  ['home','session','history','progress','sync'].forEach(v => {
    document.getElementById('view-'+v).style.display = v === view ? '' : 'none';
    document.getElementById('tab-'+v).classList.toggle('active', v === view);
  });
  const st = document.getElementById('tab-session');
  if (S.draft) { st.classList.add('has-draft'); st.textContent = 'Session ●'; }
  else         { st.classList.remove('has-draft'); st.textContent = 'Session'; }
  render(view);
}

function render(view) {
  if (view === 'home')     renderHome();
  if (view === 'session')  renderSession();
  if (view === 'history')  renderHistory();
  if (view === 'progress') renderProgress();
  if (view === 'sync')     renderSync();
}

/* ════════════════════════════════════════════════════════════
   HOME
════════════════════════════════════════════════════════════ */
function renderHome() {
  const lp = lastSession('push'), ll = lastSession('pull');
  const lr = lastSession('run'),  lm = lastSession('mt');
  const weekCount  = filterSessions('week',  S.sessions).length;
  const monthCount = filterSessions('month', S.sessions).length;
  const recent = [...S.sessions].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 4);

  // Last run stats
  let lastRunStr = 'No runs yet';
  if (lr?.run?.distanceKm) {
    lastRunStr = `Last: <strong>${lr.run.distanceKm} km</strong> · ${fmtDate(lr.date)}`;
  } else if (lr) {
    lastRunStr = `Last: <strong>${fmtDate(lr.date)}</strong>`;
  }

  document.getElementById('view-home').innerHTML = `
    <div class="home-title">2-DAY<br><span>LIFT</span><br>SPLIT</div>
    <div class="home-subtitle">Push / Pull · Cables-free · ~60 min</div>

    <div class="home-stats">
      <div class="stat-pill">This week: <strong>${weekCount}</strong> session${weekCount !== 1 ? 's' : ''}</div>
      <div class="stat-pill">This month: <strong>${monthCount}</strong> session${monthCount !== 1 ? 's' : ''}</div>
      ${S.bodyWeight ? `<div class="stat-pill">Body weight: <strong>${S.bodyWeight} kg</strong></div>` : ''}
    </div>

    ${S.draft ? `
    <div class="draft-banner">
      <div class="draft-banner-info">
        <div class="draft-banner-title">Resume in-progress session</div>
        <div class="draft-banner-sub">${S.draft.dayType.toUpperCase()} · ${fmtDate(S.draft.date)}</div>

function renderSession() {
  if (!S.draft)               { renderNoSession(); return; }
  if (S.draft.dayType === 'run') { renderRunSession(); return; }
  if (S.draft.dayType === 'mt')  { renderMTSession();  return; }
  renderLiftSession();
}

function renderNoSession() {
  document.getElementById('view-session').innerHTML = `
    <div style="padding:56px 0;text-align:center;">

/* ─── LIFT SESSION ─── */

    <div class="session-header">
      <div>
        <span class="tag ${def.tagClass}">${def.tag}</span>
        <div class="session-title">${def.name}</div>
        <div class="session-meta">${def.duration} &nbsp;·&nbsp; ${fmtDate(d.date)}</div>
      </div>
      <div class="session-actions">
        <button class="btn ${def.btnCls}" onclick="saveSession()">Save Session</button>
        <button class="btn btn-danger btn-sm" onclick="discardDraft()">Discard</button>
      </div>
    </div>
    <div class="bw-row">
      <span class="bw-row-label">Body weight today</span>
      <input class="bw-input" type="number" id="sess-bw"

      <button class="btn ${def.btnCls}" onclick="saveSession()">Save Session</button>
      <button class="btn btn-danger" onclick="discardDraft()">Discard</button>
    </div>`;

  document.getElementById('view-session').innerHTML = html;
}

function exRowHTML(ex, draft) {
  const logged  = draft.exercises[ex.id] ?? {};
  const status  = logged.status ?? 'none';
  const wt      = logged.weight ?? '';
  const sets    = logged.sets ?? [];

  // Per-set toggle for main lifts
  const isMain = !!ex.setCount;
  let controlsHTML = '';

  if (isMain) {
    const maxWt = sets.filter(w => w != null && w !== '').length
      ? Math.max(...sets.filter(w => w != null && w !== ''))
      : null;
    const btnLabel = maxWt != null ? `${maxWt} kg — ${ex.setCount} sets ▾` : `${ex.setCount} sets ▾`;
    const prev = prevWeight(ex.id, draft.dayType, draft.date);
    let prevHTML = '';
    if (prev) {
      const curr = maxWt;
      let cls = 'same', sym = '→ ';
      if (curr != null && curr > prev.weight) { cls = 'up';   sym = '↑ '; }
      if (curr != null && curr < prev.weight) { cls = 'down'; sym = '↓ '; }
      if (curr == null) sym = '';
      prevHTML = `<div class="prev-wt">
        <span class="${cls}">${sym}${prev.weight}kg</span><br>
        <span style="font-size:9px;color:var(--muted)">${fmtDate(prev.date)}</span>
      </div>`;
    } else {
      prevHTML = `<div class="prev-wt"><span class="nodata">first</span></div>`;
    }

    const setInputs = Array.from({length: ex.setCount}, (_, i) => {
      const v = sets[i] != null ? sets[i] : '';
      return `<div class="set-item">
        <span class="set-label">S${i+1}</span>
        <div class="wt-wrap">
          <input class="set-wt-input" type="number" step="0.5" min="0" max="500"
            placeholder="—" value="${v}"
            oninput="setSetWeight('${ex.id}',${i},this.value)">
          <span class="wt-unit">kg</span>
        </div>
      </div>`;
    }).join('');

    const panelOpen = sets.some(w => w != null && w !== '') ? ' open' : '';

    controlsHTML = `
      <div class="ex-controls">
        <div class="status-group">
          <button class="sbtn ${status==='complete'?'active-complete':''}" onclick="setStatus('${ex.id}','complete')" title="Completed">✓</button>
          <button class="sbtn ${status==='half'    ?'active-half'    :''}" onclick="setStatus('${ex.id}','half')"    title="Partial">~</button>
          <button class="sbtn ${status==='skip'    ?'active-skip'    :''}" onclick="setStatus('${ex.id}','skip')"    title="Skipped">✗</button>
        </div>
        <button class="sets-toggle-btn${panelOpen ? ' open' : ''}" id="sets-btn-${ex.id}"
          onclick="toggleSets('${ex.id}')">${btnLabel}</button>
        ${prevHTML}
      </div>
      <div class="sets-panel${panelOpen}" id="sets-panel-${ex.id}">
        ${setInputs}
      </div>`;
  } else {
    const prev = ex.weighted ? prevWeight(ex.id, draft.dayType, draft.date) : null;
    let prevHTML = '';
    if (ex.weighted) {
      if (prev) {
        const curr = parseFloat(wt);
        let cls = 'same', sym = '→ ';
        if (!isNaN(curr) && curr > prev.weight) { cls = 'up';   sym = '↑ '; }
        if (!isNaN(curr) && curr < prev.weight) { cls = 'down'; sym = '↓ '; }
        if (isNaN(curr)) sym = '';
        prevHTML = `<div class="prev-wt">
          <span class="${cls}">${sym}${prev.weight}kg</span><br>
          <span style="font-size:9px;color:var(--muted)">${fmtDate(prev.date)}</span>
        </div>`;
      } else {
        prevHTML = `<div class="prev-wt"><span class="nodata">first</span></div>`;
      }
    }
    controlsHTML = `
      <div class="ex-controls">
        <div class="status-group">
          <button class="sbtn ${status==='complete'?'active-complete':''}" onclick="setStatus('${ex.id}','complete')" title="Completed">✓</button>
          <button class="sbtn ${status==='half'    ?'active-half'    :''}" onclick="setStatus('${ex.id}','half')"    title="Partial">~</button>
          <button class="sbtn ${status==='skip'    ?'active-skip'    :''}" onclick="setStatus('${ex.id}','skip')"    title="Skipped">✗</button>
        </div>
        ${ex.weighted ? `<div class="wt-wrap">
          <input class="wt-input" type="number" step="0.5" min="0" max="500"
            placeholder="—" value="${wt}"
            oninput="setWeight('${ex.id}',this.value)">
          <span class="wt-unit">kg</span>
        </div>` : ''}
        ${prevHTML}
      </div>`;
  }

  return `
    <div class="ex-row s-${status}" id="row-${ex.id}">
      <div class="ex-row-main">
        <div class="ex-info">
          <div class="ex-name">${ex.name}${ex.updated ? '<span class="badge-updated">updated</span>' : ''}</div>
          <div class="ex-note">${ex.note}</div>
        </div>
        <div class="ex-sets">${ex.sets}</div>
        ${controlsHTML}
      </div>
      ${isMain ? `<div class="sets-panel${sets.some(w=>w!=null&&w!=='')?' open':''}" id="sets-panel-${ex.id}">${
        Array.from({length:ex.setCount},(_,i)=>{
          const v=sets[i]!=null?sets[i]:'';
          return `<div class="set-item"><span class="set-label">S${i+1}</span><div class="wt-wrap"><input class="set-wt-input" type="number" step="0.5" min="0" max="500" placeholder="—" value="${v}" oninput="setSetWeight('${ex.id}',${i},this.value)"><span class="wt-unit">kg</span></div></div>`;
        }).join('')
      }</div>` : ''}
    </div>`;
}

/* ════════════════════════════════════════════════════════════
   HISTORY
════════════════════════════════════════════════════════════ */
function renderHistory() {
  const filtered = filterSessions(_histFilter, S.sessions)
    .sort((a,b) => b.date.localeCompare(a.date));

  document.getElementById('view-history').innerHTML = `
    <div class="hist-filters">
      <button class="filter-btn ${_histFilter==='all'  ?'active':''}" onclick="setHistFilter('all')">All time</button>
      <button class="filter-btn ${_histFilter==='month'?'active':''}" onclick="setHistFilter('month')">This month</button>
      <button class="filter-btn ${_histFilter==='week' ?'active':''}" onclick="setHistFilter('week')">This week</button>
    </div>
    <div class="hist-count">${filtered.length} session${filtered.length!==1?'s':''} found</div>
    ${filtered.length === 0
      ? `<div class="empty">No sessions in this period.</div>`
      : filtered.map(s => sessionCardHTML(s, true)).join('')}`;
}

function setHistFilter(f) {
  _histFilter = f;
  renderHistory();
}

function sessionCardHTML(session, expandable) {
  const dt = session.dayType;
  let tagClass, tagLabel;
  if (dt === 'push')  { tagClass = 'tag-push'; tagLabel = 'Push Day'; }
  else if (dt === 'pull')  { tagClass = 'tag-pull'; tagLabel = 'Pull Day'; }
  else if (dt === 'run')   { tagClass = 'tag-run';  tagLabel = 'Run'; }
  else if (dt === 'mt')    { tagClass = 'tag-mt';   tagLabel = 'Muay Thai'; }
  else                      { tagClass = '';          tagLabel = dt; }

  let statsHTML = '';
  let bodyHTML = '';

  if (dt === 'run') {
    const r = session.run ?? {};
    const totalSec = ((r.durationH??0)*3600)+((r.durationM??0)*60)+(r.durationS??0);
    const pace = fmtPace(r.distanceKm, totalSec);
    if (r.distanceKm) statsHTML += `<span style="color:var(--run)">${r.distanceKm} km</span>`;
    if (totalSec)     statsHTML += `<span>${fmtTime(totalSec)}</span>`;
    if (r.distanceKm && totalSec) statsHTML += `<span>${pace} /km</span>`;

    if (expandable) {
      const exs = allExercises('run');
      bodyHTML = `
        ${session.bodyWeight ? `<div class="sc-bw">Body weight: ${session.bodyWeight} kg</div>` : ''}
        ${r.distanceKm ? `<div class="hist-row"><div class="hist-icon" style="color:var(--run)">⊙</div><div class="hist-name">Distance</div><div class="hist-wt">${r.distanceKm} km</div></div>` : ''}
        ${totalSec ? `<div class="hist-row"><div class="hist-icon">⏱</div><div class="hist-name">Duration</div><div class="hist-wt">${fmtTime(totalSec)}</div></div>` : ''}
        ${r.distanceKm && totalSec ? `<div class="hist-row"><div class="hist-icon">→</div><div class="hist-name">Pace</div><div class="hist-wt">${pace}/km</div></div>` : ''}
        ${exs.map(ex => {
          const lg = session.exercises?.[ex.id] ?? {};
          return `<div class="hist-row">
            <div class="hist-icon">${statusIcon(lg.status??'none')}</div>
            <div class="hist-name">${ex.name}</div>
          </div>`;
        }).join('')}
        ${session.notes ? `<div class="sc-notes">${session.notes}</div>` : ''}`;
    }
  } else if (dt === 'mt') {
    const mt = session.mt ?? {};
    if (mt.durationMin) statsHTML += `<span>${mt.durationMin} min</span>`;
    const actNames = (mt.activities ?? []).map(id => MT_ACTIVITIES.find(a=>a.id===id)?.name).filter(Boolean);
    if (actNames.length) statsHTML += `<span>${actNames.join(' · ')}</span>`;

    if (expandable) {
      bodyHTML = `
        ${mt.durationMin ? `<div class="hist-row"><div class="hist-icon">⏱</div><div class="hist-name">Duration</div><div class="hist-wt">${mt.durationMin} min</div></div>` : ''}
        ${actNames.length ? `<div class="hist-row"><div class="hist-icon" style="color:var(--mt)">✦</div><div class="hist-name">Covered</div><div class="hist-wt" style="font-size:11px;text-align:left;flex:1">${actNames.join(', ')}</div></div>` : ''}
        ${session.notes ? `<div class="sc-notes">${session.notes}</div>` : ''}`;
    }
  } else {
    const st = sessionStats(session);
    if (st.done) statsHTML += `<span class="s-done">✓ ${st.done}</span>`;
    if (st.half) statsHTML += `<span class="s-half">~ ${st.half}</span>`;
    if (st.skip) statsHTML += `<span>✗ ${st.skip}</span>`;
    if (session.bodyWeight) statsHTML += `<span>${session.bodyWeight} kg bw</span>`;

    if (expandable) {
      const exs = allExercises(dt);
      bodyHTML = `
        ${session.bodyWeight ? `<div class="sc-bw">Body weight: ${session.bodyWeight} kg</div>` : ''}
        ${exs.map(ex => {
          const lg = session.exercises?.[ex.id] ?? {};
          const setArr = lg.sets ?? [];
          const setStr = setArr.filter(w=>w!=null&&w!=='').map((w,i)=>`S${i+1}:${w}kg`).join('  ');
          const wt = lg.weight;
          return `<div class="hist-row">
            <div class="hist-icon">${statusIcon(lg.status??'none')}</div>
            <div class="hist-name">${ex.name}</div>
            <div class="hist-wt">${setStr || (wt!=null&&wt!=='' ? wt+' kg' : '')}</div>
          </div>`;
        }).join('')}
        ${session.notes ? `<div class="sc-notes">${session.notes}</div>` : ''}`;
    }
  }

  return `
    <div class="session-card" id="card-${session.id}">
      <div class="sc-head" onclick="${expandable ? `toggleCard('${session.id}')` : ''}">
        <div class="sc-date">${fmtDate(session.date)}</div>
        <div class="sc-type"><span class="tag ${tagClass}" style="font-size:9px;padding:2px 8px">${tagLabel}</span></div>
        <div class="sc-stats">${statsHTML}</div>
        ${expandable ? `<div class="sc-chevron">▾</div>` : ''}
      </div>
      ${expandable ? `<div class="sc-body">${bodyHTML}</div>` : ''}
    </div>`;
}

function toggleCard(id) {
  document.getElementById('card-'+id)?.classList.toggle('open');
}

function renderProgress() {
  const el = document.getElementById('view-progress');
  if (S.sessions.length === 0) {
    el.innerHTML = `<div class="empty">No sessions yet — start tracking to see progress here.</div>`;
    return;
  }

  let html = '';

  // Body weight
  const bwH = bwHistory();
  if (bwH.length > 0) {
    html += `<div class="progress-bw-section">
      <div class="progress-sec-label">Body Weight (kg)</div>
      <div class="bw-chart">${bwH.map((e,i)=>`
        <div class="bw-entry ${i===bwH.length-1?'latest':''}">
          <div class="bw-entry-date">${e.date.slice(5)}</div>
          <div class="bw-entry-val">${e.w}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }

  // Lift progress
  ['push','pull'].forEach(dayType => {
    const def = PLAN[dayType];
    const weighted = allExercises(dayType).filter(ex => ex.weighted);
    html += `<div class="progress-day">
      <div class="progress-day-head">
        <span class="tag ${def.tagClass}">${def.tag}</span>
        <div class="progress-day-title">${dayType==='push'?'Push':'Pull'} Day Progression</div>
      </div>
      <table class="prog-table">
        <thead><tr>
          <th>Exercise</th>
          <th>Last 5 sessions</th>
          <th>Trend</th>
        </tr></thead>
        <tbody>${weighted.map(ex => progRowHTML(ex, dayType)).join('')}</tbody>
      </table>
    </div>`;
  });

  // Run history
  const runs = [...S.sessions].filter(s => s.dayType === 'run').sort((a,b) => a.date.localeCompare(b.date));
  if (runs.length > 0) {
    html += `<div class="progress-day">
      <div class="progress-day-head">
        <span class="tag tag-run">Run</span>
        <div class="progress-day-title">Run History</div>
      </div>
      ${runs.map(s => {
        const r = s.run ?? {};
        const totalSec = ((r.durationH??0)*3600)+((r.durationM??0)*60)+(r.durationS??0);
        return `<div class="run-hist-row">
          <div class="run-hist-date">${fmtDate(s.date)}</div>
          <div class="run-hist-dist">${r.distanceKm ? r.distanceKm+' km' : '—'}</div>
          <div class="run-hist-time">${fmtTime(totalSec)}</div>
          <div class="run-hist-pace">${r.distanceKm && totalSec ? fmtPace(r.distanceKm, totalSec)+'/km' : ''}</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // MT frequency
  const mtSessions = S.sessions.filter(s => s.dayType === 'mt');
  if (mtSessions.length > 0) {
    const mtWeek  = filterSessions('week',  mtSessions).length;
    const mtMonth = filterSessions('month', mtSessions).length;
    html += `<div class="progress-day">
      <div class="progress-day-head">
        <span class="tag tag-mt">Muay Thai</span>
        <div class="progress-day-title">MT Frequency</div>
      </div>
      <div class="home-stats" style="margin-bottom:16px">
        <div class="stat-pill">This week: <strong>${mtWeek}</strong> class${mtWeek!==1?'es':''}</div>
        <div class="stat-pill">This month: <strong>${mtMonth}</strong> class${mtMonth!==1?'es':''}</div>
        <div class="stat-pill">Total: <strong>${mtSessions.length}</strong></div>
      </div>
      ${[...mtSessions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(s => {
        const mt = s.mt ?? {};
        const acts = (mt.activities??[]).map(id=>MT_ACTIVITIES.find(a=>a.id===id)?.name).filter(Boolean);
        return `<div class="run-hist-row">
          <div class="run-hist-date">${fmtDate(s.date)}</div>
          <div class="run-hist-dist" style="color:var(--mt)">${mt.durationMin ? mt.durationMin+' min' : '—'}</div>
          <div class="run-hist-pace" style="font-size:11px">${acts.join(', ')}</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  el.innerHTML = html;
}

function progRowHTML(ex, dayType) {
  const hist = weightHistory(ex.id, dayType);
  if (hist.length === 0) {
    return `<tr>
      <td><div class="prog-ex-name">${ex.name}</div><div class="prog-ex-sets">${ex.sets}</div></td>
      <td><span style="font-family:var(--mono);font-size:10px;color:rgba(107,103,98,0.35)">No data yet</span></td>
      <td><span class="trend none">—</span></td>
    </tr>`;
  }
  const latest = hist[hist.length-1].w;
  const prev   = hist.length > 1 ? hist[hist.length-2].w : null;
  let tCls = 'same', tTxt = '→ Same';
  if (prev !== null) {
    if (latest > prev) { tCls='up';   tTxt=`↑ +${(latest-prev).toFixed(1)} kg`; }
    if (latest < prev) { tCls='down'; tTxt=`↓ −${(prev-latest).toFixed(1)} kg`; }
  }
  const dots = Array.from({length:5}, (_,i) => {
    const idx = hist.length - 5 + i;
    if (idx < 0) return `<span class="wt-dot empty">—</span>`;
    const isLast = idx === hist.length-1;
    return `<span class="wt-dot ${isLast?'latest':''}" title="${fmtDate(hist[idx].date)}">${hist[idx].w}kg</span>`;
  });
  return `<tr>
    <td><div class="prog-ex-name">${ex.name}</div><div class="prog-ex-sets">${ex.sets}</div></td>
    <td><div class="wt-dots">${dots.join('')}</div></td>
    <td><span class="trend ${tCls}">${tTxt}</span></td>
  </tr>`;
}

/* ════════════════════════════════════════════════════════════
   ACTIONS
════════════════════════════════════════════════════════════ */
function startSession(dayType) {
  if (S.draft) {
    if (!confirm(`You have an unsaved ${S.draft.dayType} session from ${fmtDate(S.draft.date)}.\n\nDiscard it and start a new session?`)) {
      nav('session'); return;
    }
  }
  S.draft = { id:uid(), date:todayISO(), dayType, bodyWeight:S.bodyWeight, exercises:{}, notes:'' };
  if (dayType === 'run') S.draft.run = {};
  if (dayType === 'mt')  S.draft.mt  = { activities:[] };
  persist();
  nav('session');
}

function discardDraft() {
  if (S.draft && !confirm('Discard this session? All unsaved data will be lost.')) return;
  S.draft = null;
  persist();
  nav('home');
}

function saveSession() {
  if (!S.draft) return;
  const sess = { ...S.draft };
  if (sess.bodyWeight != null) {
    S.bodyWeight = sess.bodyWeight;
    const nb = document.getElementById('nav-bw-input');
    if (nb) nb.value = S.bodyWeight;
  }
  const idx = S.sessions.findIndex(s => s.id === sess.id);
  if (idx >= 0) S.sessions[idx] = sess;
  else          S.sessions.push(sess);
  S.draft = null;
  persist();
  toast('Session saved!', 'ok');
  nav('home');
  if (S.syncToken) syncPush();
}

/* ── STATUS / WEIGHT ── */
function setStatus(exId, status) {
  if (!S.draft) return;
  if (!S.draft.exercises[exId]) S.draft.exercises[exId] = {};
  S.draft.exercises[exId].status = S.draft.exercises[exId].status === status ? 'none' : status;
  persist();
  const newStatus = S.draft.exercises[exId].status;
  const row = document.getElementById('row-'+exId);
  if (row) {
    row.className = 'ex-row s-'+newStatus;
    row.querySelectorAll('.sbtn').forEach(btn => {
      btn.className = 'sbtn';
      const m = btn.getAttribute('onclick').match(/'(\w+)'\)$/);
      if (m && newStatus === m[1]) btn.classList.add('active-'+newStatus);
    });
  }
}

function setWeight(exId, value) {
  if (!S.draft) return;
  if (!S.draft.exercises[exId]) S.draft.exercises[exId] = {};
  S.draft.exercises[exId].weight = value !== '' ? parseFloat(value) : null;
  persist();
  updatePrevIndicator(exId, parseFloat(value));
}

function setSetWeight(exId, setIdx, value) {
  if (!S.draft) return;
  if (!S.draft.exercises[exId]) S.draft.exercises[exId] = {};
  if (!S.draft.exercises[exId].sets) S.draft.exercises[exId].sets = [];
  S.draft.exercises[exId].sets[setIdx] = value !== '' ? parseFloat(value) : null;
  // Store max weight for progress tracking
  const validSets = S.draft.exercises[exId].sets.filter(w => w != null);
  S.draft.exercises[exId].weight = validSets.length > 0 ? Math.max(...validSets) : null;
  persist();
  // Update toggle button label
  const maxWt = S.draft.exercises[exId].weight;
  const btn = document.getElementById('sets-btn-'+exId);
  if (btn) {
    const ex = allExercises(S.draft.dayType).find(e => e.id === exId);
    if (ex) btn.textContent = maxWt != null ? `${maxWt} kg — ${ex.setCount} sets ▾` : `${ex.setCount} sets ▾`;
  }
  updatePrevIndicator(exId, maxWt);
}

function updatePrevIndicator(exId, currWt) {
  const prev = prevWeight(exId, S.draft.dayType, S.draft.date);
  if (!prev) return;
  const row = document.getElementById('row-'+exId);
  const pEl = row?.querySelector('.prev-wt');
  if (!pEl) return;
  let cls = 'same', sym = '→ ';
  if (currWt != null && !isNaN(currWt) && currWt > prev.weight) { cls='up';   sym='↑ '; }
  if (currWt != null && !isNaN(currWt) && currWt < prev.weight) { cls='down'; sym='↓ '; }
  if (currWt == null || isNaN(currWt)) sym = '';
  pEl.innerHTML = `<span class="${cls}">${sym}${prev.weight}kg</span><br><span style="font-size:9px;color:var(--muted)">${fmtDate(prev.date)}</span>`;
}

function toggleSets(exId) {
  const panel = document.getElementById('sets-panel-'+exId);
  const btn   = document.getElementById('sets-btn-'+exId);
  if (!panel) return;
  const isOpen = panel.classList.toggle('open');
  if (btn) btn.classList.toggle('open', isOpen);
}

/* ── RUN INPUTS ── */
function onRunInput(field, value) {
  if (!S.draft) return;
  if (!S.draft.run) S.draft.run = {};
  S.draft.run[field] = value !== '' ? parseFloat(value) : null;
  persist();
  // Update pace display live
  const totalSec = runTotalSec(S.draft);
  const pace = fmtPace(S.draft.run.distanceKm, totalSec);
  const paceCard = document.getElementById('pace-card');
  if (paceCard) {
    paceCard.querySelector('.metric-pace-val').textContent = pace;
  }
}

/* ── MT INPUTS ── */
function onMTDuration(value) {
  if (!S.draft) return;
  if (!S.draft.mt) S.draft.mt = { activities:[] };
  S.draft.mt.durationMin = value !== '' ? parseInt(value) : null;
  persist();
}

function toggleActivity(actId) {
  if (!S.draft?.mt) return;
  if (!S.draft.mt.activities) S.draft.mt.activities = [];
  const idx = S.draft.mt.activities.indexOf(actId);
  if (idx >= 0) S.draft.mt.activities.splice(idx, 1);
  else          S.draft.mt.activities.push(actId);
  persist();
  // Toggle CSS class
  const label = document.querySelector(`[onclick="toggleActivity('${actId}')"]`);
  if (label) {
    const checked = S.draft.mt.activities.includes(actId);
    label.classList.toggle('checked', checked);
    const icon = label.querySelector('.activity-check-icon');
    if (icon) icon.textContent = checked ? '✓' : '';
  }
}

/* ── SHARED INPUTS ── */
function onSessBwInput(val) {
  if (!S.draft) return;
  S.draft.bodyWeight = val !== '' ? parseFloat(val) : null;
  persist();
  const nb = document.getElementById('nav-bw-input');
  if (nb) nb.value = val;
}

function onNotesInput(val) {
  if (!S.draft) return;
  S.draft.notes = val;
  persist();
}

function onNavBwInput(val) {
  S.bodyWeight = val !== '' ? parseFloat(val) : null;
  persist();
  if (S.draft) {
    S.draft.bodyWeight = S.bodyWeight;
    persist();
    const sb = document.getElementById('sess-bw');
    if (sb) sb.value = val;
  }
}

/* ════════════════════════════════════════════════════════════
   SYNC VIEW
════════════════════════════════════════════════════════════ */
function renderSync() {
  document.getElementById('view-sync').innerHTML = `
    <div class="home-title" style="font-size:clamp(32px,6vw,56px)">DATA &amp;<br><span>SYNC</span></div>
    <div class="home-subtitle" style="margin-bottom:32px">Backup · Restore · Cloud sync</div>

    <div class="section-label">Backup &amp; Restore</div>
    <div class="sync-panel" style="margin-bottom:28px">
      <div class="sync-desc">
        Export saves a <strong>.json</strong> file to your device — back it up to Google Drive for extra safety.
        Import merges a backup file with your current data, nothing gets overwritten.
      </div>
      <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;">
        <button class="btn" onclick="exportData()" style="flex:1;text-align:center;">↓ Export backup</button>
        <button class="btn" onclick="importData()" style="flex:1;text-align:center;">↑ Import backup</button>
      </div>
    </div>

    <div class="section-label">Cloud Sync — GitHub Gist</div>
    <div class="sync-panel">
      <div class="sync-desc">
        Syncs your data across all devices automatically using a private GitHub Gist.
        Requires a GitHub <strong>Personal Access Token</strong> with <strong>gist</strong> scope.
      </div>
      ${S.syncToken ? `
        <div class="sync-status-row">
          <div class="sync-indicator">
            <div class="sync-dot ${S.syncStatus === 'ok' ? 'ok' : S.syncStatus === 'err' ? 'err' : ''}" id="sync-dot"></div>
            <span id="sync-status-txt">${S.syncStatus === 'ok'
              ? 'Synced' + (S.syncLastAt ? ' · ' + new Date(S.syncLastAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '')
              : S.syncStatus === 'err' ? 'Sync failed — check your token'
              : 'Configured'}</span>
          </div>
          <button class="btn btn-sm" onclick="syncNow()">↻ Sync now</button>
          <button class="btn btn-danger btn-sm" onclick="removeSyncToken()">Remove</button>
        </div>
        ${S.syncGistId ? `<div class="sync-gist-id">Gist: ${S.syncGistId}</div>` : ''}
      ` : `
        <div class="sync-row">
          <input class="sync-token-input" type="password" id="sync-token-input"
            placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxx"
            autocomplete="off" spellcheck="false">
          <button class="btn btn-primary btn-sm" onclick="saveSyncToken()">Enable sync</button>
        </div>
      `}
    </div>
  `;
}

/* ════════════════════════════════════════════════════════════
   EXPORT / IMPORT
════════════════════════════════════════════════════════════ */
function exportData() {
  const payload = {
    version: 1,
    exportedAt: new Date().toISOString(),
    bodyWeight: S.bodyWeight,
    sessions: S.sessions
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `lifttrack-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup downloaded!', 'ok');
}

function importData() {
  const input    = document.createElement('input');
  input.type     = 'file';
  input.accept   = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data.sessions)) throw new Error('invalid');
        // Merge: imported sessions win on ID conflict
        const byId = new Map();
        for (const s of S.sessions)    byId.set(s.id, s);
        for (const s of data.sessions) byId.set(s.id, s);
        S.sessions = [...byId.values()];
        if (data.bodyWeight != null) S.bodyWeight = data.bodyWeight;
        persist();
        if (S.view === 'home') renderHome();
        toast(`Imported ${data.sessions.length} sessions`, 'ok');
      } catch {
        toast('Import failed — file not recognised');
      }
    };
    reader.readAsText(file);
  };
  document.body.appendChild(input);
  input.click();
  document.body.removeChild(input);
}

/* ════════════════════════════════════════════════════════════
   CLOUD SYNC — GitHub Gist
════════════════════════════════════════════════════════════ */
const GIST_FILE = 'lifttrack_data.json';
const GIST_API  = 'https://api.github.com/gists';

function syncHeaders() {
  return {
    'Authorization': `Bearer ${S.syncToken}`,
    'Content-Type': 'application/json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

function setSyncDot(status) {
  S.syncStatus = status;
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-status-txt');
  if (!dot) return;
  dot.className = 'sync-dot' + (status === 'ok' ? ' ok' : status === 'err' ? ' err' : status === 'syncing' ? ' syncing' : '');
  if (txt) {
    if (status === 'syncing') txt.textContent = 'Syncing…';
    else if (status === 'ok') {
      const t = S.syncLastAt ? new Date(S.syncLastAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
      txt.textContent = 'Synced' + (t ? ' · ' + t : '');
    }
    else if (status === 'err') txt.textContent = 'Sync failed — check your token';
    else txt.textContent = 'Not synced yet';
  }
}

async function syncPush() {
  if (!S.syncToken) return;
  setSyncDot('syncing');
  const payload = JSON.stringify({ sessions: S.sessions, bodyWeight: S.bodyWeight });
  try {
    if (S.syncGistId) {
      const r = await fetch(`${GIST_API}/${S.syncGistId}`, {
        method: 'PATCH', headers: syncHeaders(),
        body: JSON.stringify({ files: { [GIST_FILE]: { content: payload } } })
      });
      if (!r.ok) throw new Error('patch failed');
    } else {
      const r = await fetch(GIST_API, {
        method: 'POST', headers: syncHeaders(),
        body: JSON.stringify({
          description: 'LiftTrack workout data — do not edit manually',
          public: false,
          files: { [GIST_FILE]: { content: payload } }
        })
      });
      if (!r.ok) throw new Error('create failed');
      const g = await r.json();
      S.syncGistId = g.id;
    }
    S.syncLastAt = new Date().toISOString();
    persist();
    setSyncDot('ok');
  } catch(e) {
    setSyncDot('err');
  }
}

async function syncPull() {
  if (!S.syncToken || !S.syncGistId) return;
  setSyncDot('syncing');
  try {
    const r = await fetch(`${GIST_API}/${S.syncGistId}`, { headers: syncHeaders() });
    if (!r.ok) throw new Error('fetch failed');
    const g = await r.json();
    const raw = g.files?.[GIST_FILE]?.content;
    if (raw) {
      const remote = JSON.parse(raw);
      // Merge: keep all sessions by ID, remote wins on conflict
      const byId = new Map();
      for (const s of S.sessions)              byId.set(s.id, s);
      for (const s of (remote.sessions ?? [])) byId.set(s.id, s);
      S.sessions = [...byId.values()];
      if (remote.bodyWeight != null) S.bodyWeight = remote.bodyWeight;
      persist();
    }
    S.syncLastAt = new Date().toISOString();
    persist();
    setSyncDot('ok');
  } catch(e) {
    setSyncDot('err');
  }
}

async function saveSyncToken() {
  const input = document.getElementById('sync-token-input');
  const token = input?.value?.trim();
  if (!token) { toast('Paste your GitHub token first'); return; }
  S.syncToken = token;
  persist();
  // First try pulling (picks up existing gist from another device)
  if (S.syncGistId) {
    await syncPull();
  }
  await syncPush();
  renderHome();
  toast('Sync enabled!', 'ok');
}

async function syncNow() {
  if (!S.syncToken) { toast('Set up sync first'); return; }
  await syncPull();
  await syncPush();
  if (S.view === 'home') renderHome();
  else setSyncDot('ok');
}

function removeSyncToken() {
  if (!confirm('Remove sync? Your data stays on this device but will no longer sync.')) return;
  S.syncToken = null; S.syncGistId = null; S.syncStatus = 'idle'; S.syncLastAt = null;
  localStorage.removeItem('lt_sync_token');
  localStorage.removeItem('lt_sync_gist');
  localStorage.removeItem('lt_sync_last');
  renderHome();
}

/* ════════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════════ */
(function init() {
  // Register service worker for PWA / offline support
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  hydrate();
  const nb = document.getElementById('nav-bw-input');
  if (S.bodyWeight) nb.value = S.bodyWeight;
  nav('home');
  // Pull latest data in background if sync is configured
  if (S.syncToken && S.syncGistId) {
    syncPull().then(() => { if (S.view === 'home') renderHome(); });
  }
})();
</script>
