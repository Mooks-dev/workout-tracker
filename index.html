function buildRows(day){
  const rows=[];
  if(day.warmup) rows.push({kind:'warmup',id:'warmup',text:day.warmup});
  (day.lifts||[]).forEach(l=>rows.push({kind:'lift',id:l.id||slug(l.n),name:l.n,scheme:l.s}));
  if(day.cond&&BLOCK_BANK[day.cond]){ const b=BLOCK_BANK[day.cond]; rows.push({kind:'block',id:day.cond,name:b.name,format:b.format,items:b.items,rest:b.rest,rounds:b.rounds}); }
  if(day.wod&&WOD_BANK[day.wod]){ const w=WOD_BANK[day.wod]; rows.push({kind:'wod',id:day.wod,name:w.name,format:w.format,items:w.items,rest:w.rest,rounds:w.rounds}); }
  if(day.ab){ const a=AB_BANK[day.ab];
    rows.push({kind:'abhead',ref:day.ab,title:a.title});
    a.items.forEach(it=>rows.push({kind:'ab',id:slug(it.n),name:it.n,scheme:it.s,timed:it.timed})); }
  return rows;
}
/* Which week of the active plan we're in, 1-based, wrapping at 4. Used by the
   August programme, whose conditioning day alternates HIIT / CrossFit. */
function planWeek(){
  const iso=S.active?.startedISO; if(!iso) return 1;
  const wks=Math.floor((Date.now()-new Date(iso+'T00:00:00').getTime())/6048e5);
  return ((wks%4)+4)%4+1;
}
/* A day carrying .alt swaps to it on even weeks. Everything downstream —
   preview, session rows, the block timer — sees a plain day object. */
function resolveDay(d){ return (d&&d.alt&&planWeek()%2===0) ? {...d,...d.alt} : d; }

/* Preview everywhere — see what you're in for before you commit. */
function startProgramDay(pid,idx){
  const p=progById(pid), d=resolveDay(p.D[idx]);
  openWorkoutDetail(d,{type:'program',programId:pid,dayName:d.name,cat:p.cat},
    d.name, d.tag, `Day ${idx+1} of ${p.D.length}${d.sub?' · '+d.sub:''}`);
}
/* …except the one-tap "today's session" path from Home. */
function riseNow(pid,idx){
  const p=progById(pid), d=resolveDay(p.D[idx]);
  _start(d,{type:'program',programId:pid,dayName:d.name,cat:p.cat},`${p.title} · ${d.name}`,d.tag);
}
function startFreestyle(pid,idx){ const p=progById(pid); openWorkoutDetail(resolveDay(p.D[idx]),{type:'freestyle',dayName:p.D[idx].name,cat:p.cat},p.D[idx].name,p.D[idx].tag,`${p.subtitle} · freestyle`); }
function startCustom(id){ const w=S.customWorkouts.find(x=>x.id===id); if(!w)return; openWorkoutDetail(w,{type:'custom',workoutId:id,cat:'custom'},w.name,null,'Custom workout'); }

function beginPending(){ if(!_pending)return; const p=_pending; _pending=null; closeSheet(); _start(p.day,p.source,p.title,p.tag); }
async function _start(day,source,title,tag){
  if(S.draft){
    const n=Object.values(S.draft.log).filter(l=>l.done).length;
    const keep=!await ask(`"${S.draft.title}" is still in progress${n?` — ${n} item${n>1?'s':''} logged`:''}. Discard it?`,
                          {ok:'Discard & start new',cancel:'Resume instead',danger:true});
    if(keep){ openSession(); return; }
  }
  S.draft={id:uid(),date:todayISO(),title,tag:tag||null,source,rows:buildRows(day),log:{},notes:''};
  persist(); openSession();
}
function openSession(){ if(!S.draft){ nav('home'); return; } closeSheet(); renderSessionBody(); $('session').classList.add('active'); $('ss-body').scrollTo?.(0,0); }

function rowHTML(r){
  const lg=S.draft.log[r.id]||{};
  if(r.kind==='warmup'){ const done=!!lg.done;
    return `<div class="warmbox ${done?'done':''}" id="row-${r.id}" style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1"><b style="color:var(--text)">Warmup</b> — ${esc(r.text)}</div>
      <button class="chk ${done?'on':''}" onclick="toggleDone('${r.id}')">${done?'✓':''}</button></div>`; }
  if(r.kind==='abhead') return `<div class="grp">Ab burner ${r.ref} · ${esc(r.title)} <span class="opt">optional</span></div>`;
  if(r.kind==='lift'||r.kind==='ab'){
    const done=!!lg.done, wt=lg.weight!=null?fromKg(lg.weight):'';
    const isAb=r.kind==='ab';
    const prev=(!isAb)?prevWeight(r.id):null;
    let prevHTML='';
    if(!isAb){
      if(prev){
        const c=setsTop(lg); let cls='',sym='→';
        if(c!=null&&c>prev.w){cls='up';sym='↑';} if(c!=null&&c<prev.w){cls='dn';sym='↓';}
        const detail=prev.reps?`×${prev.reps}`:'';
        prevHTML=`<span class="prev"><span class="${cls}">${sym} ${fromKg(prev.w)}${uLbl()}${detail?' '+detail:''}</span></span>`;
      } else prevHTML='';
    }
    const timer=r.timed?`<button class="mini" onclick="openHold('${jsq(r.name)}',${r.timed})"><svg viewBox="0 0 24 24">${CLOCK_ICON}</svg>${r.timed}s</button>`:'';
    const note=S.exNotes[r.id];
    const setCount=parseSets(r.scheme);
    const setsOpen=!isAb;   // sets are the point, not a disclosure — always shown for a real lift
    const sug=!isAb?suggestNext(r.id,r.scheme):null;
    const setsPanel=!isAb?`<div class="sets-panel${setsOpen?' open':''}" id="sets-${r.id}">${setRowsHTML(r.id,setCount)}</div>`:'';
    const wtInput=!isAb?`<div class="wt"><input id="wt-${r.id}" type="number" step="0.5" inputmode="decimal" placeholder="${sug?fromKg(sug.kg):'—'}" value="${wt}" oninput="setW('${r.id}',this.value,false)" onchange="setW('${r.id}',this.value,true)" onblur="setW('${r.id}',this.value,true)"><span class="u">${uLbl()}</span></div>
       <button class="mini" onclick="openRest(S.autoRestSec,nextRowName('${r.id}'))"><svg viewBox="0 0 24 24">${CLOCK_ICON}</svg>rest</button>
       ${sug&&sug.changed?`<button class="mini sug" onclick="acceptSuggest('${r.id}',${sug.kg})" aria-label="${esc(sug.why)}">→ ${fromKg(sug.kg)}${uLbl()}</button>`:''}`:'';
    /* mockup order: name + scheme (carrying last session's load), then the
       table, then a thin foot holding the delta and the controls */
    const lastBit=(!isAb&&prev)?` &middot; last ${fromKg(prev.w)}${uLbl()}`:'';
    return `<div class="lift ${done?'done':''}" id="row-${r.id}">
      <div class="lift-top">
        <div class="lift-info"><div class="lift-name">${esc(r.name)}</div>
        <div class="lift-scheme">${esc(r.scheme)}${lastBit}</div>
        ${exDesc(r.name)?`<div class="ex-cue">${esc(exDesc(r.name))}</div>`:''}
        <div class="ex-note" id="note-txt-${r.id}" ${note?'':'style="display:none"'}>${esc(note||'')}</div></div>
        <button class="chk ${done?'on':''}" onclick="toggleDone('${r.id}')">${done?'✓':''}</button>
      </div>
      ${setsPanel}
      <div class="lift-ctl tbl-foot">${prevHTML}${wtInput}${timer}
        <button class="mini" onclick="toggleNote('${r.id}')" title="Exercise note">✎</button>
        <button class="mini" onclick="ssRemoveRow('${r.id}')" title="Remove">✕</button></div>
      <input class="note-inp" id="note-${r.id}" placeholder="Note (e.g. seat pin 5, wide grip) — saved for every session" value="${esc(note||'')}" oninput="setExNote('${r.id}',this.value)">
    </div>`;
  }
  if(r.kind==='block'||r.kind==='wod'){
    const done=!!lg.done;
    const hasSeq=TIMERS[r.id];
    const rd=r.rounds?lg.rounds||Array(r.rounds).fill(false):null;
    let ticks='';
    if(rd) ticks=`<div class="ticks">${rd.map((v,i)=>`<div class="tick ${v?'on':''}" onclick="toggleRound('${r.id}',${i},${r.rounds})">R${i+1} ${v?'✓':''}</div>`).join('')}</div>`;
    return `<div class="lift ${done?'done':''}" id="row-${r.id}">
      <div class="lift-top">
        <div class="lift-info"><div class="lift-name">${esc(r.name)}</div></div>
        <button class="chk ${done?'on':''}" onclick="toggleDone('${r.id}')">${done?'✓':''}</button>
      </div>
      <div class="desc">${bankBreakdownHTML(r)}</div>
      ${ticks}
      <div class="lift-ctl">
        ${hasSeq?`<button class="mini" onclick="openTimer(TIMERS['${r.id}']())"><svg viewBox="0 0 24 24">${CLOCK_ICON}</svg>Start timer</button>`:''}
        <button class="mini" onclick="openRest(90,nextRowName('${r.id}'))"><svg viewBox="0 0 24 24">${CLOCK_ICON}</svg>90s rest</button>
        <button class="mini" onclick="ssRemoveRow('${r.id}')" title="Remove" style="margin-left:auto">✕</button>

function refreshPrev(id,kg){
  const row=$('row-'+id); const prev=prevWeight(id); const pEl=row?.querySelector('.prev');
  if(pEl&&prev){ let cls='',sym='→'; if(kg!=null&&kg>prev.w){cls='up';sym='↑';} if(kg!=null&&kg<prev.w){cls='dn';sym='↓';}
    const detail=prev.reps?`×${prev.reps}`:'';
    pEl.innerHTML=`<span class="${cls}">${sym} ${fromKg(prev.w)}${uLbl()}${detail?' '+detail:''}</span>`; }
}
function checkPR(id,l,kg,name){
  if(kg==null) return;
  const best=allTimeBest(id);
  if(best!=null && kg>best && kg>(l.prMax||0)){
    l.prMax=kg;
    toast(`🎉 New PR — ${fromKg(kg)}${uLbl()}${name?' '+name:''}`,true);
    try{ vibrate([80,40,80]); }catch(e){}
  }
}
function rowName(id){ return (S.draft?.rows||[]).find(r=>r.id===id)?.name||''; }
function setCountFor(id){
  const r=(S.draft?.rows||[]).find(x=>x.id===id);
  return r?parseSets(r.scheme):3;
}
/* ── set rows, renderable on their own so the working-weight field can
      fill them without re-rendering (and losing focus on) the whole session ── */
function setRowsHTML(id,n){
  const l=S.draft.log[id]||{};
  const done=(l.sets||[]).filter(x=>x&&x.w!=null&&x.reps!=null).length;
  /* three columns: the set number, the load and the reps */
  const head=`<div class="th"><span>Set</span><span>${uLbl()}</span><span>Reps</span></div>`;
  const rows=Array.from({length:n},(_,i)=>{
    const st=(l.sets||[])[i]||{};
    const filled=st.w!=null&&st.reps!=null;
    const cls=filled?'done':(i===done?'now':'');
    return `<div class="tr ${cls}">
      <span>${i+1}</span>
      <span class="v"><input type="number" step="0.5" inputmode="decimal" placeholder="—"
        value="${st.w!=null?fromKg(st.w):''}"
        oninput="setSetW('${id}',${i},this.value,false)"
        onchange="setSetW('${id}',${i},this.value,true)"
        onblur="setSetW('${id}',${i},this.value,true)"></span>
      <span class="v"><input type="number" inputmode="numeric" placeholder="—"
        value="${st.reps??''}" oninput="setSetR('${id}',${i},this.value)"></span>
    </div>
`;
  }).join('');
  return `<div class="tbl">${head}${rows}</div>`;
}
function renderSetRows(id){ const p=$('sets-'+id); if(p) p.innerHTML=setRowsHTML(id,setCountFor(id)); }
/* commit=false on every keystroke (persists silently); commit=true only on
   change/blur, which is the sole trigger for the "last time" refresh, the
   PR check, and filling the set rows — typing 100 no longer fires a PR
   toast in passing at 1 and 10, and doesn't fight per-set typing either. */
function setW(id,v,commit){
  const kg=v!==''?toKg(v):null; const l=S.draft.log[id]=S.draft.log[id]||{};
  l.weight=kg;                                   // kept for backwards compatibility with old sessions
  l.sets=l.sets||[];
  const n=setCountFor(id);
  for(let i=0;i<n;i++){                          // fill blanks only — never overwrite an actual
    l.sets[i]=l.sets[i]||{};
    if(l.sets[i].w==null||l.sets[i].w==='') l.sets[i].w=kg;
  }
  persist(false);
  if(commit){
    const top=setsTop(l);
    refreshPrev(id,top); checkPR(id,l,top,rowName(id));
    renderSetRows(id);                            // safe here: commit fires on blur, focus is already leaving
  }
}
function setSetW(id,i,v,commit){
  const l=S.draft.log[id]=S.draft.log[id]||{}; if(!l.sets)l.sets=[];
  l.sets[i]=l.sets[i]||{}; l.sets[i].w=v!==''?toKg(v):null;
  const top=setsTop(l);
  l.weight=top;                                   // top set drives progress + PR
  persist(false);
  const main=$('wt-'+id); if(main) main.value=top!=null?fromKg(top):'';
  if(commit){ refreshPrev(id,top); checkPR(id,l,top,rowName(id)); }
}
function setSetR(id,i,v){
  const l=S.draft.log[id]=S.draft.log[id]||{}; if(!l.sets)l.sets=[];
  l.sets[i]=l.sets[i]||{}; l.sets[i].reps=v!==''?parseInt(v):null; persist(false);
}
/* ── suggested next load (3.3) — fills the placeholder, never writes silently;
      the user still has to tap Accept or type their own number. ── */
function loadStep(kg){ return kg>=60?2.5 : kg>=20?2 : 1; }
function suggestNext(exId,scheme){
  const e=exIndex()[exId];
  if(!e?.last) return null;
  const {w,reps,rpe}=e.last;
  const range=String(scheme||'').match(/(\d+)\s*[–-]\s*(\d+)/);
  const flat=String(scheme||'').match(/×\s*(\d+)/);
  const top=range?+range[2]:(flat?+flat[1]:null);
  const inc=loadStep(w);
  let next=w, why='repeat last session';
  if(rpe!=null){
    if(rpe<=7)        { next=w+inc*2; why=`last set was RPE ${rpe} — room to jump`; }
    else if(rpe<=8.5) { next=w+inc;   why=`RPE ${rpe} — add a step`; }
    else if(rpe>=9.5) { next=w;       why=`RPE ${rpe} — hold and clean it up`; }
    else              { next=w+inc;   why=`RPE ${rpe} — small step`; }
  } else if(top!=null&&reps!=null){
    if(reps>=top)        { next=w+inc; why=`you hit ${reps} at the top of the range`; }
    else if(reps<top-2)  { next=w;     why=`${reps} reps last time — repeat this load`; }
    else                 { next=w;     why=`${reps} of ${top} reps — earn the top of the range first`; }
  }
  return {kg:Math.round(next*2)/2, why, changed:Math.abs(next-w)>0.01};
}
function acceptSuggest(id,kg){
  const el=$('wt-'+id); const shown=fromKg(kg);
  if(el) el.value=shown;
  setW(id,shown,true);
  toast(`Set to ${shown}${uLbl()}`,true);
}
function toggleNote(id){ const n=$('note-'+id); if(!n)return; n.classList.toggle('open'); if(n.classList.contains('open')) n.focus(); }
function setExNote(id,v){

  const row=$('row-'+id); row.classList.toggle('done',l.done); row.querySelector('.chk').classList.toggle('on',l.done);

function toggleRound(id,i,total){ const l=S.draft.log[id]=S.draft.log[id]||{}; if(!l.rounds)l.rounds=Array(total).fill(false);

function ssAddExercise(){

async function discardDraft(){

/* ── lift progression ── */
function progressInner(){
  const map=new Map();
  [...S.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
    (s.rows||[]).forEach(r=>{
      if(r.kind!=='lift') return;
      const w=s.log?.[r.id]?.weight; if(w==null) return;
      if(!map.has(r.id)) map.set(r.id,{name:r.name,points:[]});
      map.get(r.id).points.push({date:s.date,w});
    });
  });
  let html=`<div class="lede" style="margin:14px 0">Top-set weight per session. Beat the last bar.</div>`;
  if(!map.size){ return html+`<div class="empty">No logged weights yet — enter weights during sessions and trends appear here.</div>`; }
  const cards=[...map.entries()].sort((a,b)=>b[1].points[b[1].points.length-1].date.localeCompare(a[1].points[a[1].points.length-1].date));
  cards.forEach(([id,ex])=>{
    const pts=ex.points.slice(-8);
    const ws=pts.map(p=>p.w), max=Math.max(...ws), min=Math.min(...ws), rng=Math.max(0.5,max-min);
    const best=allTimeBest(id);
    const last=ws[ws.length-1], prev=ws.length>1?ws[ws.length-2]:null;
    let trend='';
    if(prev!=null){ const d=last-prev;
      trend=d>0?`<span style="color:var(--good)">↑ +${fromKg(d)}${uLbl()}</span>`:d<0?`<span style="color:var(--bad)">↓ ${fromKg(d)}${uLbl()}</span>`:`<span style="color:var(--muted)">→ same</span>`; }
    const bars=pts.map((p,i)=>{ const h=14+((p.w-min)/rng)*44;
      return `<div class="mbar ${i===pts.length-1?'last':''}" style="height:${h}px" title="${fmtDate(p.date)}"><span>${fromKg(p.w)}</span></div>`; }).join('');
    html+=`<div class="card" style="margin-bottom:12px">
      <div class="spread"><div><div class="item-title" style="font-size:16px">${esc(ex.name)}</div>
        <div class="item-sub">Best ${fromKg(best)}${uLbl()} · ${ex.points.length} session${ex.points.length!==1?'s':''}</div></div>
        <span style="font-family:var(--mono);font-size:12px">${trend}</span></div>
      <div class="mbar-row">${bars}</div>
    </div>`;
  });
  return html;
}

/* ── progress photos (IndexedDB — kept off the cloud doc) ── */
let _idb=null;
function idb(){ return new Promise((res,rej)=>{ if(_idb)return res(_idb);
  const rq=indexedDB.open('mgt-photos',1);
  rq.onupgradeneeded=()=>{ if(!rq.result.objectStoreNames.contains('photos')) rq.result.createObjectStore('photos',{keyPath:'id'}); };
  rq.onsuccess=()=>{ _idb=rq.result; res(_idb); }; rq.onerror=()=>rej(rq.error); }); }
async function photoAll(){ try{ const db=await idb(); return await new Promise(res=>{ const t=db.transaction('photos').objectStore('photos').getAll(); t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([]); }); }catch(e){ return []; } }
async function photoPut(rec){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('photos','readwrite').objectStore('photos').put(rec); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }
async function photoDel(id){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction('photos','readwrite').objectStore('photos').delete(id); t.onsuccess=()=>res(); t.onerror=()=>res(); }); }catch(e){} }
function addPhoto(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    const img=new Image();
    img.onload=async()=>{ const max=1080, sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      try{ await photoPut({id:uid(),date:todayISO(),dataURL:c.toDataURL('image/jpeg',0.82)}); toast('Photo saved',true); renderPhotos(); }
      catch(err){ toast('Could not save photo'); }
      URL.revokeObjectURL(img.src); };
    img.onerror=()=>toast('Could not read image');
    img.src=URL.createObjectURL(f); };
  inp.click();
}

/* ═══════════════════════════════════════════════════════════════
   FULLSCREEN TIMER ENGINE
   cfg = { title, mode:'down'|'up'|'seq', sec, target, phases:[{label,sec,kind}], rest }
═══════════════════════════════════════════════════════════════ */
let TM=null, _tmInt=null, _ac=null;
const RC=2*Math.PI*45;
function beep(freq=880,dur=0.15,type='sine'){
  try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); const o=_ac.createOscillator(),g=_ac.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(_ac.destination);
    g.gain.setValueAtTime(0.001,_ac.currentTime); g.gain.exponentialRampToValueAtTime(0.4,_ac.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,_ac.currentTime+dur); o.start(); o.stop(_ac.currentTime+dur);
  }catch(e){}
}
function vibrate(p){ try{navigator.vibrate&&navigator.vibrate(p);}catch(e){} }
function openHold(name,sec){ openTimer({title:name,mode:'down',sec}); }

/* ── rest timer — fullscreen, same engine as any other countdown.
   cfg.rest marks it for the blue "rest" visual + preset duration chips. */
function openRest(sec,nextName){ openTimer({title:'Rest',mode:'down',sec,rest:true,next:nextName||''}); }
function tmSetRest(s){ if(!TM)return; TM.remaining=s; TM.total=s; drawTimer(); }
/* iOS blocks audio unless a user gesture unlocked the context first, and a
   timer's completion beep fires from a setInterval tick, not a click — unlock early. */
['touchstart','mousedown'].forEach(ev=>document.addEventListener(ev,()=>{
  try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); _ac.resume(); }catch(e){}
},{once:true,passive:true}));
/* which exercise is up after this one, shown on the dock */
function nextRowName(id){
  const rows=(S.draft?.rows||[]).filter(r=>['lift','ab','block','wod'].includes(r.kind));
  const i=rows.findIndex(r=>r.id===id);
  return (i>=0&&rows[i+1])?rows[i+1].name:'Last one — then save';
}
function openTimer(cfg){
  clearInterval(_tmInt);
  /* list-driven WODs track which movement you're on, and how many times
     you've been round; interval blocks don't need either */
  const listy=['amrap','chipper','ladder'].includes(cfg.layout);
  if(cfg.mode==='seq'){ TM={cfg,mode:'seq',idx:0,remaining:cfg.phases[0].sec,total:cfg.phases[0].sec,running:true}; }
  else if(cfg.mode==='up'){ TM={cfg,mode:'up',elapsed:0,target:cfg.target||0,running:true}; }
  else { TM={cfg,mode:'down',remaining:cfg.sec,total:cfg.sec,running:true}; }
  if(listy){ TM.item=0; TM.round=0; }
  $('timer').classList.add('active');
  drawTimer(); tickStart(); reqWake();
  try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function closeTimer(){ clearInterval(_tmInt); TM=null; $('timer').classList.remove('active'); relWake(); }

/* keep the screen awake while a timer is running */
let _wake=null;
async function reqWake(){ try{ if('wakeLock' in navigator) _wake=await navigator.wakeLock.request('screen'); }catch(e){} }
function relWake(){ try{ _wake&&_wake.release(); }catch(e){} _wake=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && TM && !_wake) reqWake(); });
function tickStart(){ clearInterval(_tmInt); _tmInt=setInterval(tick,1000); }
function tick(){
  if(!TM||!TM.running) return;
  if(TM.mode==='up'){ TM.elapsed++; if(TM.target&&TM.elapsed===TM.target){ beep(660,0.4); vibrate([200,80,200]); } drawTimer(); return; }
  TM.remaining--;
  if(TM.remaining<=3&&TM.remaining>0) beep(700,0.08);
  if(TM.remaining<=0){
    if(TM.mode==='seq'&&TM.idx<TM.cfg.phases.length-1){
      TM.idx++; const ph=TM.cfg.phases[TM.idx]; TM.remaining=ph.sec; TM.total=ph.sec;
      beep(ph.kind==='rest'?520:900,0.25); vibrate(120); drawTimer(); return;
    }
    TM.running=false; TM.done=true; clearInterval(_tmInt);
    beep(1040,0.5); setTimeout(()=>beep(1240,0.5),160); vibrate([300,100,300]);
    drawTimer(); return;
  }
  drawTimer();
}
function fmtClock(s){ const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; }
/* The big clock drops the leading 0: under a minute — two characters instead
   of four, which is the whole point of sizing the clock to its string. */
function fmtBig(s){ return s<60 ? String(s) : fmtClock(s); }
/* a block/WOD sequence that carries a movement list gets the timeline
   presentation instead of the ring — the list stays exactly as it reads in the
   preview, and a clock above it names what you're on */
const isWod=()=>TM&&(TM.cfg.layout||(TM.mode==='seq'&&Array.isArray(TM.cfg.moves)));
function drawTimer(){
  const t=$('timer'); const cfg=TM.cfg;
  if(isWod()&&!TM.done){ drawWodTimer(); return; }
  $('btm').innerHTML='';
  t.classList.remove('wod');
  let big,label,sub,next='',frac,kind;
  if(TM.mode==='up'){
    big=fmtClock(TM.elapsed); label=cfg.title; kind='work';
    sub=TM.target?`target ${fmtClock(TM.target)}`:'stopwatch'; frac=TM.target?Math.min(1,TM.elapsed/TM.target):0;
  } else if(TM.done){
    big='GO'; label='Done'; sub=''; frac=1; kind='go';
  } else if(TM.mode==='seq'){
    const ph=cfg.phases[TM.idx]; big=fmtClock(TM.remaining); label=ph.label; kind=ph.kind==='rest'?'rest':'work';
    sub=`${TM.idx+1} / ${cfg.phases.length}`;
    if(TM.idx<cfg.phases.length-1) next='Next: '+cfg.phases[TM.idx+1].label;
    frac=1-(TM.remaining/TM.total);
  } else {
    /* 'down' mode: rest (cfg.rest — blue visual + duration presets) or a
       timed hold from openHold (amber 'work' visual, no presets). */
    big=fmtClock(TM.remaining); label=cfg.title; kind=cfg.rest?'rest':'work'; sub='of '+fmtClock(TM.total); frac=1-(TM.remaining/TM.total);
    if(cfg.next) next='Next: '+cfg.next;
  }
  t.className='timer active '+kind;
  $('tm-label').textContent=label;
  $('tm-big').textContent=big;
  $('tm-sub').textContent=sub;
  $('tm-next').textContent=next;
  $('tm-fg').style.strokeDasharray=RC; $('tm-fg').style.strokeDashoffset=RC*(1-frac);
  $('tm-presets').innerHTML=(cfg.rest&&!TM.done)?[60,90,120,180].map(s=>
    `<button class="tm-preset ${TM.total===s?'on':''}" onclick="tmSetRest(${s})">${s<60?s+'s':(s/60)+'m'}</button>`).join(''):'';
  // controls
  const c=$('tm-ctl');
  if(TM.done){ c.innerHTML=`<button class="btn btn-acc" style="min-width:200px" onclick="closeTimer()">Done</button>`; return; }
  c.innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;gap:18px;width:100%">
      <div class="tm-round">
        <button class="tm-circ" onclick="tmAdd(-15)" ${TM.mode==='up'?'style="visibility:hidden"':''}>−15</button>
        <button class="tm-big-btn" onclick="tmToggle()">${TM.running?'❚❚':'▶'}</button>
        <button class="tm-circ" onclick="tmAdd(15)" ${TM.mode==='up'?'style="visibility:hidden"':''}>+15</button>
      </div>
      <button class="btn ${TM.mode==='seq'?'btn-acc':''}" style="min-width:200px" onclick="${TM.mode==='seq'?'tmSkip()':'closeTimer()'}">${TM.mode==='seq'?'Skip':'Close'}</button>
    </div>`;
}
/* ── the workout timer ──────────────────────────────────────────────────
   One landscape layout: what you're doing on the left, the clock on the
   right. Five variants of the left pane, because what a WOD needs to tell
   you changes with its format — an interval block needs "next", an AMRAP
   needs the round it loops, an EMOM needs this minute's task, a chipper
   needs a checklist, and a rep ladder needs this round's number.
   The clock is sized to whatever string it has to show (see fitClock). */
function wodList(items,cur,dim){
  return `<div class="wt-list${dim?' dim':''}">`+items.map((it,i)=>{
    const cls = cur==null ? '' : i===cur ? ' now' : i<cur ? ' done' : '';
    return `<div class="wt-i${cls}" onclick="tmGoto(${i})">
      <span class="wt-n">${esc(it.n)}</span>
      ${it.r?`<span class="wt-reps">${esc(it.r)}</span>`:''}</div>`;
  }).join('')+`</div>`;
}
function drawWodTimer(){
  const cfg=TM.cfg, t=$('timer');
  const lay=cfg.layout||'intervals';
  let left='', big='', sub='', frac=0, kind='work';

  if(lay==='intervals'){
    const ph=cfg.phases[TM.idx];
    frac=1-(TM.remaining/TM.total); big=fmtBig(TM.remaining);
    kind=ph.kind==='rest'?'rest':'work';
    let now,nxt,then;
    if(ph.kind==='work'){ now=cfg.moves[ph.mi].n; }
    else if(ph.off){ now='Off'; }
    else { now='Rest'; }
    const nx=cfg.phases.slice(TM.idx+1).filter(x=>x.kind==='work')[0];
    const nx2=cfg.phases.slice(TM.idx+1).filter(x=>x.kind==='work')[1];
    nxt=nx?cfg.moves[nx.mi].n:'Block done';
    then=nx2?`then ${cfg.moves[nx2.mi].n}`:'';
    left=`<div class="wt-lbl">Now &middot; round ${ph.round} of ${cfg.rounds}</div>
      <div class="wt-now">${esc(now)}</div>
      <div class="wt-next"><span>Next</span>${esc(nxt)}</div>
      <div class="wt-then">${esc(then)}</div>`;
    sub=`${TM.total-TM.remaining}s done of ${TM.total}s`;

  } else if(lay==='emom'){
    const ph=cfg.phases[TM.idx];
    frac=1-(TM.remaining/TM.total); big=fmtBig(TM.remaining);
    const m=cfg.moves[ph.mi], up=[1,2].map(k=>cfg.phases[TM.idx+k]).filter(Boolean)
      .map(x=>({n:cfg.moves[x.mi].n,r:cfg.moves[x.mi].r}));
    left=`<div class="wt-lbl">${esc(cfg.title)} &middot; minute ${TM.idx+1} of ${cfg.phases.length}</div>
      <div class="wt-hero"><span class="wt-hn">${esc(m.n)}</span>${m.r?`<span class="wt-hr">${esc(m.r)}</span>`:''}</div>
      ${up.length?`<div class="wt-up">${wodList(up,null,true)}</div>`:''}`;
    sub='left this minute';

  } else if(lay==='amrap'){
    frac=1-(TM.remaining/TM.total); big=fmtBig(TM.remaining);
    left=`<div class="wt-lbl">${esc(cfg.title)} &middot; round ${TM.round+1}</div>
      ${wodList(cfg.items,TM.item)}`;
    sub=`left &middot; ${TM.round} round${TM.round===1?'':'s'} banked`;

  } else if(lay==='chipper'){
    frac=cfg.target?Math.min(1,TM.elapsed/cfg.target):0; big=fmtClock(TM.elapsed);
    left=`<div class="wt-lbl">${esc(cfg.title)}</div>${wodList(cfg.items,TM.item)}`;
    sub=`elapsed${cfg.targetLabel?' &middot; target '+cfg.targetLabel:''}`;

  } else if(lay==='ladder'){
    frac=cfg.target?Math.min(1,TM.elapsed/cfg.target):0; big=fmtClock(TM.elapsed);
    const reps=cfg.ladder[TM.round]??cfg.ladder[cfg.ladder.length-1];
    const items=cfg.items.map(it=>({n:it.n,r:String(reps)}));
    left=`<div class="wt-lbl">${esc(cfg.title)} &middot; round ${TM.round+1} of ${cfg.ladder.length}</div>
      ${wodList(items,TM.item)}
      <div class="wt-ladder">${cfg.ladder.map((r,i)=>
        `<b class="${i<TM.round?'done':i===TM.round?'now':''}">${r}</b>`).join(' &middot; ')}</div>`;
    sub=`elapsed${cfg.targetLabel?' &middot; target '+cfg.targetLabel:''}`;
  }

  t.className='timer active wod '+kind;
  const adv = (lay==='amrap'||lay==='chipper'||lay==='ladder')
    ? `<div class="wt-c" onclick="tmAdvance()"><svg viewBox="0 0 24 24">${G.check}</svg><span>Done</span></div>` : '';
  const skip = (lay==='intervals'||lay==='emom')
    ? `<div class="wt-c" onclick="tmSkip()"><svg viewBox="0 0 24 24">${G.skip}</svg><span>Skip</span></div>` : '';
  $('btm').innerHTML=`
    <div class="wt">
      <div class="wt-hdr">
        <div class="wt-back" onclick="closeTimer()"><svg viewBox="0 0 24 24">${G.back}</svg></div>
        <div class="wt-hb"><div class="wt-t">${esc(cfg.title)}</div>
          <div class="wt-s">${esc(cfg.sub||cfg.scheme||'')}</div></div>
      </div>
      <div class="wt-body">
        <div class="wt-l">${left}</div>
        <div class="wt-r">
          <div class="wt-clock" id="wt-clock">${big}</div>
          <div class="wt-sub">${sub}</div>
          <div class="wt-bar"><i style="width:${Math.round(frac*100)}%"></i></div>
        </div>
      </div>
      <div class="wt-ctl">
        <div class="wt-c" onclick="tmToggle()"><svg viewBox="0 0 24 24">${TM.running?G.pause:G.play}</svg>
          <span>${TM.running?'Pause':'Resume'}</span></div>
        ${adv}${skip}
      </div>
    </div>`;

}
/* The clock is the only thing on screen whose width depends on its value, so
   it is sized from the string rather than fixed: "24" gets the full cap,
   "12:34" steps down enough to still fit the column. */
function fitClock(){
  const el=$('wt-clock'); if(!el) return;
  const w=el.parentElement.clientWidth;
  const n=(el.textContent||'').trim().length||2;
  el.style.fontSize=Math.min(176,Math.floor(w*0.94/(n*0.601)))+'px';
}
/* tapping a movement jumps to it; the Done control steps forward and, in an
   AMRAP, banks a round when it wraps */
function tmGoto(i){ if(TM&&TM.item!=null){ TM.item=i; drawTimer(); } }
function tmAdvance(){
  if(!TM) return;
  const cfg=TM.cfg, n=cfg.items.length;
  TM.item=(TM.item||0)+1;
  if(TM.item>=n){
    TM.item=0;
    if(cfg.layout==='amrap') TM.round++;
    else if(cfg.layout==='ladder'){
      TM.round++;
      if(TM.round>=cfg.ladder.length){ TM.running=false; TM.done=true; clearInterval(_tmInt);
        beep(1040,0.5); vibrate([300,100,300]); }
    } else if(cfg.layout==='chipper'){
      TM.running=false; TM.done=true; clearInterval(_tmInt);
      beep(1040,0.5); vibrate([300,100,300]);
    }
  }
  beep(760,0.09); vibrate(40);
  drawTimer();
}
function tmToggle(){ TM.running=!TM.running; drawTimer(); }
function tmAdd(s){ if(TM.mode==='up')return; TM.remaining=Math.max(1,TM.remaining+s); TM.total=Math.max(TM.total,TM.remaining); drawTimer(); }
function tmSkip(){ if(TM.mode!=='seq')return; TM.remaining=1; }

/* ── timer configs for blocks / wods ── */
/* Blocks are described as {moves, rounds, off, roundRest} rather than a flat
   phase list, because the running timer draws the movement timeline and needs
   to know which movement each phase belongs to. seqBlock() flattens them. */
function seqBlock({title,sub='',moves,rounds=1,off=0,roundRest=0,scheme='',layout='intervals'}){
  const ph=[];
  for(let r=1;r<=rounds;r++){
    moves.forEach((m,i)=>{
      ph.push({label:m.n,sec:m.s,kind:'work',mi:i,round:r});
      const last = r===rounds && i===moves.length-1;
      if(off && !last) ph.push({label:'Off',sec:off,kind:'rest',mi:i,round:r,off:true});
    });
    if(roundRest && r<rounds)
      ph.push({label:`Rest — round ${r+1} next`,sec:roundRest,kind:'rest',mi:-1,round:r});
  }
  return {title,sub,mode:'seq',phases:ph,moves,rounds,scheme,roundRest,layout};
}
const TIMERS={
  block1:()=>seqBlock({title:'Block 1',sub:'Classic intervals',scheme:'40s on / 20s off',
    moves:['KB swings','Burpees','DB thrusters','Jump squats','Mountain climbers'].map(n=>({n,s:40})),
    rounds:4, off:20, roundRest:120}),
  block2:()=>seqBlock({title:'Block 2',sub:'Five-minute blocks',scheme:'5 min work / 90s rest',
    moves:['Snatch + burpees','Swings + jump squats','Thrusters + climbers','Lunges + push-ups'].map(n=>({n,s:300})),
    rounds:1, off:90}),
  block3:()=>seqBlock({title:'Block 3',sub:'Hard / easy intervals',scheme:'30s hard / 60s easy',
    moves:[{n:'Hard',s:30},{n:'Easy',s:60}], rounds:10}),
  /* AMRAP: the clock runs the piece down, you loop the triplet, and the score
     is how many times round you got */
  wod1:()=>({title:'AMRAP 15',sub:'As many rounds as possible',mode:'down',sec:900,layout:'amrap',
    items:[{n:'KB swings',r:'12'},{n:'Goblet squat',r:'9'},{n:'Burpees',r:'6'}]}),
  /* rep ladder: same two movements, a different number each round */
  wod2:()=>({title:'21-15-9',sub:'For time',mode:'up',target:720,targetLabel:'sub 12:00',layout:'ladder',
    items:[{n:'DB thrusters'},{n:'Pull-ups'}], ladder:[21,15,9]}),
  /* EMOM: one task per minute, clock counts the minute not the piece */
  wod3:()=>seqBlock({title:'EMOM 20',sub:'Every minute on the minute',scheme:'1 min each',layout:'emom',

           {n:'Goblet squat',r:'×12',s:60},{n:'KB swings',r:'×10',s:60}],

  /* chipper: work down the list once, clock counts up */
  wod4:()=>({title:'Chipper',sub:'For time',mode:'up',target:900,targetLabel:'12–16 min',layout:'chipper',

/* ═══════════════════════════════════════════════════════════════
   FIREBASE  (Google sign-in + Firestore auto-sync)
═══════════════════════════════════════════════════════════════ */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function initFirebase(){
  if(!FB_READY) return;
  try{
    const base='https://www.gstatic.com/firebasejs/10.12.0/';
    await loadScript(base+'firebase-app-compat.js');
    await loadScript(base+'firebase-auth-compat.js');
    await loadScript(base+'firebase-firestore-compat.js');
    firebase.initializeApp(FIREBASE_CONFIG);
    auth=firebase.auth(); db=firebase.firestore();
    try{ db.settings({ignoreUndefinedProperties:true}); }catch(e){}  // session rows carry optional undefined fields
    await auth.getRedirectResult().catch(()=>{});
    auth.onAuthStateChanged(onAuth);
  }catch(e){ console.warn('Firebase init failed',e); }
}
function signInUser(){
  if(!FB_READY||!auth){ toast('Add Firebase config first'); return; }
  const p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(err=>{ if(String(err.code).includes('popup')) auth.signInWithRedirect(p); else toast('Sign-in failed'); });
}
async function signOutUser(){ if(auth&&await ask('Sign out? Data stays on this device.',{ok:'Sign out'})){ if(_unsub)_unsub(); auth.signOut(); } }
async function onAuth(u){
  if(!u){ USER=null; SYNC='idle'; if(_unsub){_unsub();_unsub=null;} renderAcct(); return; }
  USER={uid:u.uid,email:u.email,name:u.displayName,photo:u.photoURL}; SYNC='sync'; renderAcct();
  const ref=db.collection('users').doc(u.uid);
  try{
    const snap=await ref.get();
    if(snap.exists) mergeCloud(snap.data());
    await pushCloud();               // write merged result
    SYNC='ok'; renderAcct(); render(S.view);
    _unsub=ref.onSnapshot(s=>{ const d=s.data(); if(d&&d.updatedAt>S.updatedAt){ mergeCloud(d); persist(false); render(S.view); renderAcct(); } });
  }catch(e){ SYNC='err'; renderAcct(); }
}
function unionById(a,b){ const m=new Map(); (a||[]).forEach(x=>m.set(x.id,x)); (b||[]).forEach(x=>m.set(x.id,x)); return [...m.values()]; }
function mergeCloud(d){
  S.sessions=unionById(S.sessions,d.sessions);
  S.bodyLog=unionById(S.bodyLog,d.bodyLog);
  S.runs=unionById(S.runs,d.runs);
  S.customWorkouts=unionById(S.customWorkouts,d.customWorkouts);
  S.exNotes=Object.assign({}, d.exNotes||{}, S.exNotes||{});  // local edits win
  S.restDays=[...new Set([...(S.restDays||[]),...(d.restDays||[])])];  // a rest day marked on either device counts
  if((d.updatedAt||0)>=S.updatedAt){ if(d.active!==undefined)S.active=d.active; if(d.draft!==undefined)S.draft=d.draft; }
  S.updatedAt=Math.max(S.updatedAt,d.updatedAt||0);
  invalidateIndex();
}
function scheduleCloud(){ clearTimeout(_cloudT); _cloudT=setTimeout(pushCloud,1500); }
function retrySync(){ SYNC='sync'; renderAcct(); scheduleCloud(); }
async function pushCloud(){
  if(!USER||!db) return;
  SYNC='sync'; renderAcct();
  try{
    await db.collection('users').doc(USER.uid).set({
      active:S.active??null, draft:S.draft??null, sessions:S.sessions, bodyLog:S.bodyLog,
      runs:S.runs, customWorkouts:S.customWorkouts, exNotes:S.exNotes||{}, restDays:S.restDays||[], updatedAt:S.updatedAt }, {merge:true});
    SYNC='ok';
  }catch(e){ SYNC='err'; }
  renderAcct();
}

═══════════════════════════════════════════════════════════════ */
/* ── weekly Monday check-in (best-effort while app is open) ── */
function checkWeeklyReminder(){
  if(!S.remindWeekly) return;
  const wk=weekKey();
  if(S.lastRemindWeek===wk || bodyLoggedThisWeek()) return;  // once per week, and not if already logged
  S.lastRemindWeek=wk; persist(false);
  if('Notification' in window && Notification.permission==='granted'){
    const body='Take a progress photo, weigh in, and log it in the Body tab.';
    try{
      if(navigator.serviceWorker?.ready) navigator.serviceWorker.ready
        .then(reg=>reg.showNotification('Sisu — Monday check-in',{body,icon:'assets/icon-wine-512.png',tag:'mgt-weekly'}))
        .catch(()=>new Notification('Sisu — Monday check-in',{body}));
      else new Notification('Sisu — Monday check-in',{body});
    }catch(e){}
  }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkWeeklyReminder(); });

(function init(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  hydrate(); buildNav(); nav('home');  // a saved draft surfaces as a Resume banner on Home
  checkWeeklyReminder();
  initFirebase();
})();
