<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sisu</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0714">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sisu">
<link rel="apple-touch-icon" href="assets/icon-wine-maskable-512.png">

<style>
/* ── self-hosted fonts (Appendix B) — the app is offline-first everywhere
   except its typography if these come off a CDN; a cold first launch with
   no signal would silently fall back to Georgia. Latin-only subset (this
   app is English-only), ~126KB total, precached by the service worker. */
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:400 600;font-display:swap;
  src:url('assets/fonts/cormorant-garamond-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:400;font-display:swap;
  src:url('assets/fonts/eb-garamond-400-italic.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:400;font-display:swap;
  src:url('assets/fonts/eb-garamond-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:500;font-display:swap;
  src:url('assets/fonts/eb-garamond-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:600;font-display:swap;
  src:url('assets/fonts/eb-garamond-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;
  src:url('assets/fonts/ibm-plex-mono-400-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;
  src:url('assets/fonts/ibm-plex-mono-500-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;
  src:url('assets/fonts/ibm-plex-mono-600-normal.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* ── the ground. Everything floats on it: there are no cards in this
     theme, only hairline rules, so --card/--card2 are transparent and the old
     card rules resolve to nothing rather than needing to be hunted down. ── */
  /* the ground is a token: point it at another baked image to reskin */
  --ground:url('assets/violet-bg.jpg');
  --bg:#0b0714; --bg2:#171029; --card:transparent; --card2:rgba(255,255,255,.05);
  --border:rgba(217,184,119,.16);   /* the hairline that replaced every card edge */
  /* ── brand ── */
  --acc:#d3564f;                    /* alert / hard sessions / eyebrows */
  --acc-h:#e0685f;
  --ink:#1a1410;                    /* text on a solid accent */
  --gold:#d9b877;                   /* structure: labels, dates, icon strokes */
  --gold-d:#e3c68f;                 /* gold that must carry text on the dark ground */
  /* ── text ── */
  --text:#f3ead4;                   /* 13.6:1 on the ground */
  --muted:rgba(243,234,212,.62);
  --faint:rgba(243,234,212,.38);    /* decorative and placeholders only */
  /* ── semantic ── */
  --bad:#d3564f;
  --good:#6fd8c9;                   /* live / done / interactive */
  --warn:#e0a33c;
  /* ── category ── */
  --cat-weights:#d9b877; --cat-hiit:#e0a33c; --cat-crossfit:#6fd8c9;
  /* ── type ── */
  --display:'Cormorant Garamond','EB Garamond',Georgia,serif;
  --body:'EB Garamond',Georgia,'Times New Roman',serif;
  --num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  /* ── aliases kept so the rest of the sheet needs no edits ── */
  --sans:var(--body); --mono:var(--num);
  --blue:var(--good); --teal:var(--good);
  --weights:var(--cat-weights); --hiit:var(--cat-hiit); --crossfit:var(--cat-crossfit);
}
/* iOS standalone: html/body are locked to the viewport height, so the
   home-indicator inset sits outside the document box. Relying on body's
   background propagating to the canvas isn't dependable there — it left a
   white strip under the app — so paint <html> explicitly instead. */
html{background:var(--bg)}
html,body{height:100%}
body{background:transparent;color:var(--text);font-family:var(--sans);line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-size:16.5px}
/* the ground is pre-blurred at export — blurring a full-bleed image at runtime
   costs a compositor layer on every scroll for no visual gain */
body::before{content:'';position:fixed;inset:0;z-index:-2;background:var(--ground) center/cover no-repeat}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,4,16,.82) 0%,rgba(8,4,16,.5) 13%,rgba(8,4,16,.2) 32%,rgba(8,4,16,.38) 62%,rgba(8,4,16,.8) 100%)}
/* ── Roman display type for headings & labels ── */
.h1,.item-title,.stat-val,.hero-h1,.tm-big,.ov-title .t,.seg button,.btn-acc,.btn-lg{font-family:var(--display);letter-spacing:.01em}
.eyebrow,.sec-label,.stat-lbl,.item-eyebrow,.grp,.tab span,.tag,.badge,.tm-label,.lbl,.log-date{font-family:var(--display)!important;letter-spacing:.14em}
.app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)}

/* ── views ── */
.view{flex:1;padding:24px 22px calc(96px + env(safe-area-inset-bottom));display:none}
.view.active{display:block}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.h1{font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1.05;margin-bottom:6px}
.lede{color:var(--muted);font-size:14px;margin-bottom:22px;max-width:44ch}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.card+.card{margin-top:12px}
.soft{color:var(--muted);font-size:14px;line-height:1.55}

/* ── buttons ── */
.btn{font-family:var(--sans);font-size:15px;font-weight:600;padding:13px 18px;border-radius:12px;
  border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;
  transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn-acc{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.btn-acc:hover{background:var(--acc-h)}
.btn-block{width:100%}
.btn-sm{font-size:13px;padding:8px 12px;border-radius:10px}
.btn-ghost{background:transparent}
.btn-danger{color:var(--bad);border-color:rgba(143,26,26,.35);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row-t{display:flex;gap:10px;align-items:center}

/* ── inputs ── */
.inp{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-family:var(--sans);font-size:16px;padding:13px 15px;outline:none;transition:.15s}
.inp:focus{border-color:var(--blue)}
.inp::placeholder{color:var(--faint)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ── tags ── */
.tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 9px;border-radius:6px}
.tag-weights{background:rgba(143,26,26,.14);color:var(--cat-weights)}
.tag-hiit{background:rgba(156,107,31,.16);color:var(--cat-hiit)}
.tag-crossfit{background:rgba(74,107,107,.18);color:var(--cat-crossfit)}
.tag-hard{background:rgba(143,26,26,.16);color:var(--bad)}
.tag-mod{background:rgba(143,26,26,.12);color:var(--acc)}
.tag-run{background:rgba(184,145,47,.16);color:var(--blue)}

/* ── stat grid ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.stat-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:7px;margin-bottom:12px}
.stat-lbl svg{width:15px;height:15px;stroke:var(--muted)}
.stat-val{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat-val small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}

/* ── list item card ── */
.item{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;
  cursor:pointer;transition:.15s;margin-bottom:12px}
.item:active{transform:scale(.99)}
.item.hl{border-color:rgba(184,145,47,.55)}
.item-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.item-title{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.item-sub{color:var(--muted);font-size:13px;line-height:1.5}
.sec-label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
.sec-label:first-child{margin-top:0}

/* ── banner ── */
.banner{border:1px solid rgba(143,26,26,.4);background:rgba(143,26,26,.06);border-radius:14px;
  padding:16px 18px;color:var(--acc);font-size:14px;font-weight:500;margin-bottom:16px}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:14px}

/* ── account chip ── */
.acct{display:none;align-items:center;justify-content:flex-end;gap:8px;padding:16px 22px 0;min-height:46px}
.acct .dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.acct .dot.ok{background:var(--good)} .acct .dot.err{background:var(--bad)}
.acct .dot.sync{background:var(--acc);animation:blink .9s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ── bottom nav ── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(238,228,204,.92);backdrop-filter:blur(12px) saturate(1.1);border-top:1px solid var(--border);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav-inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:12px;
  border:1.5px solid transparent;background:none;color:var(--muted);cursor:pointer;transition:.15s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tab span{font-size:10px;font-weight:600;letter-spacing:.01em}
.tab.active{color:var(--acc);border-color:transparent}

/* ── session overlay ── */
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
.overlay.active{display:flex}
.ov-head{position:sticky;top:0;background:rgba(238,228,204,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  display:flex;align-items:center;gap:12px;z-index:2}
.ov-back{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card2);
  color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ov-back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.ov-title{flex:1;min-width:0}
.ov-title .t{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-title .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ov-body{flex:1;overflow-y:auto;padding:18px 18px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

/* ── session rows ── */
.warmbox{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:12px;padding:13px 16px;font-size:13px;color:var(--muted);margin-bottom:14px}
.warmbox.done{opacity:.55}
.grp{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.lift{position:relative;background:
    repeating-linear-gradient(115deg,rgba(184,145,47,.055) 0 2px,transparent 2px 26px),
    var(--card);
  border:1px solid var(--border);border-radius:8px;padding:15px 17px;margin-bottom:12px;transition:.15s}
.lift::before,.lift::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--gold);opacity:.75;pointer-events:none}
.lift::before{left:-1px;top:-1px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.lift::after{right:-1px;bottom:-1px;border-left:none;border-top:none;border-radius:0 0 8px 0}
.lift.done{border-color:rgba(111,122,63,.55)}
.lift.done::before,.lift.done::after{border-color:var(--good)}
.lift-top{display:flex;align-items:flex-start;gap:12px}
.lift-info{flex:1;min-width:0}
.lift-name{font-size:15px;font-weight:600}
.lift-scheme{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d);background:rgba(184,145,47,.14);
  border:1px solid rgba(184,145,47,.4);padding:2px 8px;border-radius:3px}
.chk{width:48px;height:48px;flex-shrink:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  border:2px solid var(--gold);background:var(--card2);
  color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:.15s}
.chk.on{background:var(--good);border-color:var(--good);color:var(--ink);
  filter:drop-shadow(0 0 6px rgba(85,96,44,.55))}
.lift-ctl{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:11px;border-top:1px dashed var(--border);flex-wrap:wrap}
.wt{position:relative}
.wt input{width:100px;background:none;border:none;border-bottom:2px solid var(--gold);border-radius:0;color:var(--acc);
  font-family:var(--mono);font-weight:700;font-size:19px;padding:2px 26px 5px 2px;text-align:right;outline:none}
.wt input:focus{border-color:var(--acc)}
.wt .u{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.prev{font-family:var(--mono);font-size:11px;color:var(--muted)}
.prev .up{color:var(--good)} .prev .dn{color:var(--bad)}
.mini{font-family:var(--mono);font-size:12px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);color:var(--muted);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.mini:hover{border-color:var(--muted);color:var(--text)}
.mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.mini.on{border-color:var(--acc);color:var(--acc)}
/* HUD-styled controls, scoped to the session screen only.
   Brackets are drawn (border-left/right), not typed via ::before/::after
   content, so a screen reader doesn't announce "left bracket … right bracket". */
#session .mini{font-size:11.5px;letter-spacing:.02em;padding:8px 12px;border-radius:3px;
  border-top:1px solid rgba(184,145,47,.4);border-bottom:1px solid rgba(184,145,47,.4);
  border-left:2px solid rgba(166,127,34,.6);border-right:2px solid rgba(166,127,34,.6);
  background:rgba(184,145,47,.08);color:var(--gold-d)}
#session .mini:hover{border-color:var(--gold);color:var(--text);background:rgba(184,145,47,.16)}
#session .mini.on{border-color:var(--acc);color:var(--acc);background:rgba(143,26,26,.08)}
.desc{color:var(--muted);font-size:13px;line-height:1.6;margin-top:8px}
/* per-set logging */
.sets-panel{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;flex-direction:column;gap:8px}
.sets-panel.open{display:flex}
.set-line{display:flex;align-items:center;gap:8px}
.set-lbl{font-family:var(--mono);font-size:11px;color:var(--muted);width:22px;flex-shrink:0}
.set-line .x{font-family:var(--mono);font-size:11px;color:var(--faint)}
.reps-inp{width:64px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);
  font-family:var(--mono);font-size:14px;padding:8px 10px;text-align:center;outline:none}
.reps-inp:focus{border-color:var(--acc)}
.set-line{gap:7px}
.set-line .wt input{width:78px;font-size:17px}
#session .mini.sug{border-color:var(--good);color:var(--good);background:rgba(85,96,44,.09)}

.runpip{display:block;width:fit-content;margin:14px auto 0;
  font-family:var(--display);letter-spacing:.1em;font-size:9.5px;padding:6px 13px;border-radius:11px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  cursor:pointer;white-space:nowrap}
.runpip.on{border-color:var(--good);color:var(--good);background:rgba(85,96,44,.09)}
.ex-note{font-size:12px;color:var(--teal);margin-top:3px;font-style:italic}
.ex-cue{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px;max-width:340px}
/* pre-start preview: lifts + WOD/block breakdown, each item legible on its own line */
.prev-sec{margin-bottom:14px}
.prev-sec:last-child{margin-bottom:0}
.prev-h{font-weight:700;color:var(--text);margin-bottom:6px}
.prev-lift{margin-bottom:10px}
.prev-lift:last-child{margin-bottom:0}
.prev-lift-top{display:flex;justify-content:space-between;gap:10px;color:var(--text);font-weight:600}
.prev-lift-top .s{font-family:var(--mono);font-weight:400;color:var(--faint);white-space:nowrap}
.prev-line{color:var(--muted)}
.wod-format{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-d);margin-bottom:8px}
.wod-items{display:flex;flex-direction:column;gap:6px}
.wod-item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  border-bottom:1px dashed var(--border);padding-bottom:6px;color:var(--text)}
.wod-item:last-child{border-bottom:none;padding-bottom:0}
.wod-item .s{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.wod-rest{font-size:12px;color:var(--muted);margin-top:8px;font-style:italic}
.note-inp{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);
  font-size:13px;padding:8px 12px;outline:none;margin-top:8px;display:none}
.note-inp.open{display:block}
.note-inp:focus{border-color:var(--teal)}
/* mini progress chart */
.mbar-row{display:flex;align-items:flex-end;gap:5px;height:64px;margin-top:14px}
.mbar{flex:1;background:var(--card2);border:1px solid var(--border);border-bottom:none;border-radius:5px 5px 0 0;
  position:relative;min-height:5px}
.mbar.last{background:rgba(184,145,47,.24);border-color:var(--acc)}
.mbar span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--muted);white-space:nowrap}
.ticks{display:flex;gap:6px;margin-top:12px}
.tick{flex:1;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--muted);
  font-family:var(--mono);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px}
.tick.on{background:rgba(111,122,63,.2);border-color:var(--good);color:var(--good)}
.opt{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--faint);border:1px solid var(--border);
  border-radius:5px;padding:2px 6px;text-transform:uppercase}

/* ── fullscreen timer ── */
.timer{position:fixed;inset:0;z-index:90;background:radial-gradient(120% 80% at 50% 0%,#efe6d2,#e0d3b6);display:none;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.timer.active{display:flex}
.timer.rest{background:radial-gradient(circle at 50% 30%,#dfe6d0,#d7cbb0 74%)}
.timer.work{background:radial-gradient(circle at 50% 30%,#f0e2c6,#e2d0a8 74%)}
.timer.go{background:radial-gradient(circle at 50% 30%,#e6ecd2,#d3c9a2 74%)}
.tm-label{font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin-bottom:8px;max-width:90%}
.tm-ring{position:relative;width:min(74vw,340px);height:min(74vw,340px);margin:6px 0 18px}
.tm-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tm-ring .bg{stroke:rgba(184,145,47,.28);fill:none}
.tm-ring .fg{fill:none;stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .3s}
.timer.rest .tm-ring .fg{stroke:var(--blue)} .timer.go .tm-ring .fg{stroke:var(--good)}
.tm-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tm-big{font-family:var(--mono);font-size:64px;font-weight:500;letter-spacing:-.02em;line-height:1}
.tm-sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.tm-next{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:20px;min-height:16px}
.tm-ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:420px}
.tm-presets{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.tm-preset{font-family:var(--mono);font-size:13px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);color:var(--muted);cursor:pointer}
.tm-preset.on{border-color:var(--acc);color:var(--acc)}

/* ── toast ── */
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:14px;
  z-index:120;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s;white-space:nowrap;pointer-events:none;font-weight:500;
  opacity:0;visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.toast.ok{border-color:var(--good);color:var(--good)}

/* ── picker chips ── */
.seg{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;font-family:var(--sans);font-size:14px;font-weight:600;padding:12px;border-radius:12px;
  border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}

.log-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.log-row:last-child{border-bottom:none}
.log-date{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:56px}
.log-main{font-family:var(--mono);font-size:16px;font-weight:600;flex:1}
.log-sub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.bar{flex:1;background:var(--card2);border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;
  position:relative;min-height:6px;display:flex;align-items:flex-start;justify-content:center}
.bar.last{background:rgba(184,145,47,.22);border-color:var(--acc)}
.bar span{position:absolute;top:-18px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.bar em{position:absolute;bottom:-18px;font-family:var(--mono);font-size:9px;color:var(--faint);font-style:normal}

.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer}
.pick:last-child{border-bottom:none}
.pill{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--card2);color:var(--muted);cursor:pointer}
.pill.on{border-color:var(--acc);color:var(--acc)}
hr.d{border:none;border-top:1px solid var(--border);margin:22px 0}

/* ── ember additions ── */
.btn-lg{font-size:16px;padding:16px 18px}
.hero{position:relative;border-radius:20px;overflow:hidden;height:210px;margin-bottom:14px;background:var(--card)}
.hero-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-media svg{position:absolute;right:-30px;bottom:-30px;width:200px;height:200px;opacity:.13;stroke:#fff;fill:none;stroke-width:1}
.hero-media.weights{background:radial-gradient(120% 120% at 15% 0%,#8f1a1a 0%,#7a3a17 45%,#241712 100%)}
.hero-media.hiit{background:radial-gradient(120% 120% at 15% 0%,#9c6b1f 0%,#7d2f1c 45%,#241512 100%)}
.hero-media.crossfit{background:radial-gradient(120% 120% at 15% 0%,#4a6b6b 0%,#1d5a58 45%,#10201f 100%)}
.hero-ph{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(transparent 32%,rgba(17,18,20,.92))}
.hero-txt{position:absolute;left:18px;right:18px;bottom:18px}
.hero-ey{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.hero-h1{font-size:30px;font-weight:800;letter-spacing:.01em;margin-top:6px;text-transform:uppercase;line-height:1.02}
.hero-sub{font-size:13px;color:#c9cdd2;margin-top:5px}
.empty-hero{height:auto;padding:24px}
.empty-hero .hero-txt{position:static}
.empty-hero .hero-h1{text-transform:none}
.week{display:flex;gap:8px;flex-wrap:wrap}
.wk{flex:1 1 44px;min-width:44px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 4px;text-align:center;cursor:pointer}
.wk-d{font-size:11px;color:var(--muted);font-weight:600}
.wk-i{margin-top:6px;font-size:14px;height:18px;line-height:1}
.wk.done{opacity:1} .wk.done .wk-i{color:var(--good)}
.wk.rest{opacity:.75;border-style:dashed}
.wk.rest .wk-i{color:var(--faint)}
.wk.now{background:rgba(184,145,47,.16);border-color:var(--acc)} .wk.now .wk-d,.wk.now .wk-i{color:var(--acc)}
.wk.run .wk-i{color:var(--teal)}
.tm-round{display:flex;align-items:center;justify-content:center;gap:22px}
.tm-circ{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:var(--mono);font-size:14px;font-weight:600;cursor:pointer}
.tm-circ:active{transform:scale(.95)}
.tm-big-btn{width:96px;height:96px;border-radius:50%;border:none;background:linear-gradient(180deg,var(--acc),var(--acc-h));color:var(--ink);font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(143,26,26,.35)}
.tm-big-btn:active{transform:scale(.97)}

/* ══ HELIOS (home) — Roman orbit ══ */
.helios{text-align:center;padding-top:4px}
.h-eyebrow{font-family:var(--display);color:var(--acc);letter-spacing:.24em;font-size:12px;font-weight:600;margin-bottom:2px}
.h-hail{font-family:var(--display);font-weight:700;font-size:clamp(30px,9vw,42px);letter-spacing:.02em;line-height:1;color:var(--text);margin-bottom:10px}
.orbit{position:relative;width:min(84vw,350px);max-width:calc(100vw - 76px);aspect-ratio:1;margin:2px auto 0}
.orbit .rings{position:absolute;inset:-7%;border-radius:50%;background:
  radial-gradient(circle,transparent 60.5%,rgba(184,145,47,.18) 61%,transparent 62%),
  radial-gradient(circle,transparent 71.5%,rgba(184,145,47,.12) 72%,transparent 73%),
  radial-gradient(circle,transparent 83.5%,rgba(184,145,47,.08) 84%,transparent 85%)}
.orbit .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.orbit .ring .bg{fill:none;stroke:rgba(184,145,47,.22);stroke-width:4}
.orbit .ring .fg{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .7s ease;filter:drop-shadow(0 1px 2px rgba(154,120,40,.4))}
.disc{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle at 50% 32%,#fcf7ea,#efe5cf);
  border:1px solid rgba(184,145,47,.35);box-shadow:0 10px 26px rgba(120,90,30,.2),inset 0 2px 3px rgba(255,255,255,.8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.disc .spark{color:var(--gold);font-size:20px;line-height:1}
.disc .day{color:var(--acc);font-family:var(--display);letter-spacing:.2em;font-size:11px;font-weight:600;margin-top:8px}
.disc .wname{font-family:var(--display);font-weight:700;font-size:clamp(22px,6.4vw,32px);line-height:1;margin:4px 0 12px;text-transform:uppercase;color:var(--text)}
.rise{background:linear-gradient(180deg,var(--acc),#761212);color:var(--ink);border:none;border-radius:26px;
  font-family:var(--display);font-weight:600;letter-spacing:.2em;font-size:17px;padding:10px 32px;cursor:pointer;
  box-shadow:0 6px 15px rgba(120,20,20,.42),inset 0 1px 0 rgba(255,255,255,.22)}
.rise:active{transform:translateY(1px)}
.node{position:absolute;width:23%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fcf7ea,#eee2c8);
  border:1px solid rgba(184,145,47,.32);box-shadow:0 5px 13px rgba(120,90,30,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center;line-height:1}
.node:active{transform:scale(.96)}
.node .nlbl{font-family:var(--display);letter-spacing:.1em;font-size:9px;color:var(--muted);margin-top:3px}
.node .nval{font-family:var(--display);font-weight:700;font-size:17px;color:var(--text)}
.node .nval small{font-size:9px;color:var(--muted);margin-left:1px}
.node svg{width:19px;height:19px;stroke:var(--gold-d);fill:none;stroke-width:1.6}
.node.tl{top:3%;left:1%}.node.tr{top:3%;right:1%}.node.bl{bottom:3%;left:2%}.node.br{bottom:3%;right:2%}
.sigil{position:relative;width:min(74%,270px);margin:16px auto 0}
.sigil img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sigil .fill{clip-path:inset(var(--t,100%) 0 0 0);transition:clip-path .9s ease}
.tally{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border:1px solid var(--border);border-radius:16px;margin-top:20px;overflow:hidden;box-shadow:0 4px 14px rgba(120,90,30,.08)}
.tally>div{padding:15px 6px;text-align:center}
.tally>div+div{border-left:1px solid var(--border)}
.tally .tv{font-family:var(--display);font-weight:700;font-size:26px;color:var(--text);line-height:1}
.tally .tl{font-family:var(--display);letter-spacing:.13em;font-size:10px;color:var(--muted);margin-top:5px}

/* ══ Tier 1 fix-playbook additions ══ */
/* 1.2 follow-up — --faint is decorative; these are data */
.bar em,.mbar span,.opt,.hero-ph{color:var(--muted)}

/* 1.3 — numbers that change in place or stack in a column must not re-flow */
.tm-big,.tm-sub,.tm-next,.tm-preset,.tm-circ,
.wt input,.reps-inp,.set-lbl,.prev,
.log-main,.log-sub,.log-date,
.stat-val,.tally .tv,.node .nval,
.bar span,.bar em,.mbar span{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}

/* 1.4 — tracking scales inversely with size (Cinzel is already wide) */
.eyebrow,.sec-label,.stat-lbl,.item-eyebrow,.grp,.tag,.badge,.tm-label,.lbl,.log-date{
  letter-spacing:.08em!important}
.tab span,.node .nlbl,.disc .day,.tally .tl,.hero-ey{letter-spacing:.06em!important}
.h-eyebrow{letter-spacing:.12em}
.rise{letter-spacing:.12em}
.lift-scheme{letter-spacing:.05em}

/* 1.5 — 44px floor on everything pressed mid-set, chalky hands included */
.mini{min-height:40px;padding:9px 13px}
#session .mini{min-height:40px;padding:9px 12px}
.tick{height:44px}
.pill{min-height:38px;padding:9px 13px}
.tm-preset{min-height:44px}
.ov-back{width:44px;height:44px}
.btn-sm{min-height:40px}

/* 1.6 — texture and brackets on the ACTIVE lift only; restraint scales, ten cards of ornament don't */
.lift{background:var(--card)}
.lift::before,.lift::after{opacity:0;transition:opacity .18s}
.lift:focus-within{
  background:repeating-linear-gradient(115deg,rgba(166,127,34,.05) 0 2px,transparent 2px 26px),var(--card);
  border-color:rgba(166,127,34,.5)}
.lift:focus-within::before,.lift:focus-within::after{opacity:.85}
.lift.done{border-color:rgba(85,96,44,.55);background:var(--card)}
.lift.done::before,.lift.done::after{opacity:.7;border-color:var(--good)}

/* 1.7 — active tab must survive greyscale, not just hue */
.tab{position:relative}
.tab.active span{font-weight:700}
.tab.active svg{stroke-width:2.3}
.tab.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:18px;height:2px;border-radius:2px;background:currentColor}

/* ── in-app confirm (2.2) — replaces the browser's native confirm() ── */
.ask{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(44,35,24,.45);backdrop-filter:blur(3px)}
.ask.open{display:flex}
.ask-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;
  max-width:360px;width:100%;box-shadow:0 18px 50px rgba(60,45,20,.35)}
.ask-msg{font-family:var(--body);font-size:16.5px;line-height:1.5;color:var(--text)}
.ask .btn{min-height:48px}
.daynudge{display:inline-block;padding:2px 10px;margin:-2px 0;color:var(--gold-d);
  cursor:pointer;font-size:16px;line-height:1}
.daynudge:active{color:var(--acc)}
.tally>div{padding:15px 4px}
.tally .tv{font-size:22px}
.tally .tl{font-size:9px}
/* ══════════════════════════════════════════════════════════════════════
   GROUND THEME — the whole app floats. Nothing is boxed: every surface
   that used to be a card becomes a hairline-separated row on the ground.
   Written as a layer at the end so the rules above stay readable and one
   block can be lifted out if the theme is ever reverted.
   ══════════════════════════════════════════════════════════════════════ */
.card,.stat,.warmbox{background:none;border:none;border-bottom:1px solid var(--border);
  border-radius:0;padding:16px 0;box-shadow:none}
.card+.card{margin-top:0}
.card:last-child,.stat:last-child{border-bottom:none}
.stats,.stat-grid{gap:0}

/* lifts: drop the frame, the texture and the corner brackets entirely */
.lift,.lift:focus-within,.lift.done{background:none;border:none;
  border-bottom:1px solid var(--border);border-radius:0;padding:17px 0;margin-bottom:0}
.lift::before,.lift::after{display:none}
.lift-name{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.15}
.lift-scheme{background:none;border:none;padding:0;margin-top:5px;color:var(--gold);
  font-size:10px;letter-spacing:.05em}
.lift.done{opacity:.62}

/* inputs shed their boxes too — a rule under the number is enough */
.inp{background:none;border:none;border-bottom:1px solid var(--border);border-radius:0;
  padding:11px 2px;color:var(--text)}
.inp:focus{border-bottom-color:var(--good)}
.inp::placeholder{color:var(--faint)}
.wt input{color:var(--text);border-bottom-color:rgba(217,184,119,.5)}
.reps-inp,
/* buttons read as type, not chrome */
.btn{background:none;border:none;color:var(--good);font-family:var(--display);
  font-weight:600;font-size:15px;letter-spacing:.03em;padding:13px 4px}
.btn-acc{background:none;color:var(--good);border:none}
.btn-acc:hover{background:none;color:var(--good)}
.btn-block{border-top:1px solid var(--border);border-radius:0;padding-top:15px;width:100%}
.btn-danger{color:var(--bad);border:none;background:none}
.btn-sm{font-size:13px}
.mini{background:none;border:none;color:var(--good);font-family:var(--mono);font-size:10.5px;padding:7px 2px}
#session .mini{background:none;border:none;color:var(--good);border-radius:0}
#session .mini:hover{background:none;color:var(--good)}
#session .mini.on,#session .mini.sug{background:none;border:none;color:var(--gold)}

/* filters read as a row of words, so they need real space between them —
   flex:1 with no gap ran "CrossFit" and "Custom" together */
.seg{gap:18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.seg button{flex:0 0 auto;min-width:0;background:none;border:none;border-radius:0;color:var(--muted);
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:12px 0;white-space:nowrap}
.seg button.on{background:none;color:var(--good);border:none}

/* list rows float like everything else */
.item{background:none;border:none;border-bottom:1px solid var(--border);border-radius:0;
  padding:17px 0;box-shadow:none}
.item:last-child{border-bottom:none}
.item.hl{border-bottom-color:rgba(217,184,119,.45)}
.pill{background:none;border:none;color:var(--muted)}
.pill.on{color:var(--good)}

/* chrome: the nav and the sheet stop being panels */
.nav{background:linear-gradient(0deg,rgba(8,4,16,.86),rgba(8,4,16,0));
  backdrop-filter:none;-webkit-backdrop-filter:none;border-top:none}
.tab{color:var(--muted)}
.tab.active{color:var(--good)}
.ov-head{background:linear-gradient(180deg,rgba(8,4,16,.9),rgba(8,4,16,.35));
  backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:none}
.ov-back{background:none;border:1px solid rgba(243,234,212,.26);border-radius:50%}
.ov-title .t{font-family:var(--display);font-weight:500;font-size:19px}

/* overlays get their own copy of the ground so the view beneath is hidden
   without flattening them to a solid colour */
.overlay,.sheet-inner{background:var(--ground) center/cover no-repeat fixed}
.overlay::before,.sheet-inner::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(8,4,16,.82) 0%,rgba(8,4,16,.5) 13%,rgba(8,4,16,.2) 32%,rgba(8,4,16,.38) 62%,rgba(8,4,16,.8) 100%)}
.overlay>*,.sheet-inner>*{position:relative;z-index:1}

.timer,.timer.rest,.timer.work,.timer.go{background:var(--ground) center/cover no-repeat fixed}
.timer::before{content:'';position:absolute;inset:0;background:rgba(8,4,16,.72);pointer-events:none;z-index:0}
.timer>*{position:relative;z-index:1}
.tm-ring .bg{stroke:rgba(217,184,119,.2)}
.timer.rest .tm-ring .fg,.timer .tm-ring .fg{stroke:var(--good)}
.timer.go .tm-ring .fg{stroke:var(--gold)}
.tm-preset{background:none;border:none;color:var(--muted)}
.tm-preset.on{color:var(--good)}
.tm-circ{background:none;border:1px solid rgba(243,234,212,.2);color:var(--muted)}

.ask{background:rgba(8,4,16,.72)}
.ask-box{background:#12100c;border:1px solid var(--border);box-shadow:0 18px 50px rgba(0,0,0,.6)}
.toast{background:#12100c;border:1px solid var(--border);color:var(--text)}

/* week strip and charts */
.wk{background:none;border:none;border-bottom:1px solid var(--border);border-radius:0}
.wk.now{border-bottom-color:var(--good)}
.bar{background:linear-gradient(180deg,rgba(111,216,201,.5),rgba(111,216,201,.14));
  border:none;border-radius:4px 4px 0 0}
.bar.last{background:linear-gradient(180deg,rgba(217,184,119,.8),rgba(217,184,119,.22))}
.mbar{background:rgba(111,216,201,.18);border:none;border-radius:4px 4px 0 0}
.mbar.last{background:rgba(217,184,119,.4)}
.tick{background:none;border:none;border-bottom:1px solid var(--border);border-radius:0;color:var(--faint)}
.tick.on{color:var(--good);border-bottom-color:var(--good)}
.log-row{border-bottom:1px solid var(--border)}
.chk{background:none;border:1px solid rgba(111,216,201,.4);border-radius:50%;clip-path:none;
  color:var(--good);width:38px;height:38px}
.chk.on{background:radial-gradient(circle,rgba(111,216,201,.18),transparent 72%);
  border-color:rgba(111,216,201,.6);color:var(--good);filter:drop-shadow(0 0 10px rgba(111,216,201,.35))}
.note-inp{background:none;border:none;border-bottom:1px solid var(--border);border-radius:0}
.ex-note{color:var(--good)}

/* type: Cormorant is softer and lighter than Cinzel, so headings need less
   tracking and a touch more size to hold the same weight on the page */
.h1{font-family:var(--display);font-weight:500;font-size:34px;letter-spacing:.005em;line-height:1.05}
.item-title{font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:0}
.hero-h1{font-family:var(--display);font-weight:500;letter-spacing:.005em}
.eyebrow,.sec-label,.stat-lbl,.item-eyebrow,.grp,.tag,.badge,.lbl,.log-date{
  font-family:var(--mono)!important;letter-spacing:.11em}
.tab span,.tm-label{font-family:var(--display)!important;font-weight:600;letter-spacing:.03em}
.h1,.item-title,.hero-h1,.ov-title .t{text-shadow:0 1px 7px rgba(0,0,0,.75)}

/* ── Home: the monolith ── */
body.home-rail .nav{display:none}
body.home-rail #v-home{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.mono{display:flex;flex-direction:column;
  min-height:calc(100vh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.b-wrap{display:flex;align-items:center;gap:16px;flex:1}
.b-spine{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.b-spine i{width:3px;height:26px;border-radius:2px;background:rgba(243,234,212,.16)}
.b-spine i.on{background:var(--good)}
.b-spine i.now{background:var(--gold);height:34px}
.b-mid{flex:1;min-width:0}
.b-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acc);margin-bottom:12px}
.b-big{font-family:var(--display);font-weight:500;font-size:clamp(34px,11vw,46px);line-height:1.02;
  color:var(--text);text-shadow:0 4px 22px rgba(0,0,0,.7);margin-bottom:14px}
.b-sub{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-bottom:28px}
.b-cta{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.06em;
  color:var(--good);cursor:pointer;display:inline-block}
.b-cta:active{opacity:.6}
.railR{display:flex;flex-direction:column;gap:18px;align-items:center;flex-shrink:0;width:56px}
.rr{display:flex;flex-direction:column;align-items:center;gap:5px;color:rgba(243,234,212,.5);cursor:pointer}
.rr svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4;
  box-sizing:content-box;padding:10px;border-radius:50%;border:1px solid rgba(243,234,212,.24)}
.rr span{font-family:var(--mono);font-size:7.5px;letter-spacing:.05em;text-transform:uppercase}
.rr.on{color:var(--good)}
.rr.on svg{border-color:rgba(111,216,201,.5);box-shadow:0 0 14px rgba(111,216,201,.3)}
.b-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--border);
  padding-top:16px;margin-top:34px;font-family:var(--mono);font-size:9px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.b-foot span{cursor:pointer}

/* ── Plans landing: three floating paths, the middle one lit ── */
.hub{display:flex;flex-direction:column;
  min-height:calc(100vh - 190px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.hubttl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
/* the wrapper bleeds past the view padding so emblems can leave the screen */
.catwrap{overflow:hidden;margin:-64px -22px -32px;padding:64px 0 32px}
.catrow{display:flex;align-items:flex-start;width:166.667%;
  transform:translateX(-20%);touch-action:pan-y}
.catrow.anim{transition:transform .3s cubic-bezier(.22,.61,.36,1)}
@media (prefers-reduced-motion: reduce){.catrow.anim{transition:none}}
.catcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer}
.cat{position:relative;display:flex;align-items:center;justify-content:center}
.cat .ring{position:relative;z-index:2;border-radius:50%;display:flex;align-items:center;
  justify-content:center;border:1px solid rgba(243,234,212,.24);transition:.25s}
.cat .ring svg{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.25s}
.cat .halo{position:absolute;border-radius:50%;z-index:1;opacity:0;transition:opacity .25s}
.catcol .ring{width:56px;height:56px}
.catcol .ring svg{width:26px;height:26px;stroke:rgba(243,234,212,.5)}
.catname{font-family:var(--display);font-weight:500;font-size:14px;color:rgba(243,234,212,.5);transition:.25s}
.catcol.on{margin-top:-16px}
.catcol.on .ring{width:86px;height:86px;border-color:rgba(217,184,119,.85);
  box-shadow:0 0 0 1px rgba(217,184,119,.25),inset 0 0 18px rgba(217,184,119,.14)}
.catcol.on .ring svg{width:40px;height:40px;stroke:#fff6df}
.catcol.on .halo{width:130px;height:130px;opacity:1;
  background:radial-gradient(circle,rgba(217,184,119,.5) 0%,rgba(217,184,119,.16) 42%,transparent 70%)}
.catcol.on .catname{font-weight:600;font-size:21px;color:#fff6df;text-shadow:0 0 16px rgba(217,184,119,.5)}
.hubmeta{text-align:center;margin-top:34px}
.hm-sub{font-size:13px;color:var(--muted)}
.hm-count{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin-top:7px}
.dots3{display:flex;gap:7px;justify-content:center;margin-top:26px}
.dots3 i{width:5px;height:5px;border-radius:50%;background:rgba(243,234,212,.22);cursor:pointer}
.dots3 i.on{background:var(--gold);box-shadow:0 0 8px rgba(217,184,119,.6)}
.hubcta{text-align:center;margin-top:auto;padding-top:18px;border-top:1px solid var(--border);
  font-family:var(--display);font-weight:600;font-size:16px;color:var(--good);cursor:pointer}

/* ── numbered preview ── */
.nrow{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--border)}
.nrow:last-child{border-bottom:none}
.num{font-family:var(--mono);font-size:11px;color:var(--gold);width:20px;flex-shrink:0;padding-top:4px}
.nrow.is-opt .num{color:var(--faint)}
.nname{font-family:var(--display);font-weight:500;font-size:18px;color:var(--text);line-height:1.15}
.nscheme{font-family:var(--mono);font-size:10px;color:var(--good);margin-top:5px}
.ncue{font-size:12.5px;color:rgba(243,234,212,.52);line-height:1.6;margin-top:7px}

/* ── set table ── */
.tbl{margin-top:16px}
.tbl .th,.tbl .tr{display:grid;grid-template-columns:44px 1fr 1fr;gap:14px;align-items:center}
.tbl .th{padding-bottom:10px;border-bottom:1px solid var(--border)}
.tbl .th span{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);text-align:center}
.tbl .th span:first-child{text-align:left}
.tbl .tr{padding:12px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:16px;
  color:var(--text);font-variant-numeric:tabular-nums}
.tbl .tr:last-child{border-bottom:none}
.tbl .tr>span:first-child{color:var(--faint);font-size:11px}
.tbl .tr .v{text-align:center}
.tbl .tr .v input{width:100%;text-align:center;background:none;border:none;color:var(--text);
  font-family:var(--mono);font-size:16px;padding:4px 0;outline:none}
.tbl .tr .v input::placeholder{color:var(--faint)}
.tbl .tr.done>span:first-child{color:var(--good)}
.tbl .tr.now{background:linear-gradient(90deg,rgba(217,184,119,.09),transparent)}
.tbl .tr.now>span:first-child{color:var(--gold)}

/* ── block timeline ── */
.tline{margin-top:16px}
.tl-i{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative}
.tl-t{font-family:var(--mono);font-size:10px;color:var(--faint);width:30px;flex-shrink:0;text-align:right}
.tl-d{width:9px;height:9px;border-radius:50%;border:1px solid rgba(243,234,212,.3);flex-shrink:0}
.tl-i::after{content:'';position:absolute;left:46px;top:58%;width:1px;height:26px;background:var(--border)}
.tl-i:last-child::after,.tl-i.last::after{display:none}
.tl-i.done .tl-d{background:var(--good);border-color:var(--good)}
.tl-i.rest .tl-d{border-style:dashed}
.tl-n{font-size:14px;color:var(--muted)}

/* mockup tag pills: an outline and a colour, no fill */
.tag.hard,.tag.mod{background:none;font-family:var(--mono);font-size:8.5px;font-weight:400;
  letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:4px}
.tag.mod{color:var(--gold);border:1px solid rgba(217,184,119,.42)}
.tag.hard{color:var(--acc);border:1px solid rgba(211,86,79,.45)}
.sec-label.t0{margin-top:2px}

.rblock{padding:16px 0;border-bottom:1px solid var(--border)}
.bars{display:flex;align-items:flex-end;gap:5px;height:66px;margin-top:14px}
.bar em{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:8px;color:var(--faint);font-style:normal}
.bar{position:relative}
.pb-v{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.pb-l{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-top:3px}

.icn.done{box-shadow:0 0 20px rgba(111,216,201,.5),inset 0 0 10px rgba(111,216,201,.22)}
.icn.gold{background:radial-gradient(circle,rgba(217,184,119,.16),transparent 72%);
  border-color:rgba(217,184,119,.55);box-shadow:0 0 16px rgba(217,184,119,.24)}
.icn.gold svg{stroke:var(--gold)}
.body-sm{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
.body-sm.live{color:var(--good)}
.mrow-m.gold{color:var(--gold)}

.cta-block{display:block;text-align:center;margin-top:18px;padding:16px 0 0;
  border-top:1px solid var(--border);font-family:var(--display);font-weight:600;
  font-size:17px;color:var(--good);cursor:pointer}
.cta-block:active{opacity:.6}

.rest-line{display:flex;align-items:center;gap:12px;margin:2px 0 22px;cursor:pointer}
.rest-line .t{font-family:var(--display);font-weight:500;font-size:16px;color:var(--good)}
.tbl-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px}
.tbl-foot .prev{margin-left:0;order:-1}
.tbl-foot .mini:last-child{margin-left:auto}

.pgr{touch-action:pan-y}
.pgr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.pgr-t{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.08;color:var(--text)}
.pgr-s{font-size:13px;color:var(--muted);margin-top:3px}
.pgr-pos{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint);
  flex-shrink:0;padding-top:8px}
.pgr-hint{text-align:center;margin-top:14px;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* ── the workout timer: landscape two-column, stacking if held upright ──
   The clock's own size is set in JS (fitClock) because it depends on how many
   characters the value has — 24 and 12:34 cannot share a font-size. */
.timer.wod{justify-content:flex-start;align-items:stretch;text-align:left;
  padding:calc(16px + env(safe-area-inset-top)) 20px calc(14px + env(safe-area-inset-bottom))}
.timer.wod .tm-label,.timer.wod .tm-ring,.timer.wod .tm-next,
.timer.wod .tm-presets,.timer.wod .tm-ctl{display:none}
.btm{display:none;height:100%;position:relative;z-index:1}
.timer.wod .btm{display:block}
.wt{display:flex;flex-direction:column;height:100%}
.wt-hdr{display:flex;align-items:center;gap:12px;flex-shrink:0}
.wt-back{width:16px;height:16px;flex-shrink:0;box-sizing:content-box;padding:9px;border-radius:50%;
  border:1px solid rgba(243,234,212,.26);cursor:pointer}
.wt-back svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.wt-hb{flex:1;min-width:0}
.wt-t{font-family:var(--display);font-weight:500;font-size:20px;color:var(--text)}
.wt-s{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--gold);margin-top:2px}

.wt-body{flex:1;display:flex;align-items:center;gap:26px;min-height:0}
.wt-l{flex:1;min-width:0}
.wt-r{width:46%;max-width:340px;flex-shrink:0;text-align:center}
.wt-clock{font-family:var(--mono);font-weight:600;line-height:.9;color:var(--text);
  font-variant-numeric:tabular-nums;text-shadow:0 6px 40px rgba(0,0,0,.85)}
.wt-sub{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-top:12px}
.wt-bar{height:7px;background:rgba(243,234,212,.12);border-radius:4px;margin-top:14px;overflow:hidden}
.wt-bar i{display:block;height:100%;background:var(--good);
  box-shadow:0 0 12px rgba(111,216,201,.7);transition:width .95s linear}

/* held upright the two columns stack — same screen, no rotation required */
@media (orientation:portrait){
  .wt-body{flex-direction:column;justify-content:center;gap:22px}
  .wt-l,.wt-r{width:100%;max-width:none}
  .wt-r{order:-1}
}

.wt-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--gold);margin-bottom:9px}
.wt-now{font-family:var(--display);font-weight:500;font-size:clamp(30px,7vw,44px);line-height:1.02;
  margin-bottom:16px}
.wt-next{font-family:var(--display);font-weight:500;font-size:23px;color:var(--muted);
  border-top:1px solid var(--border);padding-top:12px}
.wt-next span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.wt-then{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:7px}

/* the movement list — every row carries its rep count */
.wt-list{display:flex;flex-direction:column}
.wt-i{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.wt-i:last-child{border-bottom:none}
.wt-n{font-family:var(--display);font-weight:500;font-size:25px;color:var(--muted);line-height:1.1}
.wt-reps{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--muted);flex-shrink:0;
  font-variant-numeric:tabular-nums}
.wt-i.now .wt-n{color:var(--text)}
.wt-i.now .wt-reps{color:var(--good)}
.wt-i.now{border-bottom-color:rgba(111,216,201,.45)}
.wt-i.done .wt-n,.wt-i.done .wt-reps{color:rgba(243,234,212,.28)}
.wt-list.dim .wt-n{font-size:18px} .wt-list.dim .wt-reps{font-size:16px}
.wt-up{border-top:1px solid var(--border);padding-top:4px;margin-top:10px;opacity:.7}
.wt-hero{margin-bottom:10px}
.wt-hn{display:block;font-family:var(--display);font-weight:500;font-size:clamp(28px,6.5vw,38px);line-height:1.02}
.wt-hr{display:block;font-family:var(--mono);font-size:30px;font-weight:600;color:var(--good);
  font-variant-numeric:tabular-nums;margin-top:4px}
.wt-ladder{font-family:var(--mono);font-size:15px;letter-spacing:.08em;color:var(--faint);margin-top:12px}
.wt-ladder b{font-weight:600;color:var(--faint)}
.wt-ladder b.now{color:var(--good);font-size:19px}
.wt-ladder b.done{color:rgba(243,234,212,.25)}

.wt-ctl{display:flex;gap:24px;justify-content:center;padding-top:12px;
  border-top:1px solid var(--border);flex-shrink:0}
.wt-c{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:13px;
  color:var(--good);cursor:pointer;padding:9px 6px}
.wt-c svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

.navhdr-l{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--good);cursor:pointer;margin-bottom:16px;display:inline-block}
.tbl .tr{border-bottom:none}
/* ── the mockup's row: an icon, then title / sub / meta ── */
.icn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;background:radial-gradient(circle,rgba(111,216,201,.16),transparent 72%);
  border:1px solid rgba(111,216,201,.4);box-shadow:0 0 14px rgba(111,216,201,.24),inset 0 0 8px rgba(111,216,201,.12)}
.icn svg{width:15px;height:15px;stroke:var(--good);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icn.sq{border-radius:12px;background:radial-gradient(circle,rgba(217,184,119,.16),transparent 74%);
  border-color:rgba(217,184,119,.42);box-shadow:0 0 14px rgba(217,184,119,.2),inset 0 0 8px rgba(217,184,119,.1)}
.icn.sq svg{stroke:var(--gold)}
.icn.sm{width:29px;height:29px} .icn.sm svg{width:13px;height:13px} .icn.sm.sq{border-radius:9px}
.icn.lg{width:50px;height:50px} .icn.lg svg{width:20px;height:20px} .icn.lg.sq{border-radius:16px}
.icn.xl{width:62px;height:62px} .icn.xl svg{width:25px;height:25px}
.icn.blank{background:none;border-color:rgba(243,234,212,.22);box-shadow:none}

.mrow{display:flex;align-items:center;gap:12px;padding:17px 0;border-bottom:1px solid var(--border);cursor:pointer}
.mrow:last-child{border-bottom:none}
.mrow-b{flex:1;min-width:0}
.mrow-t{font-family:var(--display);font-weight:500;font-size:18px;color:var(--text)}
.mrow-s{font-size:12px;color:var(--muted);margin-top:1px}
.mrow-m{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:4px}
.mrow-r{font-family:var(--mono);font-size:11px;color:var(--gold);text-align:right;flex-shrink:0}
.mrow-r em{display:block;color:var(--faint);font-size:9px;margin-top:2px;font-style:normal}

/* header with actions, as on Workouts / History / Runs */
.mhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.mhdr-r{display:flex;gap:8px}
.mhdr-r .icn{cursor:pointer}
/* the four category chips */
.chiprow{display:flex;gap:9px;margin:16px 0 18px}
.chip{flex:1;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.chip svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.6}
.chip span{font-family:var(--mono);font-size:7.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.chip.on svg{stroke:var(--good)} .chip.on span{color:var(--text)}
/* stat strip */
.mstrip{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 0;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);margin-bottom:6px}
.mstrip>div{text-align:center}
.mstrip .v{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.mstrip .l{font-family:var(--mono);font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
/* featured "continue" block on Plans */
.feat{display:flex;gap:15px;align-items:center;margin-bottom:14px;cursor:pointer}
.feat-b{flex:1;min-width:0}
.feat-t{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.05;color:var(--text);margin:2px 0 5px}
.feat-cta{display:block;padding:0 0 16px;border-bottom:1px solid var(--border);

 'Kettlebell swing':'Hinge at the hips not the knees, snap the hips through, let the bell float to chest height.',
 'Barbell bent-over row':'Hinge to about 45°, flat back, pull the bar to the lower ribs and control it down.',
 'Single-arm dumbbell row':'Brace on a bench, pull the dumbbell to the hip keeping the shoulder square to the floor.',
 'Dumbbell floor press':'Lie flat, upper arms stop on the floor, press straight up without flaring the elbows.',
 'Barbell curl':'Elbows pinned at the sides, curl without swinging the hips, lower under control.',
 'Farmer carry':'Stand tall, shoulders back, walk with short steady steps and do not let the ribs flare.',
 'Plank shoulder tap':'Plank with the feet wide, tap the opposite shoulder without letting the hips rotate.',
 'Back squat':'Bar on the upper traps, brace the core, squat to depth keeping the chest up and knees tracking the toes.',
 'Front squat':'Bar racked on the front delts, elbows high, sit straight down keeping the torso upright.',
 'Hack squat':'Feet mid-platform shoulder-width, back flat against the pad, drive through the mid-foot.',
 'Hack squat or front squat':'Bar racked on the front delts (or hack squat machine), sit straight down keeping the torso upright.',
 'Leg press':'Feet shoulder-width on the platform, lower until knees hit ~90°, keep the lower back flat on the pad.',
 'Walking lunge':'Step forward, drop the back knee toward the floor, drive through the front heel to the next step.',
 'Bulgarian split squat':'Rear foot elevated, front shin near-vertical, lower straight down and drive through the front foot.',
 'Romanian deadlift':'Soft knees, hinge at the hips pushing them back, keep the bar close to the legs.',
 'Trap-bar deadlift':'Stand inside the bar, chest up, drive through the floor with a flat back.',
 'Deadlift':'Bar over mid-foot, flat back, push the floor away rather than pulling with the lower back.',
 'Hip thrust':'Upper back on the bench, drive the hips up to full extension, squeeze the glutes at the top.',
 'Leg extension':'Sit tall, extend the knees fully without swinging the torso, control the negative.',
 'Seated leg curl':'Pad above the heel, curl through the full range without lifting the hips off the seat.',
 'Lying leg curl':'Hips pressed into the bench, curl the heels to the glutes, avoid arching the lower back.',
 'Standing calf raise':'Full stretch at the bottom, rise onto the balls of the feet, pause at the top.',
 'Seated calf raise':'Knees bent under the pad, press through the forefoot for a full range of motion.',
 'Goblet squat':'Hold a dumbbell at the chest, squat between the knees keeping the torso upright.',

function toKg(v){ if(v==null||v===''||isNaN(+v))return null; return S.unit==='lb'? Math.round((+v/KG_LB)*100)/100 : +v; }

/* ── ISO week key for the Monday reminder ── */
function weekKey(d=new Date()){ const t=new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate()+3-((t.getDay()+6)%7)); const wk1=new Date(t.getFullYear(),0,4); return t.getFullYear()+'-W'+String(1+Math.round(((t-wk1)/864e5-3+((wk1.getDay()+6)%7))/7)).padStart(2,'0'); }
function programWeek(){ if(!S.active?.startedISO)return 0; const d=(Date.now()-new Date(S.active.startedISO+'T00:00:00'))/864e5; return Math.floor(d/7)+1; }
/* which program day is next — derived from this week's session count, but
   user-correctable, since doing an extra session or logging one twice would

function nextDayIdx(p){
  if(S.active?.nextDay!=null) return ((S.active.nextDay%p.D.length)+p.D.length)%p.D.length;
  const progWk=sessionsSince(weekStart())
    .filter(s=>s.source?.type==='program'&&s.source.programId===p.id).length;
  return progWk%p.D.length;
}

function isRest(iso){ return (S.restDays||[]).includes(iso); }
function toggleRest(iso){
  S.restDays=S.restDays||[];
  S.restDays=isRest(iso)?S.restDays.filter(d=>d!==iso):[...S.restDays,iso];

function weekDays(){
  const out=[], ws=weekStart();
  for(let i=0;i<7;i++){
    const d=new Date(ws+i*864e5);
    const iso=localISO(d);
    out.push({
      iso,
      label:['M','T','W','T','F','S','S'][i],
      today:iso===todayISO(),
      trained:S.sessions.some(s=>s.date===iso),

    });

}

/* ── progress analytics (weights canonical in kg) ──────────────────
   One pass over history, cached until something writes. Reads per-set
   data first and falls back to the single weight field, so sessions
   logged before 3.1's sets-first model keep working unchanged.       */
let _exIdx=null;
function invalidateIndex(){ _exIdx=null; }
function setsTop(l){
  if(!l) return null;
  const ws=(l.sets||[]).map(s=>s&&s.w).filter(w=>w!=null&&w!=='');
  if(ws.length) return Math.max(...ws.map(Number));
  return (l.weight!=null&&l.weight!=='')?+l.weight:null;
}
function bestSet(l){
  const ss=(l.sets||[]).filter(s=>s&&s.w!=null&&s.w!=='');
  return ss.length?ss.reduce((a,s)=>(+s.w>+a.w?s:a)):null;
}
function setsTopReps(l){ return bestSet(l)?.reps ?? l?.reps ?? null; }
function exIndex(){
  if(_exIdx) return _exIdx;
  _exIdx={};
  const ordered=[...S.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  for(const s of ordered){
    for(const [id,l] of Object.entries(s.log||{})){
      const w=setsTop(l);
      if(w==null) continue;
      const e=_exIdx[id]||(_exIdx[id]={last:null,best:null,hist:[]});
      e.last={w,date:s.date,reps:setsTopReps(l),rpe:bestSet(l)?.rpe??null};
      if(e.best==null||w>e.best) e.best=w;
      e.hist.push({date:s.date,w});
    }
  }
  return _exIdx;
}
function allTimeBest(exId){ return exIndex()[exId]?.best??null; }
function exHistory(exId){ return exIndex()[exId]?.hist||[]; }
function weekStreak(){
  const has=t0=>S.sessions.some(s=>{const t=new Date(s.date+'T00:00:00').getTime(); return t>=t0&&t<t0+7*864e5;});
  const cur=weekStart(); let n=0, t=has(cur)?cur:cur-7*864e5;   // current week counts if started; otherwise streak isn't broken yet
  while(has(t)){ n++; t-=7*864e5; }
  return n;
}
/* sessions per week, averaged over the last n weeks — the number that says
   whether the month was actually good, since a streak of any length can
   hide anywhere from one session a week to ten. */
function avgPerWeek(n=4){
  const ws=weekStart(); let tot=0;
  for(let i=0;i<n;i++){
    const t0=ws-i*7*864e5;
    tot+=S.sessions.filter(s=>{
      const t=new Date(s.date+'T00:00:00').getTime(); return t>=t0&&t<t0+7*864e5;
    }).length;
  }
  return Math.round(tot/n*10)/10;
}
/* a "5k" is inferred from the numbers: ~5 km with a time; "hard" = 5:30/km or quicker.
   (r.type==='5k' honours runs logged before the type selector was removed) */
function is5k(r){ return r.min>0 && ((r.km>=4.8&&r.km<=5.2) || (r.type==='5k'&&!r.km)); }
function paceSec(r){ return (r.min*60)/(+r.km||5); }        // seconds per km
function isHard5k(r){ return is5k(r) && paceSec(r)<=330; }  // 5:30/km
function bestFiveK(){
  const fives=S.runs.filter(is5k);
  if(!fives.length) return null;
  return fives.reduce((a,r)=>paceSec(r)<paceSec(a)?r:a);
}
function weeklyKm(n=8){
  const out=[]; const ws=weekStart();
  for(let i=n-1;i>=0;i--){ const t0=ws-i*7*864e5;
    const km=S.runs.filter(r=>{const t=new Date(r.date+'T00:00:00').getTime(); return t>=t0&&t<t0+7*864e5;})
      .reduce((a,r)=>a+(+r.km||0),0);
    out.push({t0,km:Math.round(km*10)/10}); }
  return out;
}

/* Plans opens on a chooser rather than a list: three paths, the middle one lit.
   _planCat is the highlighted index, _planIn is whether we've drilled in. */
let _planCat=0, _planIn=false;
const PLAN_CATS=[
  ['august','August','Four weeks, 4–31 Aug'],
  ['weights','Weights','Barbell work, progressive overload'],
  ['hiit','HIIT','Alternating hard &amp; moderate'],
  ['crossfit','CrossFit','Strength piece plus a metcon'],
];
const CAT_GLYPH={
  august:'<path d="M32 8v48M14 20l18-12 18 12M14 44l18 12 18-12M14 20v24M50 20v24"/>',
  weights:'<path d="M10 22v20M20 14v36M44 14v36M54 22v20M20 32h24"/>',
  hiit:'<path d="M35 6 14 36h16l-3 22 21-30H32z"/>',
  crossfit:'<path d="M32 56a15 15 0 0 0 15-15c0-7.5-5-12.5-8.8-20-1.2 5-3.8 7.5-5 11.2C32 26 29.5 22 27 15.5c-5 7.5-10 16.2-10 25.5A15 15 0 0 0 32 56z"/>',
};
let _planTapAt=0, _planTapIdx=-1, _progIdx=0;
function planPick(i){ _planCat=(i+PLAN_CATS.length)%PLAN_CATS.length; renderPrograms(); }
/* one tap highlights, two opens. Tracked by hand rather than using dblclick so
   the same gesture works from a finger, where dblclick is unreliable. */
function planTap(i,slot){
  if(_planDragged) return;                 // that was a swipe, not a tap
  const now=Date.now();
  if(i===_planTapIdx && now-_planTapAt<400){ _planTapAt=0; _planTapIdx=-1; _planCat=i; return planEnter(); }
  _planTapAt=now; _planTapIdx=i;
  const dir=slot!=null?slot-2:0;
  if(dir) slideTo(dir);                    // a side emblem travels in, same as a swipe
}
function planEnter(){ _planIn=true; _progIdx=0; renderPrograms(); }
function planBack(){ _planIn=false; renderPrograms(); }

function renderPrograms(){
  if(_planIn) return renderProgramList();
  const [cat,name,blurb]=PLAN_CATS[_planCat];
  const n=PROGRAMS.filter(p=>p.cat===cat).length;
  /* the selection always occupies the middle slot and the others rotate around
     it, so "the lit one is the one in the centre" stays true however you got here */
  const N=PLAN_CATS.length;
  /* five slots, not three: the row is 5/3 of the screen and sits offset so the
     selection is centred, which means the emblem that slides in already exists
     off-screen. With three categories the wrap makes the outer pair land on
     exactly the right ones. */
  const order=[-2,-1,0,1,2].map(d=>(_planCat+d+N*2)%N);
  const cols=order.map((idx,slot)=>{
    const [c,label]=PLAN_CATS[idx];
    return `<div class="catcol ${slot===2?'on':''}" onclick="planTap(${idx},${slot})">
       <div class="cat"><div class="halo"></div>
         <div class="ring"><svg viewBox="0 0 64 64">${CAT_GLYPH[c]}</svg></div></div>
       <div class="catname">${label}</div>
     </div>`;
  }).join('');
  $('v-programs').innerHTML=`
    <div class="hub">
      <div class="hubttl">Choose a category</div>
      <div class="hubmid">
        <div class="catwrap"><div class="catrow" id="catrow">${cols}</div></div>
        <div class="hubmeta">
          <div class="hm-sub">${blurb}</div>
          <div class="hm-count">${n} program${n!==1?'s':''} &middot; double-tap to open</div>
        </div>
      </div>
    </div>`;
  bindHubSwipe();
}

/* Pointer events rather than touch, so a mouse drag works the same as a finger.
   The row tracks the finger 1:1 while you drag and then settles, rather than
   jumping on release — a discrete jump was what made this feel wrong. Only the
   emblem row travels; the heading and the blurb underneath cross-fade, because
   this is a picker inside one screen, not navigation between screens. */
const REST_X=-20;                        // percent: centres slot 2 of 5
let _planDragged=false;
const _reduceMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function slideTo(dir){
  const row=$('catrow');
  if(!row||!dir||_reduceMotion()) return planPick(_planCat+dir);
  const wrap=row.parentElement, w=wrap.clientWidth;
  const to=row.children[2+dir];
  if(!to) return planPick(_planCat+dir);
  /* light the incoming emblem now so it grows during the slide rather than
     snapping to full size after it */
  row.children[2].classList.remove('on');
  to.classList.add('on');
  row.classList.add('anim');
  row.style.transform=`translateX(calc(${REST_X}% + ${-dir*w/3}px))`;
  let settled=false;
  const done=()=>{ if(settled) return; settled=true;
    row.removeEventListener('transitionend',done); planPick(_planCat+dir); };
  row.addEventListener('transitionend',done);
  setTimeout(done,420);                  // transitionend can be missed if the tab blurs
}

function bindHubSwipe(){
  const row=$('catrow'); if(!row) return;
  const wrap=row.parentElement;
  let x0=null,y0=null,w=0,dragging=false;
  const reset=()=>{ row.classList.add('anim'); row.style.transform=`translateX(${REST_X}%)`; };
  row.addEventListener('pointerdown',e=>{
    x0=e.clientX; y0=e.clientY; w=wrap.clientWidth; dragging=false;
    row.classList.remove('anim');        // track the finger with no easing in the way
  });
  row.addEventListener('pointermove',e=>{
    if(x0==null) return;
    const dx=e.clientX-x0, dy=e.clientY-y0;
    if(!dragging){
      if(Math.abs(dx)<6) return;                       // still ambiguous
      if(Math.abs(dy)>Math.abs(dx)){ x0=null; return; } // vertical — let the page scroll
      dragging=true;
    }
    row.style.transform=`translateX(calc(${REST_X}% + ${dx}px))`;
  });
  row.addEventListener('pointerup',e=>{
    if(x0==null) return;
    const dx=e.clientX-x0; x0=null;
    if(dragging){
      _planDragged=true;                               // don't let this fire a tap too
      setTimeout(()=>_planDragged=false,0);
      /* a fifth of the screen is enough to mean it — anything less springs back */
      if(Math.abs(dx)>w*0.18) return slideTo(dx<0?1:-1);
    }
    reset(); dragging=false;
  });
  row.addEventListener('pointercancel',()=>{ x0=null; dragging=false; reset(); });
}

function renderProgramList(){
  const [cat]=PLAN_CATS[_planCat];
  const list=PROGRAMS.filter(p=>p.cat===cat);
  if(_progIdx>=list.length) _progIdx=0;
  const p=list[_progIdx];
  const active=S.active?.programId===p.id;
  /* one program at a time, in full — swipe across rather than tapping in */
  $('v-programs').innerHTML=`
    <div class="navhdr-l" onclick="planBack()">&lsaquo; All categories</div>
    <div class="pgr" id="pgr">
      <div class="pgr-head">
        <div class="pgr-ttl">
          <div class="pgr-t">${esc(p.title)}</div>
          <div class="pgr-s">${esc(p.subtitle)}</div>
        </div>

      </div>

      <div class="cta-block" onclick="${active?`riseNow('${p.id}',${nextDayIdx(p)})`:`setActive('${p.id}')`}">
        ${active?'Resume &rarr;':'Set as my plan'}</div>
      <div class="pgr-hint">${list.length>1?'Swipe across for the '+(list.length-1)+' other '+(list.length===2?'plan':'plans'):''}</div>
    </div>`;
  bindProgSwipe(list.length);
}
/* same pointer-based gesture as the category hub: mouse and finger behave
   identically, and a drag under 40px stays a tap so the day rows still work */
function bindProgSwipe(n){
  const el=$('pgr'); if(!el||n<2) return;
  let x0=null,y0=null;
  el.addEventListener('pointerdown',e=>{ x0=e.clientX; y0=e.clientY; });
  el.addEventListener('pointerup',e=>{
    if(x0==null) return;
    const dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){
      _progIdx=(_progIdx+(dx<0?1:-1)+n)%n;
      renderProgramList();
    }
  });
  el.addEventListener('pointercancel',()=>{ x0=null; });
}

function programBreakdownHTML(p){

function dayContentPreview(d){

function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      S.sessions=unionById(S.sessions,d.sessions); S.bodyLog=unionById(S.bodyLog,d.bodyLog);
      S.runs=unionById(S.runs,d.runs); S.customWorkouts=unionById(S.customWorkouts,d.customWorkouts);
      if(d.active!==undefined)S.active=d.active; if(d.unit)S.unit=d.unit;
      invalidateIndex();
      persist(); closeSheet(); nav('home'); toast('Backup imported',true);
    }catch(err){ toast('Could not read that file'); } };
    r.readAsText(f); };
  inp.click();
}

let _arenaQ='',_arenaCat='all',_arenaSearch=false;
function toggleArenaSearch(){
  _arenaSearch=!_arenaSearch;
  if(!_arenaSearch) _arenaQ='';
  renderWorkouts();
  if(_arenaSearch){ const s=$('arena-q'); if(s) s.focus(); }
}
function renderWorkouts(){
  const q=_arenaQ.trim().toLowerCase();
  let html=`<div class="mhdr"><div class="h1">Workouts</div>
      <div class="mhdr-r"><span onclick="toggleArenaSearch()">${ic('search','sm')}</span><span onclick="openBuilder()">${ic('plus','sm sq')}</span></div>
    </div>
    ${_arenaSearch?`<input class="inp" id="arena-q" placeholder="Search a day or an exercise…" value="${esc(_arenaQ)}"
      oninput="_arenaQ=this.value;renderWorkouts()" style="margin-bottom:6px">`:''}
    <div class="chiprow">${[['all','grid','All'],['weights','bell','Weights'],['hiit','bolt','HIIT'],['crossfit','flame','CrossFit']]
      .map(([k,g,l])=>`<div class="chip ${_arenaCat===k?'on':''}" onclick="_arenaCat='${k}';renderWorkouts()">
        <svg viewBox="0 0 24 24">${G[g]}</svg><span>${l}</span></div>`).join('')}</div>`;
  const hit=hay=>!q||hay.toLowerCase().includes(q);
  const mine=S.customWorkouts.filter(w=>hit(w.name+' '+(w.lifts||[]).map(l=>l.n).join(' ')));
  /* dedupe days that are byte-identical across the 3/4/5-day variants of a category */
  const seen=new Set(), days=[];
  PROGRAMS.filter(p=>_arenaCat==='all'||p.cat===_arenaCat).forEach(p=>{
    p.D.forEach((d,i)=>{
      const key=p.cat+'|'+d.name+'|'+(d.lifts||[]).map(l=>l.n).join(',')+'|'+(d.cond||'')+'|'+(d.wod||'');
      if(seen.has(key)) return;
      seen.add(key);
      if(!hit(d.name+' '+(d.sub||'')+' '+liftsPreview(d))) return;
      days.push({p,d,i});
    });
  });
  /* the mockup leads with the count, then the program days; custom work is the
     tail section under "Your workouts" */
  html+=`<div class="sec-label t0">${days.length} workout${days.length===1?'':'s'}${q?' matching':''}</div>`;
  if(!days.length&&!mine.length){
    html+=`<div class="empty">Nothing matches "${esc(_arenaQ)}".</div>`;
  }
  days.forEach(({p,d,i})=>{
    const nl=(d.lifts||[]).length;
    html+=`<div class="mrow" onclick="startFreestyle('${p.id}',${i})">
      ${ic(CAT_G[p.cat])}
      <div class="mrow-b">
        <div class="mrow-t">${esc(d.name)}</div>
        <div class="mrow-s">${esc(d.sub||p.subtitle)}</div>
        <div class="mrow-m">${nl} lift${nl===1?'':'s'}${d.ab?' &middot; Ab burner '+d.ab:''}${d.cond?' &middot; '+esc(BLOCK_BANK[d.cond].name.split('·')[0].trim()):''}</div>
      </div>
      ${d.tag?`<span class="tag ${d.tag==='Hard'?'hard':'mod'}">${d.tag}</span>`:''}</div>`;
  });
  if(mine.length){
    html+=`<div class="sec-label">Your workouts</div>`;
    mine.forEach(w=>{
      html+=`<div class="mrow" onclick="startCustom('${w.id}')">
        ${ic('pen')}
        <div class="mrow-b">
          <div class="mrow-t">${esc(w.name)}</div>
          <div class="mrow-m">${(w.lifts||[]).length} lifts &middot; custom${w.ab?' &middot; ab '+w.ab:''}</div>
        </div>
        <span class="mrow-r" onclick="event.stopPropagation();deleteCustom('${w.id}')">&times;</span></div>`;
    });
  }
  $('v-workouts').innerHTML=html;
  /* innerHTML wipes focus — put the caret back so typing doesn't drop characters */
  if(_arenaQ){
    const s=$('arena-q');
    if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); }
  }
}

  const w={id:uid(),name:_bd.name.trim(),lifts:_bd.lifts,ab:_bd.ab||null};
  S.customWorkouts.push(w); persist(); closeSheet(); nav('workouts'); toast('Workout saved',true);
}
async function deleteCustom(id){
  const w=S.customWorkouts.find(x=>x.id===id);
  if(!await ask(`Delete "${w?w.name:'this workout'}"? Sessions you've already logged from it stay.`,{ok:'Delete',danger:true})) return;
  S.customWorkouts=S.customWorkouts.filter(x=>x.id!==id); persist(); renderWorkouts();
}
