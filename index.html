<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>MG Training</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e7dcc4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MG Training">
<link rel="apple-touch-icon" href="icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#e7dcc4; --bg2:#efe6d2; --card:#f4eddc; --card2:#eadfc4; --border:#d6c6a2;
  --acc:#8f1a1a; --acc-h:#a52323; --ink:#f6ecd4; --blue:#b8912f; --teal:#b8912f; --gold:#b8912f; --gold-d:#9a7726;
  --text:#2c2318; --muted:#8a7856; --faint:#b4a37e;
  --bad:#8f1a1a; --good:#6f7a3f;
  --weights:#8f1a1a; --hiit:#9c6b1f; --crossfit:#4a6b6b;
  --mono:'EB Garamond',ui-monospace,Menlo,monospace;
  --sans:'EB Garamond',Georgia,'Times New Roman',serif;
  --display:'Cinzel','EB Garamond',Georgia,serif;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% -10%,var(--bg2),var(--bg)) fixed;color:var(--text);font-family:var(--sans);line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-size:16.5px}
/* ── Roman display type for headings & labels ── */
.h1,.item-title,.stat-val,.hero-h1,.tm-big,.ov-title .t,.seg button,.btn-acc,.btn-lg{font-family:var(--display);letter-spacing:.01em}
.eyebrow,.sec-label,.stat-lbl,.item-eyebrow,.grp,.tab span,.tag,.badge,.tm-label,.lbl,.log-date{font-family:var(--display)!important;letter-spacing:.14em}
.app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column}

/* ── views ── */
.view{flex:1;padding:24px 22px calc(96px + env(safe-area-inset-bottom));display:none}
.view.active{display:block}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.h1{font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1.05;margin-bottom:6px}
.lede{color:var(--muted);font-size:14px;margin-bottom:22px;max-width:44ch}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.card+.card{margin-top:12px}
.soft{color:var(--muted);font-size:14px;line-height:1.55}

/* ── buttons ── */
.btn{font-family:var(--sans);font-size:15px;font-weight:600;padding:13px 18px;border-radius:12px;
  border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;
  transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn-acc{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.btn-acc:hover{background:var(--acc-h)}
.btn-block{width:100%}
.btn-sm{font-size:13px;padding:8px 12px;border-radius:10px}
.btn-ghost{background:transparent}
.btn-danger{color:var(--bad);border-color:rgba(240,113,78,.3);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row-t{display:flex;gap:10px;align-items:center}

/* ── inputs ── */
.inp{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-family:var(--sans);font-size:16px;padding:13px 15px;outline:none;transition:.15s}
.inp:focus{border-color:var(--blue)}
.inp::placeholder{color:var(--faint)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ── tags ── */
.tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 9px;border-radius:6px}
.tag-weights{background:rgba(143,26,26,.12);color:var(--weights)}
.tag-hiit{background:rgba(156,107,31,.16);color:var(--hiit)}
.tag-crossfit{background:rgba(74,107,107,.18);color:var(--crossfit)}
.tag-hard{background:rgba(143,26,26,.16);color:var(--bad)}
.tag-mod{background:rgba(184,145,47,.16);color:var(--acc)}
.tag-run{background:rgba(184,145,47,.16);color:var(--blue)}

/* ── stat grid ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.stat-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:7px;margin-bottom:12px}
.stat-lbl svg{width:15px;height:15px;stroke:var(--muted)}
.stat-val{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat-val small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}

/* ── list item card ── */
.item{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;
  cursor:pointer;transition:.15s;margin-bottom:12px}
.item:active{transform:scale(.99)}
.item.hl{border-color:rgba(184,145,47,.55)}
.item-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.item-title{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.item-sub{color:var(--muted);font-size:13px;line-height:1.5}
.sec-label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
.sec-label:first-child{margin-top:0}

/* ── banner ── */
.banner{border:1px solid rgba(143,26,26,.4);background:rgba(143,26,26,.06);border-radius:14px;
  padding:16px 18px;color:var(--acc);font-size:14px;font-weight:500;margin-bottom:16px}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:14px}

/* ── account chip ── */
.acct{display:none;align-items:center;justify-content:flex-end;gap:8px;padding:16px 22px 0;min-height:46px}
.acct .dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.acct .dot.ok{background:var(--good)} .acct .dot.err{background:var(--bad)}
.acct .dot.sync{background:var(--acc);animation:blink .9s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ── bottom nav ── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(238,228,204,.92);backdrop-filter:blur(12px) saturate(1.1);border-top:1px solid var(--border);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav-inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:12px;
  border:1.5px solid transparent;background:none;color:var(--muted);cursor:pointer;transition:.15s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tab span{font-size:10px;font-weight:600;letter-spacing:.01em}
.tab.active{color:var(--acc);border-color:transparent}

/* ── session overlay ── */
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
.overlay.active{display:flex}
.ov-head{position:sticky;top:0;background:rgba(238,228,204,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  display:flex;align-items:center;gap:12px;z-index:2}
.ov-back{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card2);
  color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ov-back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.ov-title{flex:1;min-width:0}
.ov-title .t{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-title .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ov-body{flex:1;overflow-y:auto;padding:18px 18px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

/* ── session rows ── */
.warmbox{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:12px;padding:13px 16px;font-size:13px;color:var(--muted);margin-bottom:14px}
.warmbox.done{opacity:.55}
.grp{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.lift{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;
  transition:.15s}
.lift.done{border-color:rgba(111,122,63,.5);background:rgba(111,122,63,.08)}
.lift-top{display:flex;align-items:flex-start;gap:12px}
.lift-info{flex:1;min-width:0}
.lift-name{font-size:15px;font-weight:600}
.lift-scheme{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.chk{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--card2);
  color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.chk.on{background:var(--good);border-color:var(--good);color:var(--ink)}
.lift-ctl{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.wt{position:relative}
.wt input{width:96px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);
  font-family:var(--mono);font-size:15px;padding:9px 30px 9px 12px;text-align:right;outline:none}
.wt input:focus{border-color:var(--acc)}
.wt .u{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted)}
.prev{font-family:var(--mono);font-size:11px;color:var(--muted)}
.prev .up{color:var(--good)} .prev .dn{color:var(--bad)}
.mini{font-family:var(--mono);font-size:12px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);color:var(--muted);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.mini:hover{border-color:var(--muted);color:var(--text)}
.mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.mini.on{border-color:var(--acc);color:var(--acc)}
.desc{color:var(--muted);font-size:13px;line-height:1.6;margin-top:8px}
/* per-set logging */
.sets-panel{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;flex-direction:column;gap:8px}
.sets-panel.open{display:flex}
.set-line{display:flex;align-items:center;gap:8px}
.set-lbl{font-family:var(--mono);font-size:11px;color:var(--muted);width:22px;flex-shrink:0}
.set-line .x{font-family:var(--mono);font-size:11px;color:var(--faint)}
.reps-inp{width:64px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);
  font-family:var(--mono);font-size:14px;padding:8px 10px;text-align:center;outline:none}
.reps-inp:focus{border-color:var(--acc)}
.ex-note{font-size:12px;color:var(--teal);margin-top:3px;font-style:italic}
.note-inp{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);
  font-size:13px;padding:8px 12px;outline:none;margin-top:8px;display:none}
.note-inp.open{display:block}
.note-inp:focus{border-color:var(--teal)}
/* mini progress chart */
.mbar-row{display:flex;align-items:flex-end;gap:5px;height:64px;margin-top:14px}
.mbar{flex:1;background:var(--card2);border:1px solid var(--border);border-bottom:none;border-radius:5px 5px 0 0;
  position:relative;min-height:5px}
.mbar.last{background:rgba(184,145,47,.24);border-color:var(--acc)}
.mbar span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--muted);white-space:nowrap}
.ticks{display:flex;gap:6px;margin-top:12px}
.tick{flex:1;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--muted);
  font-family:var(--mono);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px}
.tick.on{background:rgba(111,122,63,.2);border-color:var(--good);color:var(--good)}
.opt{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--faint);border:1px solid var(--border);
  border-radius:5px;padding:2px 6px;text-transform:uppercase}

/* ── fullscreen timer ── */
.timer{position:fixed;inset:0;z-index:90;background:radial-gradient(120% 80% at 50% 0%,#efe6d2,#e0d3b6);display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;text-align:center}
.timer.active{display:flex}
.timer.rest{background:radial-gradient(circle at 50% 30%,#dfe6d0,#d7cbb0 74%)}
.timer.work{background:radial-gradient(circle at 50% 30%,#f0e2c6,#e2d0a8 74%)}
.timer.go{background:radial-gradient(circle at 50% 30%,#e6ecd2,#d3c9a2 74%)}
.tm-label{font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin-bottom:8px;max-width:90%}
.tm-ring{position:relative;width:min(74vw,340px);height:min(74vw,340px);margin:6px 0 18px}
.tm-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tm-ring .bg{stroke:rgba(184,145,47,.28);fill:none}
.tm-ring .fg{fill:none;stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .3s}
.timer.rest .tm-ring .fg{stroke:var(--blue)} .timer.go .tm-ring .fg{stroke:var(--good)}
.tm-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tm-big{font-family:var(--mono);font-size:64px;font-weight:500;letter-spacing:-.02em;line-height:1}
.tm-sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.tm-next{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:20px;min-height:16px}
.tm-ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:420px}
.tm-presets{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.tm-preset{font-family:var(--mono);font-size:13px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);color:var(--muted);cursor:pointer}
.tm-preset.on{border-color:var(--acc);color:var(--acc)}

/* ── toast ── */
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:14px;
  z-index:120;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s;white-space:nowrap;pointer-events:none;font-weight:500;
  opacity:0;visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.toast.ok{border-color:var(--good);color:var(--good)}

/* ── picker chips ── */
.seg{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;font-family:var(--sans);font-size:14px;font-weight:600;padding:12px;border-radius:12px;
  border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}

.log-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.log-row:last-child{border-bottom:none}
.log-date{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:56px}
.log-main{font-family:var(--mono);font-size:16px;font-weight:600;flex:1}
.log-sub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.bar{flex:1;background:var(--card2);border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;
  position:relative;min-height:6px;display:flex;align-items:flex-start;justify-content:center}
.bar.last{background:rgba(184,145,47,.22);border-color:var(--acc)}
.bar span{position:absolute;top:-18px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.bar em{position:absolute;bottom:-18px;font-family:var(--mono);font-size:9px;color:var(--faint);font-style:normal}

.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer}
.pick:last-child{border-bottom:none}
.pill{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--card2);color:var(--muted);cursor:pointer}
.pill.on{border-color:var(--acc);color:var(--acc)}
hr.d{border:none;border-top:1px solid var(--border);margin:22px 0}

/* ── ember additions ── */
.tag-weights{background:rgba(143,26,26,.14)}
.tag-mod{background:rgba(143,26,26,.12)}
.btn-lg{font-size:16px;padding:16px 18px}
.hero{position:relative;border-radius:20px;overflow:hidden;height:210px;margin-bottom:14px;background:var(--card)}
.hero-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-media svg{position:absolute;right:-30px;bottom:-30px;width:200px;height:200px;opacity:.13;stroke:#fff;fill:none;stroke-width:1}
.hero-media.weights{background:radial-gradient(120% 120% at 15% 0%,#8f1a1a 0%,#7a3a17 45%,#241712 100%)}
.hero-media.hiit{background:radial-gradient(120% 120% at 15% 0%,#9c6b1f 0%,#7d2f1c 45%,#241512 100%)}
.hero-media.crossfit{background:radial-gradient(120% 120% at 15% 0%,#4a6b6b 0%,#1d5a58 45%,#10201f 100%)}
.hero-ph{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(transparent 32%,rgba(17,18,20,.92))}
.hero-txt{position:absolute;left:18px;right:18px;bottom:18px}
.hero-ey{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.hero-h1{font-size:30px;font-weight:800;letter-spacing:.01em;margin-top:6px;text-transform:uppercase;line-height:1.02}
.hero-sub{font-size:13px;color:#c9cdd2;margin-top:5px}
.empty-hero{height:auto;padding:24px}
.empty-hero .hero-txt{position:static}
.empty-hero .hero-h1{text-transform:none}
.week{display:flex;gap:8px;flex-wrap:wrap}
.wk{flex:1 1 44px;min-width:44px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 4px;text-align:center}
.wk-d{font-size:11px;color:var(--muted);font-weight:600}
.wk-i{margin-top:6px;font-size:14px;height:18px;line-height:1}
.wk.done{opacity:.5} .wk.done .wk-i{color:var(--good)}
.wk.now{background:rgba(184,145,47,.16);border-color:var(--acc)} .wk.now .wk-d,.wk.now .wk-i{color:var(--acc)}
.wk.run .wk-i{color:var(--teal)}
.tm-round{display:flex;align-items:center;justify-content:center;gap:22px}
.tm-circ{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:var(--mono);font-size:14px;font-weight:600;cursor:pointer}
.tm-circ:active{transform:scale(.95)}
.tm-big-btn{width:96px;height:96px;border-radius:50%;border:none;background:linear-gradient(180deg,var(--acc),var(--acc-h));color:var(--ink);font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(143,26,26,.35)}
.tm-big-btn:active{transform:scale(.97)}

/* ══ HELIOS (home) — Roman orbit ══ */
.helios{text-align:center;padding-top:4px}
.h-eyebrow{font-family:var(--display);color:var(--acc);letter-spacing:.24em;font-size:12px;font-weight:600;margin-bottom:2px}
.h-hail{font-family:var(--display);font-weight:700;font-size:clamp(30px,9vw,42px);letter-spacing:.02em;line-height:1;color:var(--text);margin-bottom:10px}
.orbit{position:relative;width:min(84vw,350px);aspect-ratio:1;margin:2px auto 0}
.orbit .rings{position:absolute;inset:-7%;border-radius:50%;background:
  radial-gradient(circle,transparent 60.5%,rgba(184,145,47,.18) 61%,transparent 62%),
  radial-gradient(circle,transparent 71.5%,rgba(184,145,47,.12) 72%,transparent 73%),
  radial-gradient(circle,transparent 83.5%,rgba(184,145,47,.08) 84%,transparent 85%)}
.orbit .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.orbit .ring .bg{fill:none;stroke:rgba(184,145,47,.22);stroke-width:4}
.orbit .ring .fg{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .7s ease;filter:drop-shadow(0 1px 2px rgba(154,120,40,.4))}
.disc{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle at 50% 32%,#fcf7ea,#efe5cf);
  border:1px solid rgba(184,145,47,.35);box-shadow:0 10px 26px rgba(120,90,30,.2),inset 0 2px 3px rgba(255,255,255,.8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.disc .spark{color:var(--gold);font-size:20px;line-height:1}
.disc .day{color:var(--acc);font-family:var(--display);letter-spacing:.2em;font-size:11px;font-weight:600;margin-top:8px}
.disc .wname{font-family:var(--display);font-weight:700;font-size:clamp(22px,6.4vw,32px);line-height:1;margin:4px 0 12px;text-transform:uppercase;color:var(--text)}
.rise{background:linear-gradient(180deg,var(--acc),#761212);color:var(--ink);border:none;border-radius:26px;
  font-family:var(--display);font-weight:600;letter-spacing:.2em;font-size:17px;padding:10px 32px;cursor:pointer;
  box-shadow:0 6px 15px rgba(120,20,20,.42),inset 0 1px 0 rgba(255,255,255,.22)}
.rise:active{transform:translateY(1px)}
.node{position:absolute;width:23%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fcf7ea,#eee2c8);
  border:1px solid rgba(184,145,47,.32);box-shadow:0 5px 13px rgba(120,90,30,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center;line-height:1}
.node:active{transform:scale(.96)}
.node .nlbl{font-family:var(--display);letter-spacing:.1em;font-size:9px;color:var(--muted);margin-top:3px}
.node .nval{font-family:var(--display);font-weight:700;font-size:17px;color:var(--text)}
.node .nval small{font-size:9px;color:var(--muted);margin-left:1px}
.node svg{width:19px;height:19px;stroke:var(--gold-d);fill:none;stroke-width:1.6}
.node.tl{top:3%;left:-1%}.node.tr{top:3%;right:-1%}.node.bl{bottom:3%;left:1%}.node.br{bottom:3%;right:1%}
.sigil{position:relative;width:min(74%,270px);margin:16px auto 0}
.sigil img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sigil .fill{clip-path:inset(var(--t,100%) 0 0 0);transition:clip-path .9s ease}
.tally{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border:1px solid var(--border);border-radius:16px;margin-top:20px;overflow:hidden;box-shadow:0 4px 14px rgba(120,90,30,.08)}
.tally>div{padding:15px 6px;text-align:center}
.tally>div+div{border-left:1px solid var(--border)}
.tally .tv{font-family:var(--display);font-weight:700;font-size:26px;color:var(--text);line-height:1}
.tally .tl{font-family:var(--display);letter-spacing:.13em;font-size:10px;color:var(--muted);margin-top:5px}
</style>
</head>

function persist(bumpTime=true){
  if(bumpTime) S.updatedAt=Date.now();
  try{
    localStorage.setItem(K+'state', JSON.stringify({
      active:S.active, draft:S.draft, sessions:S.sessions, bodyLog:S.bodyLog,
      runs:S.runs, customWorkouts:S.customWorkouts, exNotes:S.exNotes, unit:S.unit,

      remindWeekly:S.remindWeekly, lastRemindWeek:S.lastRemindWeek, updatedAt:S.updatedAt }));

function hydrate(){
  try{ const raw=localStorage.getItem(K+'state'); if(raw) Object.assign(S,JSON.parse(raw)); }catch(e){}

function parseSets(sch){ const m=String(sch).match(/^(\d+)/); return m?+m[1]:3; }
function pace(km,min){ if(!km||!min) return '—'; const s=(min*60)/km, m=Math.floor(s/60); return `${m}:${String(Math.round(s%60)).padStart(2,'0')}`; }
function progById(id){ return PROGRAMS.find(p=>p.id===id); }
/* ── units (weights stored canonically in kg) ── */
const KG_LB=2.2046226;
function fromKg(kg){ if(kg==null||kg==='')return kg; const v=S.unit==='lb'?kg*KG_LB:kg; return Math.round(v*10)/10; }
function toKg(v){ if(v==null||v===''||isNaN(+v))return null; return S.unit==='lb'? Math.round((+v/KG_LB)*100)/100 : +v; }
function uLbl(){ return S.unit; }
/* ── ISO week key for the Monday reminder ── */
function weekKey(d=new Date()){ const t=new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate()+3-((t.getDay()+6)%7)); const wk1=new Date(t.getFullYear(),0,4); return t.getFullYear()+'-W'+String(1+Math.round(((t-wk1)/864e5-3+((wk1.getDay()+6)%7))/7)).padStart(2,'0'); }
function programWeek(){ if(!S.active?.startedISO)return 0; const d=(Date.now()-new Date(S.active.startedISO+'T00:00:00'))/864e5; return Math.floor(d/7)+1; }
function bodyLoggedThisWeek(){ const ws=weekStart(); return S.bodyLog.some(e=> new Date(e.date+'T00:00:00').getTime()>=ws); }
/* ── progress analytics (weights canonical in kg) ── */
function allTimeBest(exId){ let b=null; for(const s of S.sessions){ const w=s.log?.[exId]?.weight; if(w!=null&&(b==null||w>b)) b=w; } return b; }
function exHistory(exId){ return S.sessions.filter(s=>s.log?.[exId]?.weight!=null)
  .sort((a,b)=>a.date.localeCompare(b.date)).map(s=>({date:s.date,w:s.log[exId].weight})); }
function weekStreak(){
  const has=t0=>S.sessions.some(s=>{const t=new Date(s.date+'T00:00:00').getTime(); return t>=t0&&t<t0+7*864e5;});
  const cur=weekStart(); let n=0, t=has(cur)?cur:cur-7*864e5;   // current week counts if started; otherwise streak isn't broken yet
  while(has(t)){ n++; t-=7*864e5; }
  return n;
}
/* a "5k" is inferred from the numbers: ~5 km with a time; "hard" = 5:30/km or quicker.
   (r.type==='5k' honours runs logged before the type selector was removed) */
function is5k(r){ return r.min>0 && ((r.km>=4.5&&r.km<=5.5) || (r.type==='5k'&&!r.km)); }
function isHard5k(r){ return is5k(r) && (r.min/(r.km||5))<=5.5; }
function bestFiveK(){
  const fives=S.runs.filter(is5k);
  if(!fives.length) return null;
  return fives.reduce((a,r)=>r.min<a.min?r:a);
}
function weeklyKm(n=8){
  const out=[]; const ws=weekStart();
  for(let i=n-1;i>=0;i--){ const t0=ws-i*7*864e5;
    const km=S.runs.filter(r=>{const t=new Date(r.date+'T00:00:00').getTime(); return t>=t0&&t<t0+7*864e5;})
      .reduce((a,r)=>a+(+r.km||0),0);
    out.push({t0,km:Math.round(km*10)/10}); }
  return out;
}
let _toastT;
function toast(msg,ok){ const el=$('toast'); el.textContent=msg; el.className='toast show'+(ok?' ok':''); clearTimeout(_toastT); _toastT=setTimeout(()=>el.className='toast',2400); }

function lastBody(){ return S.bodyLog.length? S.bodyLog[S.bodyLog.length-1].kg : null; }
function run7d(){ const cut=Date.now()-7*864e5; return S.runs.filter(r=>new Date(r.date+'T00:00:00').getTime()>=cut).reduce((a,r)=>a+(+r.km||0),0); }
function prevWeight(exId){
  const past=[...S.sessions].sort((a,b)=>b.date.localeCompare(a.date));
  for(const s of past){ const w=s.log?.[exId]?.weight; if(w!=null&&w!=='') return {w:+w,date:s.date}; }
  return null;
}
function sessionsFor(pid){ return S.sessions.filter(s=>s.source?.programId===pid).length; }
function weekStart(){ const d=new Date(); d.setHours(0,0,0,0); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.getTime(); } // Monday
function monthStart(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),1).getTime(); }
function sessionsSince(ts){ return S.sessions.filter(s=> new Date(s.date+'T00:00:00').getTime()>=ts); }
function runsSince(ts){ return S.runs.filter(r=> new Date(r.date+'T00:00:00').getTime()>=ts); }

function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      S.sessions=unionById(S.sessions,d.sessions); S.bodyLog=unionById(S.bodyLog,d.bodyLog);
      S.runs=unionById(S.runs,d.runs); S.customWorkouts=unionById(S.customWorkouts,d.customWorkouts);
      if(d.active!==undefined)S.active=d.active; if(d.unit)S.unit=d.unit;
      persist(); closeSheet(); nav('home'); toast('Backup imported',true);
    }catch(err){ toast('Could not read that file'); } };
    r.readAsText(f); };
  inp.click();
}

function buildRows(day){
  const rows=[];
  if(day.warmup) rows.push({kind:'warmup',id:'warmup',text:day.warmup});
  (day.lifts||[]).forEach(l=>rows.push({kind:'lift',id:slug(l.n),name:l.n,scheme:l.s}));
  if(day.cond){ const b=BLOCK_BANK[day.cond]; rows.push({kind:'block',id:day.cond,name:b.name,desc:b.desc,rounds:b.rounds}); }
  if(day.wod){ const w=WOD_BANK[day.wod]; rows.push({kind:'wod',id:day.wod,name:w.name,desc:w.desc,rounds:w.rounds}); }
  if(day.ab){ const a=AB_BANK[day.ab];
    rows.push({kind:'abhead',ref:day.ab,title:a.title});
    a.items.forEach(it=>rows.push({kind:'ab',id:slug(it.n),name:it.n,scheme:it.s,timed:it.timed})); }
  return rows;
}
function startProgramDay(pid,idx){ const p=progById(pid); _start(p.D[idx],{type:'program',programId:pid,dayName:p.D[idx].name,cat:p.cat},`${p.title} · ${p.D[idx].name}`,p.D[idx].tag); }
function startFreestyle(pid,idx){ const p=progById(pid); openWorkoutDetail(p.D[idx],{type:'freestyle',dayName:p.D[idx].name,cat:p.cat},p.D[idx].name,p.D[idx].tag,`${p.subtitle} · freestyle`); }
function startCustom(id){ const w=S.customWorkouts.find(x=>x.id===id); if(!w)return; openWorkoutDetail(w,{type:'custom',workoutId:id,cat:'custom'},w.name,null,'Custom workout'); }

function beginPending(){ if(!_pending)return; const p=_pending; _pending=null; closeSheet(); _start(p.day,p.source,p.title,p.tag); }
function _start(day,source,title,tag){
  if(S.draft && !confirm('Discard the session in progress and start a new one?')) { openSession(); return; }
  S.draft={id:uid(),date:todayISO(),title,tag:tag||null,source,rows:buildRows(day),log:{},notes:''};

}
function openSession(){ if(!S.draft){ nav('home'); return; } closeSheet(); renderSessionBody(); $('session').classList.add('active'); $('ss-body').scrollTo?.(0,0); }
function closeSession(){ $('session').classList.remove('active'); if(S.view) render(S.view); }
function renderSessionBody(){
  const d=S.draft;

function rowHTML(r){
  const lg=S.draft.log[r.id]||{};
  if(r.kind==='warmup'){ const done=!!lg.done;
    return `<div class="warmbox ${done?'done':''}" id="row-${r.id}" style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1"><b style="color:var(--text)">Warmup</b> — ${esc(r.text)}</div>
      <button class="chk ${done?'on':''}" onclick="toggleDone('${r.id}')">${done?'✓':''}</button></div>`; }
  if(r.kind==='abhead') return `<div class="grp">Ab burner ${r.ref} · ${esc(r.title)} <span class="opt">optional</span></div>`;
  if(r.kind==='lift'||r.kind==='ab'){
    const done=!!lg.done, wt=lg.weight!=null?fromKg(lg.weight):'';
    const isAb=r.kind==='ab';
    const prev=(!isAb)?prevWeight(r.id):null;
    let prevHTML='';
    if(!isAb){
      if(prev){ const c=lg.weight; let cls='',sym='→';
        if(c!=null&&c>prev.w){cls='up';sym='↑';} if(c!=null&&c<prev.w){cls='dn';sym='↓';}
        prevHTML=`<span class="prev"><span class="${cls}">${sym} ${fromKg(prev.w)}${uLbl()}</span></span>`;
      } else prevHTML=`<span class="prev">first time</span>`;
    }
    const timer=r.timed?`<button class="mini" onclick="openHold('${esc(r.name)}',${r.timed})"><svg viewBox="0 0 24 24">${ICON.history}</svg>${r.timed}s</button>`:'';
    const note=S.exNotes[r.id];
    const setCount=parseSets(r.scheme);
    const setsOpen=(lg.sets||[]).some(s=>s&&(s.w!=null||s.reps!=null));
    const setsPanel=!isAb?`<div class="sets-panel${setsOpen?' open':''}" id="sets-${r.id}">`+
      Array.from({length:setCount},(_,i)=>{ const st=(lg.sets||[])[i]||{};
        return `<div class="set-line"><span class="set-lbl">S${i+1}</span>
          <div class="wt"><input type="number" step="0.5" inputmode="decimal" placeholder="—" value="${st.w!=null?fromKg(st.w):''}" oninput="setSetW('${r.id}',${i},this.value)"><span class="u">${uLbl()}</span></div>
          <span class="x">×</span>
          <input class="reps-inp" type="number" inputmode="numeric" placeholder="reps" value="${st.reps??''}" oninput="setSetR('${r.id}',${i},this.value)">
        </div>`;}).join('')+`</div>`:'';
    const wtInput=!isAb?`<div class="wt"><input id="wt-${r.id}" type="number" step="0.5" inputmode="decimal" placeholder="—" value="${wt}" oninput="setW('${r.id}',this.value)"><span class="u">${uLbl()}</span></div>
       <button class="mini${setsOpen?' on':''}" onclick="toggleSetsPanel('${r.id}',this)">sets</button>
       <button class="mini" onclick="openRest(S.autoRestSec)"><svg viewBox="0 0 24 24">${ICON.history}</svg>rest</button>`:'';
    return `<div class="lift ${done?'done':''}" id="row-${r.id}">
      <div class="lift-top">
        <div class="lift-info"><div class="lift-name">${esc(r.name)}</div><div class="lift-scheme">${esc(r.scheme)}</div>
        <div class="ex-note" id="note-txt-${r.id}" ${note?'':'style="display:none"'}>${esc(note||'')}</div></div>
        <button class="chk ${done?'on':''}" onclick="toggleDone('${r.id}')">${done?'✓':''}</button>
      </div>
      <div class="lift-ctl">${wtInput}${timer}${prevHTML}
        <button class="mini" onclick="toggleNote('${r.id}')" title="Exercise note">✎</button>
        <button class="mini" onclick="ssRemoveRow('${r.id}')" title="Remove" style="margin-left:auto">✕</button></div>
      ${setsPanel}
      <input class="note-inp" id="note-${r.id}" placeholder="Note (e.g. seat pin 5, wide grip) — saved for every session" value="${esc(note||'')}" oninput="setExNote('${r.id}',this.value)">
    </div>`;
  }
  if(r.kind==='block'||r.kind==='wod'){
    const done=!!lg.done;
    const hasSeq=TIMERS[r.id];
    const rd=r.rounds?lg.rounds||Array(r.rounds).fill(false):null;
    let ticks='';
    if(rd) ticks=`<div class="ticks">${rd.map((v,i)=>`<div class="tick ${v?'on':''}" onclick="toggleRound('${r.id}',${i},${r.rounds})">R${i+1} ${v?'✓':''}</div>`).join('')}</div>`;
    return `<div class="lift ${done?'done':''}" id="row-${r.id}">
      <div class="lift-top">
        <div class="lift-info"><div class="lift-name">${esc(r.name)}</div></div>
        <button class="chk ${done?'on':''}" onclick="toggleDone('${r.id}')">${done?'✓':''}</button>
      </div>
      <div class="desc">${esc(r.desc)}</div>
      ${ticks}
      <div class="lift-ctl">
        ${hasSeq?`<button class="mini" onclick="openTimer(TIMERS['${r.id}']())"><svg viewBox="0 0 24 24">${ICON.history}</svg>Start timer</button>`:''}
        <button class="mini" onclick="openRest(90)"><svg viewBox="0 0 24 24">${ICON.history}</svg>90s rest</button>
        <button class="mini" onclick="ssRemoveRow('${r.id}')" title="Remove" style="margin-left:auto">✕</button>
      </div></div>`;
  }
  return '';
}
function refreshPrev(id,kg){
  const row=$('row-'+id); const prev=prevWeight(id); const pEl=row?.querySelector('.prev');
  if(pEl&&prev){ let cls='',sym='→'; if(kg!=null&&kg>prev.w){cls='up';sym='↑';} if(kg!=null&&kg<prev.w){cls='dn';sym='↓';}
    pEl.innerHTML=`<span class="${cls}">${sym} ${fromKg(prev.w)}${uLbl()}</span>`; }
}
function checkPR(id,l,kg,name){
  if(kg==null) return;
  const best=allTimeBest(id);
  if(best!=null && kg>best && kg>(l.prMax||0)){
    l.prMax=kg;
    toast(`🎉 New PR — ${fromKg(kg)}${uLbl()}${name?' '+name:''}`,true);
    try{ vibrate([80,40,80]); }catch(e){}
  }
}
function setW(id,v){ const kg=v!==''?toKg(v):null; const l=S.draft.log[id]=S.draft.log[id]||{}; l.weight=kg; persist(false);
  refreshPrev(id,kg);
  const r=S.draft.rows.find(x=>x.id===id); checkPR(id,l,kg,r?.name); }
function setSetW(id,i,v){
  const l=S.draft.log[id]=S.draft.log[id]||{}; if(!l.sets)l.sets=[];
  l.sets[i]=l.sets[i]||{}; l.sets[i].w=v!==''?toKg(v):null;
  const ws=l.sets.filter(s=>s&&s.w!=null).map(s=>s.w);
  l.weight=ws.length?Math.max(...ws):null;                 // top set drives progress + PR
  persist(false);
  const main=$('wt-'+id); if(main) main.value=l.weight!=null?fromKg(l.weight):'';
  refreshPrev(id,l.weight);
  const r=S.draft.rows.find(x=>x.id===id); checkPR(id,l,l.weight,r?.name);
}
function setSetR(id,i,v){
  const l=S.draft.log[id]=S.draft.log[id]||{}; if(!l.sets)l.sets=[];
  l.sets[i]=l.sets[i]||{}; l.sets[i].reps=v!==''?parseInt(v):null; persist(false);
}
function toggleSetsPanel(id,btn){ const p=$('sets-'+id); if(!p)return; const open=p.classList.toggle('open'); btn?.classList.toggle('on',open); }
function toggleNote(id){ const n=$('note-'+id); if(!n)return; n.classList.toggle('open'); if(n.classList.contains('open')) n.focus(); }
function setExNote(id,v){
  if(v.trim()) S.exNotes[id]=v.trim(); else delete S.exNotes[id];
  persist(false);
  const t=$('note-txt-'+id); if(t){ t.textContent=v.trim(); t.style.display=v.trim()?'':'none'; }
}
function toggleDone(id){ const l=S.draft.log[id]=S.draft.log[id]||{}; l.done=!l.done; persist(false);
  const row=$('row-'+id); row.classList.toggle('done',l.done); row.querySelector('.chk').classList.toggle('on',l.done);
  row.querySelector('.chk').textContent=l.done?'✓':'';
  if(l.done && S.autoRest){                                 // auto-rest on check-off
    const r=S.draft.rows.find(x=>x.id===id);
    if(r?.kind==='lift') openRest(S.autoRestSec);
    else if(r?.kind==='ab') openRest(45);                   // doc: 45 sec between ab exercises
  } }
function toggleRound(id,i,total){ const l=S.draft.log[id]=S.draft.log[id]||{}; if(!l.rounds)l.rounds=Array(total).fill(false);
  l.rounds[i]=!l.rounds[i]; const all=l.rounds.every(Boolean); l.done=all; persist(false); renderSessionBody(); }
function ssAddExercise(){
  if(!S.draft)return;
  const n=$('ss-add-n').value.trim(); if(!n){ toast('Name the exercise'); return; }
  const s=$('ss-add-s').value.trim()||'3×10';
  let id=slug(n), base=id, k=2; while(S.draft.rows.some(r=>r.id===id)) id=base+'-'+(k++);
  S.draft.rows.push({kind:'lift',id,name:n,scheme:s});
  persist(false); renderSessionBody(); toast('Added',true);
  $('ss-add-n')?.scrollIntoView({block:'center'});
}
function ssRemoveRow(id){
  if(!S.draft)return;
  const lg=S.draft.log[id];
  if(lg && (lg.weight!=null||lg.done||lg.rounds) && !confirm('Remove this exercise? Its logged data will be cleared.')) return;
  S.draft.rows=S.draft.rows.filter(r=>r.id!==id); delete S.draft.log[id];
  persist(false); renderSessionBody();
}
function discardDraft(){ if(S.draft&&!confirm('Discard this session?'))return; S.draft=null; persist(); closeSession(); nav('home'); }
function saveSession(){
  if(!S.draft) return;
  const done=Object.values(S.draft.log).filter(l=>l.done).length;
  const editingId=S.draft.editingId;
  const sess={...S.draft, doneCount:done, savedAt:Date.now()};
  delete sess.editingId;
  if(editingId){ const i=S.sessions.findIndex(x=>x.id===editingId); if(i>=0){ sess.id=editingId; sess.date=S.sessions[i].date; S.sessions[i]=sess; } else S.sessions.push(sess); }
  else S.sessions.push(sess);
  S.draft=null; persist();
  $('session').classList.remove('active');
  toast(editingId?'Session updated':'Session saved',true); nav(editingId?'history':'home');
}
function editSession(id){
  const s=S.sessions.find(x=>x.id===id); if(!s)return;
  S.draft=JSON.parse(JSON.stringify({...s, editingId:id})); persist(); openSession();
}

let _hf={period:'all',type:'all',view:'log'};
function setHF(k,v){ _hf[k]=v; renderHistory(); }
function renderHistory(){   // "Laurels" — Deeds (log) / Ascent (progress) / Body
  const el=$('v-history');
  const head=`<div class="eyebrow">House Record</div><div class="h1">Laurels</div>
    <div class="seg" style="margin-top:14px">
      <button class="${_hf.view==='log'?'on':''}" onclick="setHF('view','log')">Deeds</button>
      <button class="${_hf.view==='progress'?'on':''}" onclick="setHF('view','progress')">Ascent</button>
      <button class="${_hf.view==='body'?'on':''}" onclick="setHF('view','body')">Body</button></div>`;
  if(_hf.view==='progress'){ el.innerHTML=head+progressInner(); return; }
  if(_hf.view==='body'){ el.innerHTML=head+bodyInner(); renderPhotos(); return; }
  const viewSeg='';
  let list=[...S.sessions].sort((a,b)=>b.date.localeCompare(a.date));
  if(_hf.period==='week'){ const ws=weekStart(); list=list.filter(s=>new Date(s.date+'T00:00:00').getTime()>=ws); }
  else if(_hf.period==='month'){ const ms=monthStart(); list=list.filter(s=>new Date(s.date+'T00:00:00').getTime()>=ms); }
  if(_hf.type!=='all') list=list.filter(s=>(s.source?.cat||'')===_hf.type);
  const periods=[['all','All time'],['month','Month'],['week','Week']];
  const types=[['all','All'],['weights','Weights'],['hiit','HIIT'],['crossfit','CrossFit'],['custom','Custom']];
  let html=`${head}
    <div class="seg">${periods.map(([k,l])=>`<button class="${_hf.period===k?'on':''}" onclick="setHF('period','${k}')">${l}</button>`).join('')}</div>
    <div class="seg">${types.map(([k,l])=>`<button class="${_hf.type===k?'on':''}" style="min-width:64px;font-size:13px;padding:9px" onclick="setHF('type','${k}')">${l}</button>`).join('')}</div>
    <div class="lede" style="margin-bottom:14px">${list.length} session${list.length!==1?'s':''}.</div>`;
  if(!list.length){ html+=`<div class="empty">No sessions in this filter.</div>`; el.innerHTML=html; return; }
  html+=list.map(s=>{
    const rows=(s.rows||[]).filter(r=>r.kind==='lift'||r.kind==='ab'||r.kind==='block'||r.kind==='wod');
    const body=rows.map(r=>{ const lg=s.log?.[r.id]||{};
      const val=lg.weight!=null&&lg.weight!==''?fromKg(lg.weight)+' '+uLbl():(lg.done?'done':(lg.rounds?lg.rounds.filter(Boolean).length+' rounds':''));
      const ic=lg.done?'<span style="color:var(--good)">✓</span>':'<span style="color:var(--faint)">·</span>';

      <div class="spread"><div><div class="item-title" style="font-size:16px">${esc(s.title)}</div>

/* ── lift progression (Ascent) ── */
function progressInner(){
  const map=new Map();
  [...S.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
    (s.rows||[]).forEach(r=>{
      if(r.kind!=='lift') return;
      const w=s.log?.[r.id]?.weight; if(w==null) return;
      if(!map.has(r.id)) map.set(r.id,{name:r.name,points:[]});
      map.get(r.id).points.push({date:s.date,w});
    });
  });
  let html=`<div class="lede" style="margin:14px 0">Top-set weight per session. Beat the last bar.</div>`;
  if(!map.size){ return html+`<div class="empty">No logged weights yet — enter weights during sessions and trends appear here.</div>`; }
  const cards=[...map.entries()].sort((a,b)=>b[1].points[b[1].points.length-1].date.localeCompare(a[1].points[a[1].points.length-1].date));
  cards.forEach(([id,ex])=>{
    const pts=ex.points.slice(-8);
    const ws=pts.map(p=>p.w), max=Math.max(...ws), min=Math.min(...ws), rng=Math.max(0.5,max-min);
    const best=allTimeBest(id);
    const last=ws[ws.length-1], prev=ws.length>1?ws[ws.length-2]:null;
    let trend='';
    if(prev!=null){ const d=last-prev;
      trend=d>0?`<span style="color:var(--good)">↑ +${fromKg(d)}${uLbl()}</span>`:d<0?`<span style="color:var(--bad)">↓ ${fromKg(d)}${uLbl()}</span>`:`<span style="color:var(--muted)">→ same</span>`; }
    const bars=pts.map((p,i)=>{ const h=14+((p.w-min)/rng)*44;
      return `<div class="mbar ${i===pts.length-1?'last':''}" style="height:${h}px" title="${fmtDate(p.date)}"><span>${fromKg(p.w)}</span></div>`; }).join('');
    html+=`<div class="card" style="margin-bottom:12px">
      <div class="spread"><div><div class="item-title" style="font-size:16px">${esc(ex.name)}</div>
        <div class="item-sub">Best ${fromKg(best)}${uLbl()} · ${ex.points.length} session${ex.points.length!==1?'s':''}</div></div>
        <span style="font-family:var(--mono);font-size:12px">${trend}</span></div>
      <div class="mbar-row">${bars}</div>
    </div>`;
  });
  return html;
}

function bodyInner(){
  const log=[...S.bodyLog].sort((a,b)=>a.date.localeCompare(b.date));
  let avgHTML='';
  if(log.length>=2){
    const now=Date.now(), wAgo=now-7*864e5, w2Ago=now-14*864e5;
    const inRange=(a,b)=>log.filter(e=>{const t=new Date(e.date+'T00:00:00').getTime(); return t>=a&&t<b;});
    const cur=inRange(wAgo,now+864e5), prev=inRange(w2Ago,wAgo);
    if(cur.length){
      const avg=cur.reduce((a,e)=>a+e.kg,0)/cur.length;
      let delta='';
      if(prev.length){ const pAvg=prev.reduce((a,e)=>a+e.kg,0)/prev.length; const d=avg-pAvg;
        delta=` · ${d<=0?'<span style="color:var(--good)">':'<span style="color:var(--bad)">'}${d>0?'+':''}${fromKg(Math.round(d*10)/10)}${uLbl()} vs last week</span>`; }

    }
  }
  let chart='';

}

/* ── progress photos (IndexedDB — kept off the cloud doc) ── */
let _idb=null;
function idb(){ return new Promise((res,rej)=>{ if(_idb)return res(_idb);
  const rq=indexedDB.open('mgt-photos',1);
  rq.onupgradeneeded=()=>{ if(!rq.result.objectStoreNames.contains('photos')) rq.result.createObjectStore('photos',{keyPath:'id'}); };
  rq.onsuccess=()=>{ _idb=rq.result; res(_idb); }; rq.onerror=()=>rej(rq.error); }); }
async function photoAll(){ try{ const db=await idb(); return await new Promise(res=>{ const t=db.transaction('photos').objectStore('photos').getAll(); t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([]); }); }catch(e){ return []; } }
async function photoPut(rec){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('photos','readwrite').objectStore('photos').put(rec); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }
async function photoDel(id){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction('photos','readwrite').objectStore('photos').delete(id); t.onsuccess=()=>res(); t.onerror=()=>res(); }); }catch(e){} }
function addPhoto(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    const img=new Image();
    img.onload=async()=>{ const max=1080, sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      try{ await photoPut({id:uid(),date:todayISO(),dataURL:c.toDataURL('image/jpeg',0.82)}); toast('Photo saved',true); renderPhotos(); }
      catch(err){ toast('Could not save photo'); }
      URL.revokeObjectURL(img.src); };
    img.onerror=()=>toast('Could not read image');
    img.src=URL.createObjectURL(f); };
  inp.click();
}
async function renderPhotos(){
  const box=$('photo-grid'); if(!box)return;

/* ═══════════════════════════════════════════════════════════════
   FULLSCREEN TIMER ENGINE
   cfg = { title, mode:'down'|'up'|'seq', sec, target, phases:[{label,sec,kind}], rest }
═══════════════════════════════════════════════════════════════ */
let TM=null, _tmInt=null, _ac=null;
const RC=2*Math.PI*45;
function beep(freq=880,dur=0.15,type='sine'){
  try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); const o=_ac.createOscillator(),g=_ac.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(_ac.destination);
    g.gain.setValueAtTime(0.001,_ac.currentTime); g.gain.exponentialRampToValueAtTime(0.4,_ac.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,_ac.currentTime+dur); o.start(); o.stop(_ac.currentTime+dur);
  }catch(e){}
}
function vibrate(p){ try{navigator.vibrate&&navigator.vibrate(p);}catch(e){} }
function openRest(sec){ openTimer({title:'Rest',mode:'down',sec,rest:true,presets:[60,90,120,180]}); }
function openHold(name,sec){ openTimer({title:name,mode:'down',sec}); }
function openTimer(cfg){
  clearInterval(_tmInt);
  if(cfg.mode==='seq'){ TM={cfg,mode:'seq',idx:0,remaining:cfg.phases[0].sec,total:cfg.phases[0].sec,running:true}; }
  else if(cfg.mode==='up'){ TM={cfg,mode:'up',elapsed:0,target:cfg.target||0,running:true}; }
  else { TM={cfg,mode:'down',remaining:cfg.sec,total:cfg.sec,running:true}; }
  $('timer').classList.add('active');
  drawTimer(); tickStart(); reqWake();
  try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function closeTimer(){ clearInterval(_tmInt); TM=null; $('timer').classList.remove('active'); relWake(); }

/* keep the screen awake while a timer is running */
let _wake=null;
async function reqWake(){ try{ if('wakeLock' in navigator) _wake=await navigator.wakeLock.request('screen'); }catch(e){} }
function relWake(){ try{ _wake&&_wake.release(); }catch(e){} _wake=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && TM && !_wake) reqWake(); });
function tickStart(){ clearInterval(_tmInt); _tmInt=setInterval(tick,1000); }
function tick(){
  if(!TM||!TM.running) return;
  if(TM.mode==='up'){ TM.elapsed++; if(TM.target&&TM.elapsed===TM.target){ beep(660,0.4); vibrate([200,80,200]); } drawTimer(); return; }
  TM.remaining--;
  if(TM.remaining<=3&&TM.remaining>0) beep(700,0.08);
  if(TM.remaining<=0){
    if(TM.mode==='seq'&&TM.idx<TM.cfg.phases.length-1){
      TM.idx++; const ph=TM.cfg.phases[TM.idx]; TM.remaining=ph.sec; TM.total=ph.sec;
      beep(ph.kind==='rest'?520:900,0.25); vibrate(120); drawTimer(); return;
    }
    TM.running=false; TM.done=true; clearInterval(_tmInt);
    beep(1040,0.5); setTimeout(()=>beep(1240,0.5),160); vibrate([300,100,300]);
    drawTimer(); return;
  }
  drawTimer();
}
function fmtClock(s){ const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; }
function drawTimer(){
  const t=$('timer'); const cfg=TM.cfg;
  let big,label,sub,next='',frac,kind;
  if(TM.mode==='up'){
    big=fmtClock(TM.elapsed); label=cfg.title; kind='work';
    sub=TM.target?`target ${fmtClock(TM.target)}`:'stopwatch'; frac=TM.target?Math.min(1,TM.elapsed/TM.target):0;
  } else if(TM.done){
    big='GO'; label='Done'; sub=''; frac=1; kind='go';
  } else if(TM.mode==='seq'){
    const ph=cfg.phases[TM.idx]; big=fmtClock(TM.remaining); label=ph.label; kind=ph.kind==='rest'?'rest':'work';
    sub=`${TM.idx+1} / ${cfg.phases.length}`;
    if(TM.idx<cfg.phases.length-1) next='Next: '+cfg.phases[TM.idx+1].label;
    frac=1-(TM.remaining/TM.total);
  } else {
    big=fmtClock(TM.remaining); label=cfg.title; kind=cfg.rest?'rest':'work'; sub='of '+fmtClock(TM.total); frac=1-(TM.remaining/TM.total);
  }
  t.className='timer active '+kind;
  $('tm-label').textContent=label;
  $('tm-big').textContent=big;
  $('tm-sub').textContent=sub;
  $('tm-next').textContent=next;
  $('tm-fg').style.strokeDasharray=RC; $('tm-fg').style.strokeDashoffset=RC*(1-frac);
  // presets
  const pr=$('tm-presets');
  if(cfg.presets&&!TM.done){ pr.innerHTML=cfg.presets.map(s=>`<button class="tm-preset ${TM.total===s?'on':''}" onclick="openRest(${s})">${s<60?s+'s':(s/60)+'m'}</button>`).join(''); }
  else pr.innerHTML='';
  // controls
  const c=$('tm-ctl');
  if(TM.done){ c.innerHTML=`<button class="btn btn-acc" style="min-width:200px" onclick="closeTimer()">Done</button>`; return; }
  c.innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;gap:18px;width:100%">
      <div class="tm-round">
        <button class="tm-circ" onclick="tmAdd(-15)" ${TM.mode==='up'?'style="visibility:hidden"':''}>−15</button>
        <button class="tm-big-btn" onclick="tmToggle()">${TM.running?'❚❚':'▶'}</button>
        <button class="tm-circ" onclick="tmAdd(15)" ${TM.mode==='up'?'style="visibility:hidden"':''}>+15</button>
      </div>
      <button class="btn ${cfg.rest||TM.mode==='seq'?'btn-acc':''}" style="min-width:200px" onclick="${TM.mode==='seq'?'tmSkip()':'closeTimer()'}">${TM.mode==='seq'?'Skip':(cfg.rest?'Skip rest':'Close')}</button>
    </div>`;
}
function tmToggle(){ TM.running=!TM.running; drawTimer(); }
function tmAdd(s){ if(TM.mode==='up')return; TM.remaining=Math.max(1,TM.remaining+s); TM.total=Math.max(TM.total,TM.remaining); drawTimer(); }
function tmSkip(){ if(TM.mode!=='seq')return; TM.remaining=1; }

/* ── timer configs for blocks / wods ── */
const TIMERS={
  block1:()=>{ const mv=['KB swings','Burpees','DB thrusters','Jump squats','Mountain climbers'],ph=[];
    for(let r=1;r<=4;r++){ mv.forEach(m=>{ph.push({label:`R${r} · ${m}`,sec:40,kind:'work'});ph.push({label:'Off',sec:20,kind:'rest'});});
      if(r<4) ph.push({label:`Round ${r} done — rest`,sec:120,kind:'rest'});} return {title:'Block 1',mode:'seq',phases:ph}; },
  block2:()=>{ const b=['B1 · Snatch + burpees','B2 · Swings + jump squats','B3 · Thrusters + climbers','B4 · Lunges + push-ups'],ph=[];
    b.forEach((l,i)=>{ph.push({label:l,sec:300,kind:'work'}); if(i<3)ph.push({label:'Rest',sec:90,kind:'rest'});}); return {title:'Block 2',mode:'seq',phases:ph}; },
  block3:()=>{ const ph=[]; for(let i=1;i<=10;i++){ph.push({label:`Interval ${i} · Hard`,sec:30,kind:'work'});ph.push({label:'Easy',sec:60,kind:'rest'});} return {title:'Block 3',mode:'seq',phases:ph}; },
  wod1:()=>({title:'AMRAP 15',mode:'down',sec:900}),
  wod2:()=>({title:'WOD 2 · for time',mode:'up',target:720}),
  wod3:()=>{ const tk=['8 KB clean & press','10 renegade rows','12 goblet squats','10 KB swings'],ph=[];
    for(let i=0;i<20;i++)ph.push({label:`Min ${i+1} · ${tk[i%4]}`,sec:60,kind:'work'}); return {title:'EMOM 20',mode:'seq',phases:ph}; },

/* ═══════════════════════════════════════════════════════════════
   FIREBASE  (Google sign-in + Firestore auto-sync)
═══════════════════════════════════════════════════════════════ */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function initFirebase(){
  if(!FB_READY) return;
  try{
    const base='https://www.gstatic.com/firebasejs/10.12.0/';
    await loadScript(base+'firebase-app-compat.js');
    await loadScript(base+'firebase-auth-compat.js');
    await loadScript(base+'firebase-firestore-compat.js');
    firebase.initializeApp(FIREBASE_CONFIG);
    auth=firebase.auth(); db=firebase.firestore();
    try{ db.settings({ignoreUndefinedProperties:true}); }catch(e){}  // session rows carry optional undefined fields
    await auth.getRedirectResult().catch(()=>{});
    auth.onAuthStateChanged(onAuth);
  }catch(e){ console.warn('Firebase init failed',e); }
}
function signInUser(){
  if(!FB_READY||!auth){ toast('Add Firebase config first'); return; }
  const p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(err=>{ if(String(err.code).includes('popup')) auth.signInWithRedirect(p); else toast('Sign-in failed'); });
}
function signOutUser(){ if(auth&&confirm('Sign out? Data stays on this device.')){ if(_unsub)_unsub(); auth.signOut(); } }
async function onAuth(u){
  if(!u){ USER=null; SYNC='idle'; if(_unsub){_unsub();_unsub=null;} renderAcct(); return; }
  USER={uid:u.uid,email:u.email,name:u.displayName,photo:u.photoURL}; SYNC='sync'; renderAcct();
  const ref=db.collection('users').doc(u.uid);
  try{
    const snap=await ref.get();
    if(snap.exists) mergeCloud(snap.data());
    await pushCloud();               // write merged result
    SYNC='ok'; renderAcct(); render(S.view);
    _unsub=ref.onSnapshot(s=>{ const d=s.data(); if(d&&d.updatedAt>S.updatedAt){ mergeCloud(d); persist(false); render(S.view); renderAcct(); } });
  }catch(e){ SYNC='err'; renderAcct(); }
}
function unionById(a,b){ const m=new Map(); (a||[]).forEach(x=>m.set(x.id,x)); (b||[]).forEach(x=>m.set(x.id,x)); return [...m.values()]; }
function mergeCloud(d){
  S.sessions=unionById(S.sessions,d.sessions);
  S.bodyLog=unionById(S.bodyLog,d.bodyLog);
  S.runs=unionById(S.runs,d.runs);
  S.customWorkouts=unionById(S.customWorkouts,d.customWorkouts);
  S.exNotes=Object.assign({}, d.exNotes||{}, S.exNotes||{});  // local edits win
  if((d.updatedAt||0)>=S.updatedAt){ if(d.active!==undefined)S.active=d.active; if(d.draft!==undefined)S.draft=d.draft; }
  S.updatedAt=Math.max(S.updatedAt,d.updatedAt||0);
}
function scheduleCloud(){ clearTimeout(_cloudT); _cloudT=setTimeout(pushCloud,1500); }
async function pushCloud(){
  if(!USER||!db) return;
  SYNC='sync'; renderAcct();
  try{
    await db.collection('users').doc(USER.uid).set({
      active:S.active??null, draft:S.draft??null, sessions:S.sessions, bodyLog:S.bodyLog,
      runs:S.runs, customWorkouts:S.customWorkouts, exNotes:S.exNotes||{}, updatedAt:S.updatedAt }, {merge:true});
    SYNC='ok';
  }catch(e){ SYNC='err'; }
  renderAcct();
}

/* ── weekly Monday check-in (best-effort while app is open) ── */
function checkWeeklyReminder(){
  if(!S.remindWeekly) return;
  const wk=weekKey();
  if(S.lastRemindWeek===wk || bodyLoggedThisWeek()) return;  // once per week, and not if already logged
  S.lastRemindWeek=wk; persist(false);
  if('Notification' in window && Notification.permission==='granted'){
    const body='Take a progress photo, weigh in, and log it in the Body tab.';
    try{
      if(navigator.serviceWorker?.ready) navigator.serviceWorker.ready
        .then(reg=>reg.showNotification('MG Training — Monday check-in',{body,icon:'icon.svg',tag:'mgt-weekly'}))
        .catch(()=>new Notification('MG Training — Monday check-in',{body}));
      else new Notification('MG Training — Monday check-in',{body});
    }catch(e){}
  }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkWeeklyReminder(); });

(function init(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  hydrate(); buildNav(); nav('home');  // a saved draft surfaces as a Resume banner on Home
  checkWeeklyReminder();
  initFirebase();
})();
